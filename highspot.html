<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Revenue Enablement Portal — Highspot Design Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   Revenue Enablement Portal — design prototype
   Learn on the left. Pay attention in the centre. Act on the right.
   Neo-Apple look: warm cream canvas, matte ivory cards, soft warm
   shadows, satin emerald + amber accents, solid green pill CTAs.
   ============================================================ */

:root{
  /* accents — jewel tones on warm neutrals */
  --blue:#0F7E5C;          /* emerald — primary (Learn, links, focus) */
  --teal:#0B6B4D;          /* deep emerald — aware bell, share */
  --violet:#B7562F;        /* terracotta — Use column */
  --amber:#B07A22;         /* warm amber — do-not-share */
  --red:#B7452C;
  --grey:#6B7280;

  --green-deep:#065A40;
  --green-mid:#0B7A58;

  /* ink on warm white */
  --ink:#1C1B18;
  --ink-2:#4E4B44;
  --ink-3:#7E796F;
  --ink-4:#A39D91;

  /* surfaces */
  --paper:#FFFFFF;
  --paper-warm:#FBF7F0;
  --cream:#F8EFDE;

  --r-xl:36px;
  --r-lg:28px;
  --r-md:22px;
  --r-sm:16px;
  --r-pill:999px;

  /* warm, soft, matte shadows */
  --lift:
    0 1px 2px rgba(96,74,40,.06),
    0 8px 18px -8px rgba(96,74,40,.14),
    0 28px 50px -24px rgba(96,74,40,.22);
  --lift-hi:
    0 2px 4px rgba(96,74,40,.08),
    0 14px 26px -10px rgba(96,74,40,.18),
    0 44px 70px -30px rgba(96,74,40,.28);

  --hairline:1px solid rgba(96,74,40,.09);

  /* satin materials */
  --satin-green:
    radial-gradient(130% 170% at 18% -22%, rgba(255,255,255,.38), transparent 46%),
    linear-gradient(135deg,#149A72 0%,#0B7A58 48%,#065A40 100%);
  --satin-amber:
    radial-gradient(130% 170% at 18% -22%, rgba(255,255,255,.45), transparent 46%),
    linear-gradient(135deg,#F2AE4E 0%,#E08F2A 52%,#C4711A 100%);

  --gutter:clamp(16px,3vw,40px);
  --ease:cubic-bezier(.22,.61,.36,1);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}

/* warm studio canvas — cream, lit by a soft lamp top-right */
html{
  background-color:#EDE5D8;
  background-image:
    radial-gradient(950px 640px at 90% -12%, rgba(255,206,140,.50), transparent 58%),
    radial-gradient(760px 560px at -6% 16%, rgba(255,244,226,.75), transparent 55%),
    radial-gradient(900px 700px at 55% 115%, rgba(240,225,200,.6), transparent 60%),
    linear-gradient(180deg,#F6F1E8 0%,#F0E9DC 52%,#E9E0CF 100%);
  background-attachment:fixed;
  background-repeat:no-repeat;
  background-size:cover;
}

body{
  margin:0;
  min-height:100vh;
  font-family:'Plus Jakarta Sans','Nunito Sans',system-ui,-apple-system,sans-serif;
  color:var(--ink);
  background:transparent;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--green-mid);outline-offset:3px;border-radius:10px}

.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ---------- surface primitive: matte ivory card ---------- */
.glass{
  position:relative;
  border-radius:var(--r-lg);
  background:linear-gradient(180deg,#FFFFFF 0%,#FCF9F3 100%);
  border:var(--hairline);
  box-shadow:var(--lift);
}
.rim{position:relative}

/* ---------- top bar — white board with a cream search strip ---------- */
.topbar{
  position:sticky;top:0;z-index:60;
  padding:14px var(--gutter) 8px;
}
.topbar-in{
  position:relative;
  max-width:1560px;margin:0 auto;
  padding:12px 14px 12px 22px;
  display:flex;align-items:center;gap:18px;
  border-radius:var(--r-lg);
  background:linear-gradient(180deg,#FFFFFF,#FCF8F1);
  border:var(--hairline);
  box-shadow:var(--lift);
}
.brand{display:flex;align-items:center;gap:12px;flex-shrink:0}
.cloud{width:34px;height:24px;flex:none;color:var(--green-deep)}
.brand-text{line-height:1.15}
.brand-text b{display:block;font-size:15px;font-weight:800;letter-spacing:-.3px}
.brand-text span{display:block;font-size:11px;color:var(--ink-3);font-weight:600;letter-spacing:.24px}

/* search — the cream pill strip from the reference nav */
.searchbtn{
  position:relative;
  flex:1;min-width:0;max-width:620px;
  display:flex;align-items:center;gap:11px;
  padding:13px 22px;
  border-radius:var(--r-pill);
  background:linear-gradient(180deg,#FAF1DE,#F6EBD3);
  border:1px solid rgba(150,110,40,.14);
  color:#8A7D62;
  font-size:14px;font-weight:600;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 2px 6px -3px rgba(96,74,40,.15);
  transition:border-color .2s var(--ease),box-shadow .2s var(--ease),color .2s var(--ease);
}
.searchbtn:hover{
  color:#6E6046;
  border-color:rgba(150,110,40,.26);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 5px 12px -5px rgba(96,74,40,.22);
}
.searchbtn kbd{
  margin-left:auto;flex:none;
  font-family:inherit;font-size:11px;font-weight:700;
  padding:3px 8px;border-radius:8px;color:#A08D66;
  background:rgba(255,255,255,.75);
  border:1px solid rgba(150,110,40,.14);
}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:12px;flex-shrink:0}
.demo-pill{
  font-size:10.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;
  padding:7px 13px;border-radius:var(--r-pill);
  color:#9A6B14;
  background:linear-gradient(180deg,#FBF2DD,#F7E9C9);
  border:1px solid rgba(150,110,40,.18);
}
.avatar{
  width:38px;height:38px;border-radius:50%;flex:none;
  display:grid;place-items:center;
  font-size:12px;font-weight:800;letter-spacing:.3px;color:#fff;
  background:var(--satin-green);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 16px -7px rgba(9,90,64,.55);
}

/* ---------- shell ---------- */
.shell{max-width:1560px;margin:0 auto;padding:0 var(--gutter) 96px}

.masthead{padding:48px 0 30px}
.eyebrow{
  display:inline-flex;align-items:center;gap:9px;
  font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:14px;
}
.eyebrow::before{content:"";width:26px;height:4px;border-radius:4px;background:var(--satin-green)}
h1.page{
  margin:0;
  font-size:clamp(32px,4.4vw,54px);
  font-weight:800;letter-spacing:-1.6px;line-height:1.05;
  color:#171613;
}
.page-sub{margin:15px 0 0;max-width:70ch;font-size:15.5px;line-height:1.62;color:var(--ink-2)}

.principle{margin-top:26px;display:flex;flex-wrap:wrap;gap:10px}
.principle span{
  display:inline-flex;align-items:center;gap:9px;
  font-size:12.5px;font-weight:700;color:var(--ink-2);
  padding:10px 18px;border-radius:var(--r-pill);
  background:linear-gradient(180deg,#FFFFFF,#FBF5EA);
  border:var(--hairline);
  box-shadow:0 4px 10px -5px rgba(96,74,40,.16);
}
.principle span i{width:7px;height:7px;border-radius:50%;flex:none}

/* ---------- the three columns ---------- */
.triptych{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1.62fr) minmax(0,1fr);
  gap:22px;
  align-items:start;
}
.col{padding:26px;display:flex;flex-direction:column;gap:19px}
.col-hero{
  padding:30px;
  border-radius:var(--r-xl);
  background:linear-gradient(180deg,#FFFFFF 0%,#FAF4E9 100%);
  border:1px solid rgba(96,74,40,.11);
}

.col-head{display:flex;align-items:flex-start;gap:14px}
.col-mark{
  width:46px;height:46px;flex:none;border-radius:16px;
  display:grid;place-items:center;
  color:#fff !important;
  background:var(--satin-green);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 16px -7px rgba(9,90,64,.45);
}
.col-mark svg{width:20px;height:20px}
/* the Use column mark goes satin amber via its inline colour hook */
.col-mark[style*="--violet"],.col-mark[style*="#B7562F"]{background:var(--satin-amber);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 8px 16px -7px rgba(196,113,26,.5)}
.col-title{margin:0;font-size:19px;font-weight:800;letter-spacing:-.5px;line-height:1.2;color:#171613}
.col-hero .col-title{font-size:24px;letter-spacing:-.8px}
.col-note{margin:5px 0 0;font-size:12.5px;line-height:1.5;color:var(--ink-3)}

.subhead{
  display:flex;align-items:center;gap:10px;
  font-size:10.5px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;
  color:var(--ink-4);
  margin:2px 0 -4px;
}
.subhead::after{content:"";flex:1;height:1px;background:rgba(96,74,40,.12)}

/* list rows — soft ivory tiles */
.rows{display:flex;flex-direction:column;gap:9px;list-style:none;margin:0;padding:0}
.row{
  display:flex;align-items:flex-start;gap:13px;width:100%;text-align:left;
  padding:14px 16px;border-radius:var(--r-sm);
  background:#FDFBF6;
  border:var(--hairline);
  box-shadow:0 2px 5px -3px rgba(96,74,40,.10);
  transition:transform .2s var(--ease),box-shadow .2s var(--ease),background .2s var(--ease),border-color .2s var(--ease);
}
.row:hover{
  background:#FFFFFF;
  border-color:rgba(96,74,40,.16);
  transform:translateY(-2px);
  box-shadow:0 8px 18px -8px rgba(96,74,40,.24);
}
.row-ic{width:17px;height:17px;flex:none;margin-top:2px;color:var(--green-mid)}
.row-body{min-width:0;flex:1}
.row-title{display:block;font-size:13.5px;font-weight:700;line-height:1.4;letter-spacing:-.15px;color:#221F1A}
.row-meta{display:block;margin-top:3px;font-size:11.5px;color:var(--ink-3);line-height:1.45;font-weight:500}
.row-meta b{color:var(--ink-2);font-weight:700}

/* hero "aware" items — white cards with a satin colour tab */
.aware{display:flex;flex-direction:column;gap:13px}
.aware-item{
  display:block;width:100%;text-align:left;
  padding:19px 21px 19px 27px;border-radius:var(--r-md);
  position:relative;overflow:hidden;
  background:#FFFFFF;
  border:var(--hairline);
  box-shadow:0 4px 10px -5px rgba(96,74,40,.12),0 16px 32px -18px rgba(96,74,40,.18);
  transition:transform .22s var(--ease),box-shadow .22s var(--ease),border-color .22s var(--ease);
}
.aware-item::before{
  content:"";position:absolute;left:10px;top:16px;bottom:16px;width:5px;border-radius:5px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--k,var(--green-mid)) 72%,white),var(--k,var(--green-mid)));
}
.aware-item:hover{
  transform:translateY(-3px);
  border-color:rgba(96,74,40,.18);
  box-shadow:0 8px 18px -8px rgba(96,74,40,.20),0 30px 52px -26px rgba(96,74,40,.28);
}
.aware-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:9px}
.aware-kind{
  font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;
  color:var(--k,var(--green-mid));
}
.aware-when{font-size:11px;color:var(--ink-4);font-weight:600;margin-left:auto}
.aware-title{font-size:16.5px;font-weight:800;letter-spacing:-.4px;line-height:1.34;color:#171613}
.aware-desc{margin-top:7px;font-size:13px;line-height:1.6;color:var(--ink-2)}
.aware-foot{
  margin-top:13px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  font-size:11.5px;color:var(--ink-3);font-weight:600;
}
.aware-foot .dot{width:3px;height:3px;border-radius:50%;background:var(--ink-4);flex:none}

/* right column split: share vs do not share */
.split{display:flex;flex-direction:column;gap:11px}
.split-head{
  display:flex;align-items:center;gap:8px;
  font-size:11px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;
}
.split-head svg{width:14px;height:14px}
.share .split-head{color:var(--green-mid)}
.noshare .split-head{color:#A8721E}
.noshare .row{
  background:linear-gradient(180deg,#FBF3E1,#F8EDD3);
  border-color:rgba(168,114,30,.20);
}
.noshare .row:hover{
  background:#FDF8EC;
  border-color:rgba(168,114,30,.34);
}
.noshare .row-ic{color:#A8721E}
.guard{
  font-size:11.5px;line-height:1.55;color:#8F6212;font-weight:600;
  padding:12px 15px;border-radius:var(--r-sm);
  background:linear-gradient(180deg,#FBF2DD,#F7E9C9);
  border:1px dashed rgba(168,114,30,.32);
}

/* ---------- badges ---------- */
.badge{
  display:inline-flex;align-items:center;gap:5px;
  font-size:9.5px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;
  padding:5px 10px;border-radius:var(--r-pill);
  white-space:nowrap;
  border:1px solid transparent;
}
.badge::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.badge-partner{color:#07684A;background:#E2F4EB;border-color:rgba(11,122,88,.22)}
.badge-internal{color:#7A5410;background:#FAEED3;border-color:rgba(168,114,30,.24)}
.badge-restricted{color:#9C3A22;background:#FBE7DE;border-color:rgba(183,69,44,.26)}
.badge-draft{color:#5C6270;background:#EFEEE9;border-color:rgba(96,74,40,.14)}

/* ---------- section headings ---------- */
.section{margin-top:62px}
.section-head{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:22px}
.section-head h2{margin:0;font-size:clamp(21px,2.3vw,29px);font-weight:800;letter-spacing:-.8px;color:#171613}
.section-head p{margin:6px 0 0;font-size:13.5px;color:var(--ink-3);line-height:1.55;font-weight:500}
/* warm satin hairline — green flowing into amber */
.rainbow{
  height:4px;border-radius:4px;flex:1;min-width:120px;margin-bottom:12px;
  background:linear-gradient(90deg,#0B7A58,#5F8F3E 40%,#E08F2A 78%,#F2AE4E);
  opacity:.65;
}

/* ---------- product lanes ---------- */
.lane{margin-bottom:34px}
.lane-head{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.owner-chip{
  width:44px;height:44px;border-radius:15px;flex:none;
  display:grid;place-items:center;
  font-size:13px;font-weight:800;letter-spacing:.3px;color:#fff;
  background:
    radial-gradient(130% 170% at 18% -22%, rgba(255,255,255,.38), transparent 46%),
    linear-gradient(135deg,color-mix(in srgb,var(--k2,#0B7A58) 82%,white),var(--k2,#0B7A58) 55%,color-mix(in srgb,var(--k2,#0B7A58) 72%,black));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 16px -7px rgba(96,74,40,.40);
}
.lane-head b{display:block;font-size:15px;font-weight:800;letter-spacing:-.3px;color:#171613}
.lane-head span{display:block;font-size:11.5px;color:var(--ink-3);margin-top:2px;font-weight:600}
.lane-count{margin-left:auto;font-size:11.5px;color:var(--ink-4);font-weight:700}

.lane-rail{
  display:grid;
  grid-auto-flow:column;
  grid-auto-columns:minmax(320px,1fr);
  gap:18px;
  overflow-x:auto;
  padding:6px 6px 18px;
  scroll-snap-type:x proximity;
  scrollbar-width:thin;
  scrollbar-color:rgba(96,74,40,.25) transparent;
}
.lane-rail::-webkit-scrollbar{height:9px}
.lane-rail::-webkit-scrollbar-thumb{background:rgba(96,74,40,.18);border-radius:9px}
.lane-rail::-webkit-scrollbar-track{background:transparent}

.pcard{
  position:relative;overflow:hidden;
  scroll-snap-align:start;
  display:flex;flex-direction:column;gap:15px;
  padding:24px;text-align:left;
  border-radius:var(--r-lg);
  background:linear-gradient(180deg,#FFFFFF,#FCF8F1);
  border:var(--hairline);
  box-shadow:var(--lift);
  transition:transform .24s var(--ease),box-shadow .24s var(--ease),border-color .24s var(--ease);
}
.pcard:hover{
  transform:translateY(-6px);
  border-color:rgba(96,74,40,.16);
  box-shadow:var(--lift-hi);
}
.pcard-top{display:flex;align-items:flex-start;gap:13px}
.pcard-ic{
  width:48px;height:48px;flex:none;border-radius:16px;
  display:grid;place-items:center;
  color:#fff !important;
  background:
    radial-gradient(130% 170% at 18% -22%, rgba(255,255,255,.38), transparent 46%),
    linear-gradient(135deg,color-mix(in srgb,var(--k2,#0B7A58) 82%,white),var(--k2,#0B7A58) 55%,color-mix(in srgb,var(--k2,#0B7A58) 72%,black));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 16px -7px rgba(96,74,40,.35);
}
.pcard-ic svg{width:21px;height:21px}
.pcard h3{margin:0;font-size:16.5px;font-weight:800;letter-spacing:-.4px;line-height:1.25;color:#171613}
.pcard-purpose{margin:6px 0 0;font-size:12.5px;line-height:1.55;color:var(--ink-2)}
.pcard-owner{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-3);font-weight:700}
.pcard-owner i{width:7px;height:7px;border-radius:50%;flex:none}
.pcard-latest{
  padding:13px 15px;border-radius:var(--r-sm);
  background:#FAF5EB;
  border:var(--hairline);
  font-size:12px;line-height:1.55;color:var(--ink-2);font-weight:500;
}
.pcard-latest b{
  display:block;font-size:9.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;
  color:var(--ink-4);margin-bottom:5px;
}
.pcard-res{display:flex;flex-wrap:wrap;gap:7px}
.res-tag{
  font-size:10.5px;font-weight:700;color:var(--ink-2);
  padding:5px 12px;border-radius:var(--r-pill);
  background:#FFFFFF;
  border:var(--hairline);
}
.pcard-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:6px}
/* the reference's solid green pill button */
.open-cta{
  display:inline-flex;align-items:center;gap:8px;
  padding:11px 20px;border-radius:var(--r-pill);
  font-size:12.5px;font-weight:800;letter-spacing:-.1px;color:#fff;
  background:var(--satin-green);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 18px -8px rgba(9,90,64,.55);
  transition:box-shadow .22s var(--ease),transform .22s var(--ease),filter .22s var(--ease);
}
.open-cta svg{width:14px;height:14px;transition:transform .22s var(--ease)}
.pcard:hover .open-cta{
  filter:brightness(1.06);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 12px 24px -9px rgba(9,90,64,.6);
}
.pcard:hover .open-cta svg{transform:translateX(4px)}

/* ---------- recently updated ---------- */
.recent{padding:10px;display:flex;flex-direction:column;gap:7px}
.recent-row{
  display:flex;align-items:center;gap:16px;width:100%;text-align:left;
  padding:15px 19px;border-radius:var(--r-sm);
  background:#FDFBF6;
  border:1px solid transparent;
  transition:background .18s var(--ease),border-color .18s var(--ease),box-shadow .18s var(--ease),transform .18s var(--ease);
}
.recent-row:hover{
  background:#FFFFFF;
  border-color:rgba(96,74,40,.14);
  transform:translateY(-1.5px);
  box-shadow:0 8px 18px -8px rgba(96,74,40,.22);
}
.recent-when{
  font-size:10.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;
  color:var(--ink-4);width:96px;flex:none;
}
.recent-main{flex:1;min-width:0}
.recent-main b{display:block;font-size:13.5px;font-weight:700;letter-spacing:-.2px;color:#221F1A}
.recent-main span{display:block;margin-top:3px;font-size:11.5px;color:var(--ink-3);font-weight:500}
.recent-side{display:flex;align-items:center;gap:10px;flex:none}

/* ---------- product page ---------- */
.crumbs{display:flex;align-items:center;gap:9px;padding:30px 0 0;font-size:12.5px;color:var(--ink-3);font-weight:600}
.crumbs a:hover{color:var(--ink)}
.crumbs svg{width:12px;height:12px;opacity:.5}

.phead{display:flex;align-items:flex-start;gap:22px;flex-wrap:wrap;padding:22px 0 28px}
.phead-ic{
  width:74px;height:74px;flex:none;border-radius:24px;
  display:grid;place-items:center;
  color:#fff !important;
  background:
    radial-gradient(130% 170% at 18% -22%, rgba(255,255,255,.38), transparent 46%),
    linear-gradient(135deg,color-mix(in srgb,var(--k2,#0B7A58) 82%,white),var(--k2,#0B7A58) 55%,color-mix(in srgb,var(--k2,#0B7A58) 72%,black));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 12px 24px -10px rgba(96,74,40,.40);
}
.phead-ic svg{width:30px;height:30px}
.phead-main{flex:1;min-width:280px}
.phead h1{margin:0;font-size:clamp(27px,3.4vw,42px);font-weight:800;letter-spacing:-1.3px;line-height:1.08;color:#171613}
.phead-purpose{margin:11px 0 0;max-width:68ch;font-size:14.5px;line-height:1.62;color:var(--ink-2)}
.phead-facts{margin-top:18px;display:flex;flex-wrap:wrap;gap:10px}
.fact{
  display:inline-flex;align-items:center;gap:8px;
  font-size:11.5px;font-weight:700;color:var(--ink-2);
  padding:8px 14px;border-radius:var(--r-pill);
  background:#FFFFFF;
  border:var(--hairline);
  box-shadow:0 3px 8px -4px rgba(96,74,40,.15);
}
.fact svg{width:13px;height:13px;color:var(--ink-3)}

/* segmented tabs — ivory strip, solid green thumb */
.tabs{
  display:flex;gap:5px;flex-wrap:wrap;
  padding:6px;border-radius:var(--r-pill);
  background:linear-gradient(180deg,#FAF1DE,#F6EBD3);
  border:1px solid rgba(150,110,40,.14);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8);
  width:fit-content;max-width:100%;
  margin-bottom:28px;
}
.tab{
  padding:10px 22px;border-radius:var(--r-pill);
  font-size:13px;font-weight:700;color:#8A7D62;
  transition:color .18s var(--ease),background .18s var(--ease),box-shadow .18s var(--ease);
}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{
  color:#fff;
  background:var(--satin-green);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 14px -6px rgba(9,90,64,.55);
}

.panel{animation:rise .34s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.stack{display:flex;flex-direction:column;gap:22px}
.card{padding:26px}
.card-title{margin:0 0 5px;font-size:18px;font-weight:800;letter-spacing:-.5px;color:#171613}
.card-note{margin:0 0 18px;font-size:12.5px;line-height:1.55;color:var(--ink-3);font-weight:500}

.timeline{list-style:none;margin:0;padding:0 0 0 26px;position:relative}
.timeline::before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:2px;border-radius:2px;background:rgba(96,74,40,.14)}
.timeline li{position:relative;padding:0 0 22px}
.timeline li:last-child{padding-bottom:0}
.timeline li::before{
  content:"";position:absolute;left:-25px;top:4px;
  width:14px;height:14px;border-radius:50%;
  background:linear-gradient(160deg,color-mix(in srgb,var(--k,var(--green-mid)) 55%,white),var(--k,var(--green-mid)));
  box-shadow:0 0 0 3px #fff,0 3px 6px -2px rgba(96,74,40,.35);
}
.tl-when{font-size:10.5px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:var(--ink-4)}
.tl-title{margin-top:5px;font-size:14.5px;font-weight:800;letter-spacing:-.3px;color:#221F1A}
.tl-desc{margin-top:6px;font-size:12.5px;line-height:1.6;color:var(--ink-2);max-width:72ch}

.help-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:15px}
.help-card{
  padding:21px;border-radius:var(--r-md);
  background:#FDFBF6;
  border:var(--hairline);
  box-shadow:0 4px 10px -5px rgba(96,74,40,.12);
}
.help-card b{display:block;font-size:14px;font-weight:800;margin-bottom:7px;color:#171613;letter-spacing:-.2px}
.help-card p{margin:0;font-size:12.5px;line-height:1.6;color:var(--ink-2)}
.help-card .who{margin-top:12px;display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--green-mid);font-weight:700}

/* ---------- search overlay ---------- */
.overlay{
  position:fixed;inset:0;z-index:100;
  display:none;
  padding:clamp(40px,10vh,120px) 20px 40px;
  background:rgba(74,60,38,.30);
  backdrop-filter:blur(10px) saturate(120%);
  -webkit-backdrop-filter:blur(10px) saturate(120%);
}
.overlay.on{display:block;animation:fade .2s var(--ease) both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.finder{
  position:relative;
  max-width:720px;margin:0 auto;
  border-radius:var(--r-lg);
  background:linear-gradient(180deg,#FFFFFF,#FCF8F1);
  border:var(--hairline);
  box-shadow:0 24px 50px -20px rgba(60,45,25,.35),0 56px 100px -40px rgba(60,45,25,.45);
  overflow:hidden;
  animation:pop .24s var(--ease) both;
}
@keyframes pop{from{opacity:0;transform:translateY(-12px) scale(.985)}to{opacity:1;transform:none}}
.finder-top{display:flex;align-items:center;gap:14px;padding:21px 25px;border-bottom:var(--hairline)}
.finder-top svg{width:19px;height:19px;color:var(--ink-3);flex:none}
.finder-top input{
  flex:1;min-width:0;background:none;border:none;outline:none;
  font:inherit;font-size:17px;font-weight:600;color:var(--ink);letter-spacing:-.2px;
}
.finder-top input::placeholder{color:var(--ink-4);font-weight:500}
.finder-esc{
  font-size:10.5px;font-weight:800;color:#A08D66;padding:5px 10px;border-radius:8px;
  background:#FAF1DE;border:1px solid rgba(150,110,40,.16);
}
.finder-body{max-height:min(460px,52vh);overflow-y:auto;padding:10px}
.fgroup-label{
  padding:13px 15px 7px;
  font-size:10px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-4);
}
.fresult{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  padding:12px 15px;border-radius:var(--r-sm);
  border:1px solid transparent;
  transition:background .14s var(--ease),border-color .14s var(--ease);
}
.fresult:hover,.fresult.sel{
  background:#F1F8F3;
  border-color:rgba(11,122,88,.22);
}
.fresult .fic{width:16px;height:16px;flex:none;color:var(--green-mid)}
.fresult-main{flex:1;min-width:0}
.fresult-main b{display:block;font-size:13.5px;font-weight:700;letter-spacing:-.15px;color:#221F1A;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fresult-main span{display:block;margin-top:2px;font-size:11.5px;color:var(--ink-3);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fempty{padding:36px 20px;text-align:center;font-size:13.5px;color:var(--ink-3);font-weight:500}
mark{background:rgba(11,122,88,.16);color:#07684A;border-radius:4px;padding:0 3px;font-weight:800}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(20px);
  z-index:120;opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:12px;
  padding:14px 22px;border-radius:var(--r-pill);
  background:linear-gradient(180deg,#FFFFFF,#FCF8F1);
  border:var(--hairline);
  box-shadow:0 14px 30px -12px rgba(60,45,25,.35);
  font-size:13px;font-weight:700;color:#221F1A;
  transition:opacity .26s var(--ease),transform .26s var(--ease);
  max-width:min(90vw,520px);
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast svg{width:17px;height:17px;color:var(--green-mid);flex:none}

/* ---------- footer ---------- */
.foot{
  max-width:1560px;margin:0 auto;
  padding:30px var(--gutter) 44px;
  border-top:1px solid rgba(96,74,40,.12);
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  font-size:11.5px;color:var(--ink-4);font-weight:600;
}
.foot .cloud{width:26px;height:19px;opacity:.6;color:var(--green-deep)}
.foot i{font-style:italic;font-weight:500}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .triptych{grid-template-columns:1fr;gap:18px}
  .col-hero{order:-1}
}
@media (max-width:720px){
  .topbar{padding:10px var(--gutter) 4px}
  .topbar-in{flex-wrap:wrap;gap:12px;padding:14px 16px}
  .searchbtn{order:3;flex-basis:100%;max-width:none}
  .demo-pill{display:none}
  .lane-rail{grid-auto-columns:minmax(84%,1fr)}
  .recent-row{flex-wrap:wrap;gap:8px}
  .recent-when{width:auto}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  html{scroll-behavior:auto}
}
</style>

/* recency ordering for "Recently Updated" — lower = more recent */
const RECENCY = { 'Yesterday':1,'2 days ago':2,'4 days ago':4,'6 days ago':6,'8 days ago':8,'2 weeks ago':14,'3 weeks ago':21,'1 month ago':30,'Last month':32,'5 weeks ago':35,'6 weeks ago':42 };

/* ============================================================
   HELPERS
   ============================================================ */

const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const view = $('#view');

function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function icon(id,cls=''){ return `<svg class="${cls}" aria-hidden="true"><use href="#${id}"/></svg>`; }
function badge(status){ const [c,l]=BADGE[status]||BADGE.draft; return `<span class="badge ${c}">${l}</span>`; }
function byId(id){ return PRODUCTS.find(p=>p.id===id); }
function ownerOf(p){ return OWNERS[p.owner]; }

let toastTimer;
function toast(msg){
  $('#toastMsg').textContent = msg;
  const el = $('#toast');
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('on'), 2600);
}

/* every non-navigating item behaves like a real link would, then explains itself */
function wireStubs(root){
  $$('[data-stub]',root).forEach(el=>{
    el.addEventListener('click',()=>toast(el.dataset.stub));
  });
}

        <a class="tab" role="tab" aria-selected="${k===tab}" href="#/p/${p.id}/${k}">${label}</a>`).join('')}
    </div>

    <div class="panel" role="tabpanel">${panelFor(p,tab)}</div>
  `;
  wireStubs(view);
  window.scrollTo({top:0,behavior:'instant' in window ? 'instant' : 'auto'});
}

function panelFor(p, tab){
  if(tab==='learn')   return panelLearn(p);
  if(tab==='use')     return panelUse(p);
  if(tab==='updates') return panelUpdates(p);
  if(tab==='help')    return panelHelp(p);
  return panelOverview(p);
}

/* ============================================================
   SEARCH — flat index across everything
   ============================================================ */

function buildIndex(){
  const idx = [];
  PRODUCTS.forEach(p=>{
    idx.push({ group:'Products', t:p.name, s:p.purpose, ic:p.icon, href:`#/p/${p.id}` });

    [...p.learn.required.map(x=>[x,'Required']),
     ...p.learn.recommended.map(x=>[x,'Recommended']),
     ...p.learn.recordings.map(x=>[x,'Recorded session'])
    ].forEach(([l,kind])=>{
      idx.push({ group:'Learn', t:l.t, s:`${kind} · ${p.name}`, ic:l.ic, href:`#/p/${p.id}/learn` });
    });

    p.use.partner.forEach(u=>{
      idx.push({ group:'Share with partners', t:u.t, s:`${p.name} · Partner ready`, ic:u.ic, href:`#/p/${p.id}/use` });
    });
    p.use.internal.forEach(u=>{
      idx.push({ group:'Do not share', t:u.t, s:`${p.name} · Internal`, ic:'i-lock', href:`#/p/${p.id}/use` });
    });

    p.updates.forEach(u=>{
      idx.push({ group:'Updates', t:u.title, s:`${p.name} · ${u.when}`, ic:'i-bell', href:`#/p/${p.id}/updates` });
    });
  });
  return idx;
}
const INDEX = buildIndex();

const overlay = $('#overlay'), qInput = $('#q'), resultsEl = $('#results');
let selIdx = 0, hits = [];

function openSearch(){
  overlay.classList.add('on');
  qInput.value = '';
  runSearch('');
  setTimeout(()=>qInput.focus(),20);
}
function closeSearch(){
  overlay.classList.remove('on');
}
function hl(text,q){
  if(!q) return esc(text);
  const i = text.toLowerCase().indexOf(q.toLowerCase());
  if(i<0) return esc(text);
  return esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+q.length))+'</mark>'+esc(text.slice(i+q.length));
}
function runSearch(q){
  const term = q.trim().toLowerCase();
  hits = term
    ? INDEX.filter(x=>(x.t+' '+x.s+' '+x.group).toLowerCase().includes(term)).slice(0,30)
    : INDEX.filter(x=>x.group==='Products');

  selIdx = 0;
  if(!hits.length){
    resultsEl.innerHTML = `<div class="fempty">Nothing matches “${esc(q)}”.<br>Try a product name, an asset type, or “restricted”.</div>`;
    return;
  }
  let html='', lastGroup='', n=0;
  hits.forEach(h=>{
    if(h.group!==lastGroup){ html += `<div class="fgroup-label">${esc(h.group)}</div>`; lastGroup=h.group; }
    html += `
      <a class="fresult${n===0?' sel':''}" data-i="${n}" href="${h.href}">
        ${icon(h.ic,'fic')}
        <span class="fresult-main"><b>${hl(h.t,q.trim())}</b><span>${esc(h.s)}</span></span>
        ${icon('i-chev','fic')}
      </a>`;
    n++;
  });
  resultsEl.innerHTML = html;
  $$('.fresult',resultsEl).forEach(el=>{
    el.addEventListener('click',closeSearch);
    el.addEventListener('mousemove',()=>select(+el.dataset.i));
  });
}
function select(i){
  const els = $$('.fresult',resultsEl);
  if(!els.length) return;
  selIdx = (i+els.length)%els.length;
  els.forEach((e,n)=>e.classList.toggle('sel',n===selIdx));
  els[selIdx].scrollIntoView({block:'nearest'});
}

$('#openSearch').addEventListener('click',openSearch);
qInput.addEventListener('input',e=>runSearch(e.target.value));
overlay.addEventListener('click',e=>{ if(e.target===overlay) closeSearch(); });

document.addEventListener('keydown',e=>{
  const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
  if(e.key==='/' && !typing){ e.preventDefault(); openSearch(); return; }
  if((e.key==='k'||e.key==='K') && (e.metaKey||e.ctrlKey)){ e.preventDefault(); openSearch(); return; }
  if(!overlay.classList.contains('on')) return;

  if(e.key==='Escape'){ closeSearch(); }
  else if(e.key==='ArrowDown'){ e.preventDefault(); select(selIdx+1); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); select(selIdx-1); }
  else if(e.key==='Enter'){
    const el = $$('.fresult',resultsEl)[selIdx];
    if(el){ location.hash = el.getAttribute('href'); closeSearch(); }
  }
});

/* ============================================================
   ROUTER
   ============================================================ */

function route(){
  const raw = location.hash.replace(/^#\/?/,'');
  const parts = raw.split('/').filter(Boolean);
  if(parts[0]==='p' && parts[1]) renderProduct(parts[1], parts[2]);
  else renderHome();
}

window.addEventListener('hashchange',route);
route();
</script>
