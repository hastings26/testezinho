<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Revenue Enablement Portal — Highspot Design Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   Revenue Enablement Portal — design prototype
   See the whole. Pick a lane. Go deep.
   Neumorphism: one warm-grey material for everything. Elements are
   extruded from the surface (light top-left, shade bottom-right) or
   pressed into it. No borders, no fills — colour only as stone-pastel
   dots and inks.
   ============================================================ */

:root{
  /* the single material */
  --surface:#E7E9EF;
  --surface-hi:#F3F5FA;

  /* stone pastels */
  --blue:#2B57D0;        /* sage — primary (Learn) */
  --teal:#0A8A68;        /* deep sage — share, bell */
  --violet:#7C5CD6;      /* ochre — Use */
  --amber:#A67F0E;       /* deadline / do-not-share */
  --red:#D2493F;
  --grey:#8B8983;

  --sage:#2B57D0;
  --ochre:#0AA57E;
  --blush:#D6478F;

  /* soft ink — never pure black */
  --ink:#343842;
  --ink-2:#5B6070;
  --ink-3:#858B9B;
  --ink-4:#A6ACBB;

  --r-xl:40px;
  --r-lg:30px;
  --r-md:22px;
  --r-sm:16px;
  --r-pill:999px;

  /* the neumorphic pair: white light + grey shade */
  --up:
    -7px -7px 16px rgba(255,255,255,.85),
    8px 9px 18px rgba(148,156,176,.42);
  --up-lg:
    -12px -12px 26px rgba(255,255,255,.9),
    14px 16px 34px rgba(148,156,176,.48);
  --up-sm:
    -4px -4px 10px rgba(255,255,255,.8),
    5px 6px 12px rgba(148,156,176,.38);
  --down:
    inset -5px -5px 11px rgba(255,255,255,.85),
    inset 5px 5px 11px rgba(148,156,176,.42);
  --down-sm:
    inset -3px -3px 7px rgba(255,255,255,.8),
    inset 3px 3px 7px rgba(148,156,176,.36);

  --gutter:clamp(16px,3vw,40px);
  --ease:cubic-bezier(.22,.61,.36,1);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}

/* one uniform surface — the illusion needs it */
html{
  background-color:var(--surface);
  background-image:radial-gradient(1400px 900px at 50% -20%, rgba(255,255,255,.35), transparent 60%);
  background-attachment:fixed;
  background-repeat:no-repeat;
}

body{
  margin:0;
  min-height:100vh;
  font-family:'Plus Jakarta Sans','Nunito Sans',system-ui,-apple-system,sans-serif;
  color:var(--ink);
  background:transparent;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--sage);outline-offset:3px;border-radius:10px}

.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ---------- surface primitives ---------- */
.glass{
  position:relative;
  border-radius:var(--r-lg);
  background:var(--surface);
  box-shadow:var(--up-lg);
}
.rim{position:relative}

/* ---------- top bar — one extruded slab ---------- */
.topbar{
  position:sticky;top:0;z-index:60;
  padding:16px var(--gutter) 10px;
  background:linear-gradient(180deg,var(--surface) 62%,rgba(232,230,225,0));
}
.topbar-in{
  position:relative;
  max-width:1560px;margin:0 auto;
  padding:13px 16px 13px 24px;
  display:flex;align-items:center;gap:18px;
  border-radius:var(--r-lg);
  background:var(--surface);
  box-shadow:var(--up);
}
.brand{display:flex;align-items:center;gap:12px;flex-shrink:0}
.cloud{width:34px;height:24px;flex:none;color:var(--sage)}
.brand-text{line-height:1.15}
.brand-text b{display:block;font-size:15px;font-weight:800;letter-spacing:-.3px}
.brand-text span{display:block;font-size:11px;color:var(--ink-3);font-weight:600;letter-spacing:.24px}

/* search — pressed into the slab */
.searchbtn{
  position:relative;
  flex:1;min-width:0;max-width:620px;
  display:flex;align-items:center;gap:11px;
  padding:14px 22px;
  border-radius:var(--r-pill);
  background:var(--surface);
  color:var(--ink-3);
  font-size:14px;font-weight:600;
  box-shadow:var(--down);
  transition:color .2s var(--ease),box-shadow .2s var(--ease);
}
.searchbtn:hover{color:var(--ink-2)}
.searchbtn kbd{
  margin-left:auto;flex:none;
  font-family:inherit;font-size:11px;font-weight:700;
  padding:4px 9px;border-radius:9px;color:var(--ink-3);
  background:var(--surface);
  box-shadow:var(--up-sm);
}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:14px;flex-shrink:0}
.demo-pill{
  font-size:10.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;
  padding:8px 14px;border-radius:var(--r-pill);
  color:var(--amber);
  background:var(--surface);
  box-shadow:var(--down-sm);
}
.avatar{
  width:40px;height:40px;border-radius:50%;flex:none;
  display:grid;place-items:center;
  font-size:12px;font-weight:800;letter-spacing:.3px;color:var(--sage);
  background:var(--surface);
  box-shadow:var(--up-sm);
}

/* ---------- shell ---------- */
.shell{max-width:1560px;margin:0 auto;padding:0 var(--gutter) 96px}

.masthead{padding:48px 0 30px}
.eyebrow{
  display:inline-flex;align-items:center;gap:9px;
  font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:14px;
}
.eyebrow::before{content:"";width:22px;height:8px;border-radius:8px;background:var(--sage);
  box-shadow:-2px -2px 5px rgba(255,255,255,.7),3px 3px 6px rgba(148,156,176,.4)}
h1.page{
  margin:0;
  font-size:clamp(32px,4.4vw,54px);
  font-weight:800;letter-spacing:-1.6px;line-height:1.05;
  color:#303542;
}
.page-sub{margin:15px 0 0;max-width:70ch;font-size:15.5px;line-height:1.62;color:var(--ink-2)}

.principle{margin-top:26px;display:flex;flex-wrap:wrap;gap:12px}
.principle span{
  display:inline-flex;align-items:center;gap:10px;
  font-size:12.5px;font-weight:700;color:var(--ink-2);
  padding:11px 19px;border-radius:var(--r-pill);
  background:var(--surface);
  box-shadow:var(--up-sm);
}
.principle span i{width:9px;height:9px;border-radius:50%;flex:none;
  box-shadow:inset -1px -1px 2px rgba(255,255,255,.5),inset 1px 1px 2px rgba(0,0,0,.18)}

/* ---------- the three columns ---------- */
.triptych{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1.62fr) minmax(0,1fr);
  gap:26px;
  align-items:start;
}
.col{padding:28px;display:flex;flex-direction:column;gap:20px}
.col-hero{
  padding:32px;
  border-radius:var(--r-xl);
}

.col-head{display:flex;align-items:flex-start;gap:15px}
.col-mark{
  width:48px;height:48px;flex:none;border-radius:16px;
  display:grid;place-items:center;
  background:var(--surface);
  box-shadow:var(--up-sm);
}
.col-mark svg{width:20px;height:20px}
.col-title{margin:0;font-size:19px;font-weight:800;letter-spacing:-.5px;line-height:1.2;color:#303542}
.col-hero .col-title{font-size:24px;letter-spacing:-.8px}
.col-note{margin:5px 0 0;font-size:12.5px;line-height:1.5;color:var(--ink-3)}

.subhead{
  display:flex;align-items:center;gap:10px;
  font-size:10.5px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;
  color:var(--ink-4);
  margin:2px 0 -4px;
}
.subhead::after{content:"";flex:1;height:5px;border-radius:5px;box-shadow:var(--down-sm)}

/* list rows — gently extruded tiles that press in on hover */
.rows{display:flex;flex-direction:column;gap:12px;list-style:none;margin:0;padding:0}
.row{
  display:flex;align-items:flex-start;gap:13px;width:100%;text-align:left;
  padding:15px 17px;border-radius:var(--r-sm);
  background:var(--surface);
  box-shadow:var(--up-sm);
  transition:box-shadow .22s var(--ease),transform .22s var(--ease);
}
.row:hover{transform:translateY(-1px);box-shadow:var(--up)}
.row:active{transform:none;box-shadow:var(--down-sm)}
.row-ic{width:17px;height:17px;flex:none;margin-top:2px;color:var(--sage)}
.row-body{min-width:0;flex:1}
.row-title{display:block;font-size:13.5px;font-weight:700;line-height:1.4;letter-spacing:-.15px;color:#3C414E}
.row-meta{display:block;margin-top:3px;font-size:11.5px;color:var(--ink-3);line-height:1.45;font-weight:500}
.row-meta b{color:var(--ink-2);font-weight:700}

/* hero "aware" items — bigger extrusions with a pastel pebble bar */
.aware{display:flex;flex-direction:column;gap:16px}
.aware-item{
  display:block;width:100%;text-align:left;
  padding:20px 22px 20px 30px;border-radius:var(--r-md);
  position:relative;overflow:hidden;
  background:var(--surface);
  box-shadow:var(--up);
  transition:box-shadow .22s var(--ease),transform .22s var(--ease);
}
.aware-item::before{
  content:"";position:absolute;left:12px;top:18px;bottom:18px;width:6px;border-radius:6px;
  background:var(--k,var(--sage));
  box-shadow:inset -1px -1px 2px rgba(255,255,255,.45),inset 1px 1px 2px rgba(0,0,0,.15);
}
.aware-item:hover{transform:translateY(-2px);box-shadow:var(--up-lg)}
.aware-item:active{transform:none;box-shadow:var(--down-sm)}
.aware-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:9px}
.aware-kind{
  font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;
  color:var(--k,var(--sage));
  filter:saturate(1.1) brightness(.82);
}
.aware-when{font-size:11px;color:var(--ink-4);font-weight:600;margin-left:auto}
.aware-title{font-size:16.5px;font-weight:800;letter-spacing:-.4px;line-height:1.34;color:#303542}
.aware-desc{margin-top:7px;font-size:13px;line-height:1.6;color:var(--ink-2)}
.aware-foot{
  margin-top:13px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  font-size:11.5px;color:var(--ink-3);font-weight:600;
}
.aware-foot .dot{width:3px;height:3px;border-radius:50%;background:var(--ink-4);flex:none}

/* right column split: share raised, do-not-share pressed in (locked away) */
.split{display:flex;flex-direction:column;gap:12px}
.split-head{
  display:flex;align-items:center;gap:8px;
  font-size:11px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;
}
.split-head svg{width:14px;height:14px}
.share .split-head{color:var(--teal)}
.noshare .split-head{color:var(--amber)}
.noshare .row{box-shadow:var(--down-sm)}
.noshare .row:hover{transform:none;box-shadow:var(--down)}
.noshare .row-ic{color:var(--amber)}
.guard{
  font-size:11.5px;line-height:1.55;color:var(--amber);font-weight:600;
  padding:13px 16px;border-radius:var(--r-sm);
  background:var(--surface);
  box-shadow:var(--down-sm);
}

/* ---------- badges — engraved pills with a pastel dot ---------- */
.badge{
  display:inline-flex;align-items:center;gap:6px;
  font-size:9.5px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;
  padding:6px 11px;border-radius:var(--r-pill);
  white-space:nowrap;
  background:var(--surface);
  box-shadow:var(--down-sm);
}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;
  box-shadow:inset -1px -1px 1.5px rgba(255,255,255,.5),inset 1px 1px 1.5px rgba(0,0,0,.2)}
.badge-partner{color:#0A8A68}
.badge-internal{color:#2B57D0}
.badge-restricted{color:#C24339}
.badge-draft{color:#7A8090}

/* ---------- section headings ---------- */
.section{margin-top:64px}
.section-head{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:24px}
.section-head h2{margin:0;font-size:clamp(21px,2.3vw,29px);font-weight:800;letter-spacing:-.8px;color:#303542}
.section-head p{margin:6px 0 0;font-size:13.5px;color:var(--ink-3);line-height:1.55;font-weight:500}
/* the Pax8 rainbow line, softened and engraved into the surface */
.rainbow{
  height:8px;border-radius:8px;flex:1;min-width:120px;margin-bottom:12px;
  background:linear-gradient(90deg,#5B7FE8,#3FB6ED,#2FCFA9,#5ED97F,#A98BF0,#F077BE,#F2CE4E,#F08A7A);
  box-shadow:
    inset 0 1.5px 3px rgba(82,92,116,.35),
    inset 0 -1px 0 rgba(255,255,255,.55);
}

/* ---------- product lanes ---------- */
.lane{margin-bottom:38px}
.lane-head{display:flex;align-items:center;gap:15px;margin-bottom:18px}
.owner-chip{
  width:46px;height:46px;border-radius:16px;flex:none;
  display:grid;place-items:center;
  font-size:14px;font-weight:800;letter-spacing:.3px;
  color:var(--k2,var(--sage));
  background:var(--surface);
  box-shadow:var(--up-sm);
}
.lane-head b{display:block;font-size:15px;font-weight:800;letter-spacing:-.3px;color:#303542}
.lane-head span{display:block;font-size:11.5px;color:var(--ink-3);margin-top:2px;font-weight:600}
.lane-count{margin-left:auto;font-size:11.5px;color:var(--ink-4);font-weight:700}

.lane-rail{
  display:grid;
  grid-auto-flow:column;
  grid-auto-columns:minmax(320px,1fr);
  gap:24px;
  overflow-x:auto;
  padding:8px 8px 24px;
  scroll-snap-type:x proximity;
  scrollbar-width:thin;
  scrollbar-color:rgba(104,114,138,.35) transparent;
}
.lane-rail::-webkit-scrollbar{height:9px}
.lane-rail::-webkit-scrollbar-thumb{background:rgba(104,114,138,.28);border-radius:9px}
.lane-rail::-webkit-scrollbar-track{background:transparent}

.pcard{
  position:relative;
  scroll-snap-align:start;
  display:flex;flex-direction:column;gap:16px;
  padding:26px;text-align:left;
  border-radius:var(--r-lg);
  background:var(--surface);
  box-shadow:var(--up);
  transition:transform .24s var(--ease),box-shadow .24s var(--ease);
}
.pcard:hover{transform:translateY(-4px);box-shadow:var(--up-lg)}
.pcard-top{display:flex;align-items:flex-start;gap:14px}
.pcard-ic{
  width:50px;height:50px;flex:none;border-radius:17px;
  display:grid;place-items:center;
  color:var(--k2,var(--sage));
  background:var(--surface);
  box-shadow:var(--up-sm);
}
.pcard-ic svg{width:22px;height:22px}
.pcard h3{margin:0;font-size:16.5px;font-weight:800;letter-spacing:-.4px;line-height:1.25;color:#303542}
.pcard-purpose{margin:6px 0 0;font-size:12.5px;line-height:1.55;color:var(--ink-2)}
.pcard-owner{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-3);font-weight:700}
.pcard-owner i{width:8px;height:8px;border-radius:50%;flex:none;
  box-shadow:inset -1px -1px 2px rgba(255,255,255,.5),inset 1px 1px 2px rgba(0,0,0,.18)}
.pcard-latest{
  padding:14px 16px;border-radius:var(--r-sm);
  background:var(--surface);
  box-shadow:var(--down-sm);
  font-size:12px;line-height:1.55;color:var(--ink-2);font-weight:500;
}
.pcard-latest b{
  display:block;font-size:9.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;
  color:var(--ink-4);margin-bottom:5px;
}
.pcard-res{display:flex;flex-wrap:wrap;gap:9px}
.res-tag{
  font-size:10.5px;font-weight:700;color:var(--ink-2);
  padding:6px 13px;border-radius:var(--r-pill);
  background:var(--surface);
  box-shadow:var(--up-sm);
}
.pcard-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:6px}
/* extruded pill button — presses in when clicked */
.open-cta{
  display:inline-flex;align-items:center;gap:8px;
  padding:12px 21px;border-radius:var(--r-pill);
  font-size:12.5px;font-weight:800;letter-spacing:-.1px;color:var(--ink-2);
  background:var(--surface);
  box-shadow:var(--up-sm);
  transition:box-shadow .22s var(--ease),color .22s var(--ease);
}
.open-cta svg{width:14px;height:14px;color:var(--sage);transition:transform .22s var(--ease)}
.pcard:hover .open-cta{color:var(--ink);box-shadow:var(--up)}
.pcard:hover .open-cta svg{transform:translateX(4px)}
.pcard:active .open-cta{box-shadow:var(--down-sm)}

/* ---------- recently updated ---------- */
.recent{padding:14px;display:flex;flex-direction:column;gap:10px}
.recent-row{
  display:flex;align-items:center;gap:16px;width:100%;text-align:left;
  padding:15px 19px;border-radius:var(--r-sm);
  background:var(--surface);
  transition:box-shadow .2s var(--ease),transform .2s var(--ease);
}
.recent-row:hover{transform:translateY(-1px);box-shadow:var(--up-sm)}
.recent-row:active{transform:none;box-shadow:var(--down-sm)}
.recent-when{
  font-size:10.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;
  color:var(--ink-4);width:96px;flex:none;
}
.recent-main{flex:1;min-width:0}
.recent-main b{display:block;font-size:13.5px;font-weight:700;letter-spacing:-.2px;color:#3C414E}
.recent-main span{display:block;margin-top:3px;font-size:11.5px;color:var(--ink-3);font-weight:500}
.recent-side{display:flex;align-items:center;gap:10px;flex:none}
.recent-side .row-ic{color:var(--ink-4)}

/* ---------- product page ---------- */
.crumbs{display:flex;align-items:center;gap:9px;padding:30px 0 0;font-size:12.5px;color:var(--ink-3);font-weight:600}
.crumbs a:hover{color:var(--ink)}
.crumbs svg{width:12px;height:12px;opacity:.5}

.phead{display:flex;align-items:flex-start;gap:24px;flex-wrap:wrap;padding:24px 0 30px}
.phead-ic{
  width:78px;height:78px;flex:none;border-radius:26px;
  display:grid;place-items:center;
  color:var(--k2,var(--sage));
  background:var(--surface);
  box-shadow:var(--up);
}
.phead-ic svg{width:32px;height:32px}
.phead-main{flex:1;min-width:280px}
.phead h1{margin:0;font-size:clamp(27px,3.4vw,42px);font-weight:800;letter-spacing:-1.3px;line-height:1.08;color:#303542}
.phead-purpose{margin:11px 0 0;max-width:68ch;font-size:14.5px;line-height:1.62;color:var(--ink-2)}
.phead-facts{margin-top:18px;display:flex;flex-wrap:wrap;gap:12px}
.fact{
  display:inline-flex;align-items:center;gap:8px;
  font-size:11.5px;font-weight:700;color:var(--ink-2);
  padding:9px 15px;border-radius:var(--r-pill);
  background:var(--surface);
  box-shadow:var(--up-sm);
}
.fact svg{width:13px;height:13px;color:var(--ink-3)}

/* tabs — engraved track, extruded active thumb */
.tabs{
  display:flex;gap:6px;flex-wrap:wrap;
  padding:8px;border-radius:var(--r-pill);
  background:var(--surface);
  box-shadow:var(--down);
  width:fit-content;max-width:100%;
  margin-bottom:30px;
}
.tab{
  padding:10px 22px;border-radius:var(--r-pill);
  font-size:13px;font-weight:700;color:var(--ink-3);
  transition:color .18s var(--ease),box-shadow .18s var(--ease),background .18s var(--ease);
}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{
  color:#303542;
  background:var(--surface);
  box-shadow:var(--up-sm);
}

.panel{animation:rise .34s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.stack{display:flex;flex-direction:column;gap:26px}
.card{padding:28px}
.card-title{margin:0 0 5px;font-size:18px;font-weight:800;letter-spacing:-.5px;color:#303542}
.card-note{margin:0 0 18px;font-size:12.5px;line-height:1.55;color:var(--ink-3);font-weight:500}

.timeline{list-style:none;margin:0;padding:0 0 0 28px;position:relative}
.timeline::before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:6px;border-radius:6px;
  box-shadow:var(--down-sm)}
.timeline li{position:relative;padding:0 0 24px}
.timeline li:last-child{padding-bottom:0}
.timeline li::before{
  content:"";position:absolute;left:-26px;top:4px;
  width:15px;height:15px;border-radius:50%;
  background:var(--k,var(--sage));
  box-shadow:
    inset -2px -2px 3px rgba(255,255,255,.5),
    inset 2px 2px 3px rgba(0,0,0,.18),
    -2px -2px 5px rgba(255,255,255,.7),
    3px 3px 7px rgba(148,156,176,.45);
}
.tl-when{font-size:10.5px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:var(--ink-4)}
.tl-title{margin-top:5px;font-size:14.5px;font-weight:800;letter-spacing:-.3px;color:#3C414E}
.tl-desc{margin-top:6px;font-size:12.5px;line-height:1.6;color:var(--ink-2);max-width:72ch}

.help-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.help-card{
  padding:22px;border-radius:var(--r-md);
  background:var(--surface);
  box-shadow:var(--up-sm);
}
.help-card b{display:block;font-size:14px;font-weight:800;margin-bottom:7px;color:#303542;letter-spacing:-.2px}
.help-card p{margin:0;font-size:12.5px;line-height:1.6;color:var(--ink-2)}
.help-card .who{margin-top:12px;display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--teal);font-weight:700}

/* ---------- search overlay ---------- */
.overlay{
  position:fixed;inset:0;z-index:100;
  display:none;
  padding:clamp(40px,10vh,120px) 20px 40px;
  background:rgba(104,114,138,.30);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}
.overlay.on{display:block;animation:fade .2s var(--ease) both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.finder{
  position:relative;
  max-width:720px;margin:0 auto;
  border-radius:var(--r-lg);
  background:var(--surface);
  box-shadow:
    -14px -14px 30px rgba(255,255,255,.55),
    18px 20px 44px rgba(82,92,116,.45);
  overflow:hidden;
  animation:pop .24s var(--ease) both;
}
@keyframes pop{from{opacity:0;transform:translateY(-12px) scale(.985)}to{opacity:1;transform:none}}
.finder-top{display:flex;align-items:center;gap:14px;padding:22px 26px}
.finder-top svg{width:19px;height:19px;color:var(--ink-3);flex:none}
.finder-top input{
  flex:1;min-width:0;background:none;border:none;outline:none;
  font:inherit;font-size:17px;font-weight:600;color:var(--ink);letter-spacing:-.2px;
}
.finder-top input::placeholder{color:var(--ink-4);font-weight:500}
.finder-esc{
  font-size:10.5px;font-weight:800;color:var(--ink-3);padding:5px 10px;border-radius:9px;
  background:var(--surface);box-shadow:var(--up-sm);
}
.finder-body{max-height:min(460px,52vh);overflow-y:auto;padding:12px 14px 16px}
.fgroup-label{
  padding:13px 15px 7px;
  font-size:10px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-4);
}
.fresult{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  padding:13px 16px;border-radius:var(--r-sm);
  background:var(--surface);
  transition:box-shadow .16s var(--ease);
}
.fresult:hover,.fresult.sel{box-shadow:var(--up-sm)}
.fresult:active{box-shadow:var(--down-sm)}
.fresult .fic{width:16px;height:16px;flex:none;color:var(--sage)}
.fresult-main{flex:1;min-width:0}
.fresult-main b{display:block;font-size:13.5px;font-weight:700;letter-spacing:-.15px;color:#3C414E;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fresult-main span{display:block;margin-top:2px;font-size:11.5px;color:var(--ink-3);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fempty{padding:36px 20px;text-align:center;font-size:13.5px;color:var(--ink-3);font-weight:500}
mark{background:transparent;color:#5F7442;border-radius:4px;padding:0;font-weight:800;
  box-shadow:inset 0 -2px 0 rgba(126,145,89,.55)}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(20px);
  z-index:120;opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:12px;
  padding:15px 24px;border-radius:var(--r-pill);
  background:var(--surface);
  box-shadow:
    -10px -10px 22px rgba(255,255,255,.6),
    12px 14px 30px rgba(82,92,116,.4);
  font-size:13px;font-weight:700;color:#3C414E;
  transition:opacity .26s var(--ease),transform .26s var(--ease);
  max-width:min(90vw,520px);
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast svg{width:17px;height:17px;color:var(--sage);flex:none}

/* ---------- footer ---------- */
.foot{
  max-width:1560px;margin:0 auto;
  padding:34px var(--gutter) 44px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  font-size:11.5px;color:var(--ink-4);font-weight:600;
}
.foot::before{content:"";display:block;width:100%;height:6px;border-radius:6px;box-shadow:var(--down-sm);margin-bottom:8px}
.foot .cloud{width:26px;height:19px;opacity:.6;color:var(--ink-3)}
.foot i{font-style:italic;font-weight:500}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .triptych{grid-template-columns:1fr;gap:22px}
  .col-hero{order:-1}
}
@media (max-width:720px){
  .topbar{padding:10px var(--gutter) 4px}
  .topbar-in{flex-wrap:wrap;gap:12px;padding:14px 16px}
  .searchbtn{order:3;flex-basis:100%;max-width:none}
  .demo-pill{display:none}
  .lane-rail{grid-auto-columns:minmax(84%,1fr)}
  .recent-row{flex-wrap:wrap;gap:8px}
  .recent-when{width:auto}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  html{scroll-behavior:auto}
}

.aware-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:20px;align-items:start}

.lp-card{padding:30px;display:flex;flex-direction:column;gap:16px}
.lane-intro{font-size:13px;color:var(--ink-2);line-height:1.6}

.lane-sec{scroll-margin-top:120px}

}
.hero-card::after{

.hero-card:active{transform:none;box-shadow:var(--down-sm)}
.hero-kind{

  font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;
  padding:7px 13px;border-radius:var(--r-pill);
  color:var(--k,var(--sage));
  filter:saturate(1.1) brightness(.82);
  box-shadow:var(--down-sm);
  margin-top:10px;
}
.hero-title{margin:4px 0 0;font-size:20px;font-weight:800;letter-spacing:-.5px;line-height:1.25;color:#303542}
.hero-desc{margin:0;font-size:13px;line-height:1.6;color:var(--ink-2)}
.hero-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:10px;flex-wrap:wrap}
.hero-when{font-size:11px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--ink-4)}
.hero-lane{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:800;color:var(--ink-2)}
.hero-lane svg{width:13px;height:13px;color:var(--sage);transition:transform .2s var(--ease)}
.hero-card:hover .hero-lane svg{transform:translateX(4px)}

/* ---------- art wells, lane hero, self-evident affordances ---------- */
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:24px;align-items:start}
.cols3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px;align-items:start}
.art-well{
  border-radius:var(--r-md);
  padding:8px;
  background:var(--surface);
  box-shadow:var(--down-sm);
}
.art-well svg{display:block;width:100%;height:auto}
.hero-art{
  position:absolute;right:-16px;bottom:-8px;width:150px;
  opacity:.5;pointer-events:none;
  transition:opacity .25s var(--ease),transform .25s var(--ease);
}
.hero-card{padding-right:120px}
.hero-card:hover .hero-art{opacity:.85;transform:translateY(-3px)}
.lp-card{position:relative;padding-bottom:74px}
.lp-go{
  position:absolute;right:22px;bottom:20px;
  width:46px;height:46px;border-radius:50%;
  display:grid;place-items:center;
  background:var(--surface);
  box-shadow:var(--up-sm);
  transition:box-shadow .2s var(--ease);
}
.lp-go svg{width:16px;height:16px;color:var(--sage);transition:transform .2s var(--ease)}
.lp-card:hover .lp-go{box-shadow:var(--up)}
.lp-card:hover .lp-go svg{transform:translateX(3px)}
.lp-card:active .lp-go{box-shadow:var(--down-sm)}
.lane-hero{
  display:grid;grid-template-columns:minmax(0,1.45fr) minmax(240px,1fr);
  gap:30px;align-items:center;
  padding:34px;margin-top:20px;
}
.lane-hero h1{margin:10px 0 16px;font-size:clamp(26px,3.2vw,40px);font-weight:800;letter-spacing:-1.2px;line-height:1.08;color:#303542}
.lh-priority{
  padding:18px 20px;border-radius:var(--r-md);
  box-shadow:var(--down-sm);
  margin-bottom:18px;
  position:relative;
}
.lh-priority::before{
  content:"";position:absolute;left:0;top:18px;bottom:18px;width:5px;border-radius:0 5px 5px 0;
  background:var(--k,var(--sage));
}
.lh-art{align-self:stretch;display:flex;align-items:center}
.lh-art svg{width:100%}
@media (max-width:900px){

  .lh-art{max-width:340px}
  .hero-card{padding-right:26px}
  .hero-art{width:110px;opacity:.3}
}

/* ============================================================
   HELPERS
   ============================================================ */

const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const view = $('#view');

function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function icon(id,cls=''){ return `<svg class="${cls}" aria-hidden="true"><use href="#${id}"/></svg>`; }
function badge(status){ const [c,l]=BADGE[status]||BADGE.draft; return `<span class="badge ${c}">${l}</span>`; }
function laneById(id){ return LANES.find(l=>l.id===id); }
function fact(t){ return `<span class="fact">${esc(t)}</span>`; }

let toastTimer;
function toast(msg){
  $('#toastMsg').textContent = msg;
  const el = $('#toast');
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('on'), 2600);
}
function wireStubs(root){
  $$('[data-stub]',root).forEach(el=>{
    el.addEventListener('click',()=>toast(el.dataset.stub));
  });
}

}

   SEARCH
   ============================================================ */

function buildIndex(){
  const idx = [];
  LANES.forEach(l=>{
    idx.push({ group:'Lanes', t:l.name, s:l.blurb, ic:l.icon, lane:l.id, sec:'' });
    l.aware.forEach(a=>{
      idx.push({ group:'Featured & priorities', t:a.title, s:`${a.kind} · ${l.name}`, ic:'i-bell', lane:l.id, sec:'priorities' });
    });
    [...l.learn.required,...l.learn.recommended,...l.learn.recordings].forEach(x=>{
      idx.push({ group:'Learn', t:x.t, s:l.name, ic:x.ic, lane:l.id, sec:'learn' });
    });
    l.use.partner.forEach(u=>{
      idx.push({ group:'Share with partners', t:u.t, s:`${l.name} · Partner ready`, ic:u.ic, lane:l.id, sec:'use' });
    });
    l.use.internal.forEach(u=>{
      idx.push({ group:'Do not share', t:u.t, s:`${l.name} · Internal`, ic:'i-lock', lane:l.id, sec:'use' });
    });
    l.updates.forEach(u=>{
      idx.push({ group:'Updates', t:u.title, s:`${l.name} · ${u.when}`, ic:'i-bell', lane:l.id, sec:'updates' });
    });
  });
  return idx;
}
const INDEX = buildIndex();

const overlay = $('#overlay'), qInput = $('#q'), resultsEl = $('#results');
let selIdx = 0, hits = [];

function openSearch(){
  overlay.classList.add('on');
  qInput.value = '';
  runSearch('');
  setTimeout(()=>qInput.focus(),20);
}
function closeSearch(){ overlay.classList.remove('on'); }
function goTo(el){
  const sec = el.dataset.sec;
  location.hash = `#/lane/${el.dataset.lane}${sec?'/'+sec:''}`;
  closeSearch();
}
function hl(text,q){
  if(!q) return esc(text);
  const i = text.toLowerCase().indexOf(q.toLowerCase());
  if(i<0) return esc(text);
  return esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+q.length))+'</mark>'+esc(text.slice(i+q.length));
}
function runSearch(q){
  const term = q.trim().toLowerCase();
  hits = term
    ? INDEX.filter(x=>(x.t+' '+x.s+' '+x.group).toLowerCase().includes(term)).slice(0,30)
    : INDEX.filter(x=>x.group==='Lanes');

  selIdx = 0;
  if(!hits.length){
    resultsEl.innerHTML = `<div class="fempty">Nothing matches “${esc(q)}”.</div>`;
    return;
  }
  let html='', lastGroup='', n=0;
  hits.forEach(h=>{
    if(h.group!==lastGroup){ html += `<div class="fgroup-label">${esc(h.group)}</div>`; lastGroup=h.group; }
    html += `
      <button class="fresult${n===0?' sel':''}" data-i="${n}" data-lane="${h.lane}" data-sec="${h.sec}">
        ${icon(h.ic,'fic')}
        <span class="fresult-main"><b>${hl(h.t,q.trim())}</b><span>${esc(h.s)}</span></span>
        ${icon('i-chev','fic')}
      </button>`;
    n++;
  });
  resultsEl.innerHTML = html;
  $$('.fresult',resultsEl).forEach(el=>{
    el.addEventListener('click',()=>goTo(el));
    el.addEventListener('mousemove',()=>select(+el.dataset.i));
  });
}
function select(i){
  const els = $$('.fresult',resultsEl);
  if(!els.length) return;
  selIdx = (i+els.length)%els.length;
  els.forEach((e,n)=>e.classList.toggle('sel',n===selIdx));
  els[selIdx].scrollIntoView({block:'nearest'});
}

$('#openSearch').addEventListener('click',openSearch);
qInput.addEventListener('input',e=>runSearch(e.target.value));
overlay.addEventListener('click',e=>{ if(e.target===overlay) closeSearch(); });

document.addEventListener('keydown',e=>{
  const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
  if(e.key==='/' && !typing){ e.preventDefault(); openSearch(); return; }
  if((e.key==='k'||e.key==='K') && (e.metaKey||e.ctrlKey)){ e.preventDefault(); openSearch(); return; }
  if(!overlay.classList.contains('on')) return;

  if(e.key==='Escape'){ closeSearch(); }
  else if(e.key==='ArrowDown'){ e.preventDefault(); select(selIdx+1); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); select(selIdx-1); }
  else if(e.key==='Enter'){
    const el = $$('.fresult',resultsEl)[selIdx];
    if(el) goTo(el);
  }
});

/* ============================================================
   ROUTER
   ============================================================ */

function route(){
  const parts = location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
  if(parts[0]==='lane' && parts[1]) renderLane(parts[1], parts[2]);
  else renderHome();
}

window.addEventListener('hashchange',route);
route();
</script>
