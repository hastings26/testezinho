<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Impara l'Italiano — Learn Italian</title>
<style>
  :root {
    --green: #009246;
    --white: #ffffff;
    --red: #ce2b37;
    --ink: #1d2129;
    --muted: #6b7280;
    --bg: #f6f7f9;
    --card: #ffffff;
    --line: #e6e8eb;
    --shadow: 0 6px 24px rgba(20, 24, 31, 0.08);
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  header {
    background: linear-gradient(90deg, var(--green) 0 33%, var(--white) 33% 66%, var(--red) 66% 100%);
    height: 6px;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 28px 20px 64px; }
  .hero { text-align: center; margin-bottom: 28px; }
  .hero h1 { font-size: 2rem; margin: 12px 0 4px; letter-spacing: -0.02em; }
  .hero p { color: var(--muted); margin: 0; }
  .flag { font-size: 2.4rem; }

  nav.tabs {
    display: flex; gap: 6px; background: var(--card); padding: 6px;
    border-radius: 999px; box-shadow: var(--shadow); margin: 0 auto 26px;
    max-width: 460px;
  }
  nav.tabs button {
    flex: 1; border: 0; background: transparent; padding: 10px 8px;
    border-radius: 999px; font-size: 0.9rem; font-weight: 600; cursor: pointer;
    color: var(--muted); transition: all .18s ease;
  }
  nav.tabs button.active { background: var(--green); color: #fff; }

  .panel { display: none; }
  .panel.active { display: block; animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* Flashcard */
  .card-scene { perspective: 1200px; margin: 0 auto 18px; max-width: 460px; }
  .flashcard {
    position: relative; width: 100%; height: 240px; cursor: pointer;
    transform-style: preserve-3d; transition: transform .55s cubic-bezier(.2,.7,.2,1);
  }
  .flashcard.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; backface-visibility: hidden;
    background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; text-align: center; border: 1px solid var(--line);
  }
  .face .word { font-size: 2rem; font-weight: 700; letter-spacing: -0.01em; }
  .face .sub { color: var(--muted); margin-top: 8px; font-size: 0.95rem; }
  .face .tag { position: absolute; top: 14px; left: 16px; font-size: 0.72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
  .back { transform: rotateY(180deg); background: #fbfdfb; }
  .back .word { color: var(--green); }
  .hint { text-align: center; color: var(--muted); font-size: 0.85rem; margin-bottom: 14px; }

  .controls { display: flex; gap: 10px; justify-content: center; align-items: center; }
  button.btn {
    border: 0; border-radius: 12px; padding: 12px 18px; font-size: 0.95rem; font-weight: 600;
    cursor: pointer; background: var(--card); color: var(--ink); box-shadow: var(--shadow);
    border: 1px solid var(--line); transition: transform .12s ease;
  }
  button.btn:active { transform: scale(.96); }
  button.btn.primary { background: var(--green); color: #fff; border-color: transparent; }
  button.btn.speak { font-size: 1.2rem; padding: 12px 14px; }
  .counter { text-align: center; color: var(--muted); font-size: 0.85rem; margin-top: 14px; }

  /* Category chips */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 20px; }
  .chip {
    border: 1px solid var(--line); background: var(--card); border-radius: 999px;
    padding: 7px 14px; font-size: 0.85rem; font-weight: 600; cursor: pointer; color: var(--muted);
  }
  .chip.active { background: var(--ink); color: #fff; border-color: transparent; }

  /* Quiz */
  .quiz-q { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 26px 22px; text-align: center; border: 1px solid var(--line); margin-bottom: 16px; }
  .quiz-q .prompt-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
  .quiz-q .prompt-word { font-size: 1.9rem; font-weight: 700; margin: 8px 0 0; }
  .options { display: grid; gap: 10px; }
  .option {
    border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 14px 16px;
    font-size: 1rem; font-weight: 600; cursor: pointer; text-align: left; transition: all .15s ease;
  }
  .option:hover { border-color: var(--green); }
  .option.correct { background: #e7f6ec; border-color: var(--green); color: #0a6b34; }
  .option.wrong { background: #fdeaec; border-color: var(--red); color: #a01523; }
  .option.disabled { pointer-events: none; opacity: .75; }
  .scorebar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; color: var(--muted); font-size: 0.9rem; }
  .scorebar strong { color: var(--ink); }

  /* Phrasebook */
  .phrase {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px;
  }
  .phrase .it { font-weight: 700; font-size: 1.05rem; }
  .phrase .en { color: var(--muted); font-size: 0.9rem; }
  .phrase .txt { flex: 1; }
  .phrase button { border: 0; background: #f0f2f4; border-radius: 10px; cursor: pointer; font-size: 1.1rem; padding: 8px 10px; }
  .section-title { font-size: 0.8rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; margin: 22px 0 10px; }

  footer { text-align: center; color: var(--muted); font-size: 0.8rem; margin-top: 40px; }
  footer b { color: var(--green); } footer i { color: var(--red); font-style: normal; }
</style>

<header></header>
<div class="wrap">
  <div class="hero">
    <div class="flag">🇮🇹</div>
    <h1>Impara l'Italiano</h1>
    <p>A quick, friendly way to start learning Italian.</p>
  </div>

  <nav class="tabs">
    <button data-tab="learn" class="active">Flashcards</button>
    <button data-tab="quiz">Quiz</button>
    <button data-tab="phrases">Phrasebook</button>
  </nav>

  <!-- FLASHCARDS -->
  <section id="learn" class="panel active">
    <div class="chips" id="cat-chips"></div>
    <div class="card-scene">
      <div class="flashcard" id="flashcard">
        <div class="face front">
          <div class="tag" id="fc-cat"></div>
          <div class="word" id="fc-front"></div>
          <div class="sub" id="fc-pron"></div>
        </div>
        <div class="face back">
          <div class="tag">English</div>
          <div class="word" id="fc-back"></div>
          <div class="sub" id="fc-example"></div>
        </div>
      </div>
    </div>
    <div class="hint">Tap the card to flip it</div>
    <div class="controls">
      <button class="btn" id="prev">← Prev</button>
      <button class="btn speak" id="fc-speak" title="Hear it">🔊</button>
      <button class="btn primary" id="next">Next →</button>
    </div>
    <div class="counter" id="fc-counter"></div>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="panel">
    <div class="scorebar">
      <span>Score: <strong id="q-score">0</strong></span>
      <span>Question <strong id="q-num">1</strong> / <strong id="q-total">10</strong></span>
      <span>Streak: <strong id="q-streak">0</strong> 🔥</span>
    </div>
    <div class="quiz-q">
      <div class="prompt-label">What does this mean?</div>
      <div class="prompt-word" id="q-word"></div>
    </div>
    <div class="options" id="q-options"></div>
    <div class="controls" style="margin-top:16px;">
      <button class="btn primary" id="q-next" style="display:none;">Next question →</button>
      <button class="btn" id="q-restart" style="display:none;">Restart quiz</button>
    </div>
  </section>

  <!-- PHRASEBOOK -->
  <section id="phrases" class="panel">
    <div id="phrasebook"></div>
  </section>

  <footer>Made with <b>verde</b>, bianco &amp; <i>rosso</i> — buono studio! 🇮🇹</footer>
</div>

<script>
  // ---- Vocabulary data ----
  const VOCAB = [
    { cat: "Greetings", it: "Ciao", en: "Hi / Bye", pron: "chow", ex: "Ciao, come stai?" },
    { cat: "Greetings", it: "Buongiorno", en: "Good morning", pron: "bwon-JOR-no", ex: "Buongiorno a tutti!" },
    { cat: "Greetings", it: "Buonasera", en: "Good evening", pron: "bwo-na-SE-ra", ex: "Buonasera, signora." },
    { cat: "Greetings", it: "Grazie", en: "Thank you", pron: "GRAH-tsee-eh", ex: "Grazie mille!" },
    { cat: "Greetings", it: "Prego", en: "You're welcome", pron: "PREH-go", ex: "Prego, si figuri." },
    { cat: "Greetings", it: "Per favore", en: "Please", pron: "per fa-VOH-reh", ex: "Un caffè, per favore." },
    { cat: "Greetings", it: "Arrivederci", en: "Goodbye", pron: "ah-ree-veh-DER-chee", ex: "Arrivederci, a domani!" },
    { cat: "Greetings", it: "Scusi", en: "Excuse me", pron: "SKOO-zee", ex: "Scusi, dov'è il bagno?" },

    { cat: "Numbers", it: "Uno", en: "One", pron: "OO-no", ex: "Uno, due, tre." },
    { cat: "Numbers", it: "Due", en: "Two", pron: "DOO-eh", ex: "Ho due sorelle." },
    { cat: "Numbers", it: "Tre", en: "Three", pron: "treh", ex: "Sono le tre." },
    { cat: "Numbers", it: "Quattro", en: "Four", pron: "KWAH-tro", ex: "Un tavolo per quattro." },
    { cat: "Numbers", it: "Cinque", en: "Five", pron: "CHEEN-kweh", ex: "Cinque euro." },
    { cat: "Numbers", it: "Dieci", en: "Ten", pron: "dee-EH-chee", ex: "Dieci minuti." },

    { cat: "Food", it: "Acqua", en: "Water", pron: "AH-kwa", ex: "Un'acqua naturale, grazie." },
    { cat: "Food", it: "Vino", en: "Wine", pron: "VEE-no", ex: "Un bicchiere di vino rosso." },
    { cat: "Food", it: "Pane", en: "Bread", pron: "PAH-neh", ex: "Vorrei del pane." },
    { cat: "Food", it: "Formaggio", en: "Cheese", pron: "for-MAH-jo", ex: "Mi piace il formaggio." },
    { cat: "Food", it: "Caffè", en: "Coffee", pron: "kaf-FEH", ex: "Un caffè, per favore." },
    { cat: "Food", it: "Gelato", en: "Ice cream", pron: "jeh-LAH-to", ex: "Prendo un gelato al cioccolato." },
    { cat: "Food", it: "Il conto", en: "The bill", pron: "eel KON-to", ex: "Il conto, per favore." },

    { cat: "Travel", it: "Dov'è...?", en: "Where is...?", pron: "do-VEH", ex: "Dov'è la stazione?" },
    { cat: "Travel", it: "Stazione", en: "Station", pron: "sta-tsee-OH-neh", ex: "La stazione è vicina." },
    { cat: "Travel", it: "Treno", en: "Train", pron: "TREH-no", ex: "Il treno per Roma." },
    { cat: "Travel", it: "Albergo", en: "Hotel", pron: "al-BER-go", ex: "Cerco un albergo." },
    { cat: "Travel", it: "A sinistra", en: "To the left", pron: "ah see-NEE-stra", ex: "Gira a sinistra." },
    { cat: "Travel", it: "A destra", en: "To the right", pron: "ah DEH-stra", ex: "Gira a destra." },

    { cat: "Basics", it: "Sì", en: "Yes", pron: "see", ex: "Sì, certo!" },
    { cat: "Basics", it: "No", en: "No", pron: "no", ex: "No, grazie." },
    { cat: "Basics", it: "Bene", en: "Well / Good", pron: "BEH-neh", ex: "Sto molto bene." },
    { cat: "Basics", it: "Non capisco", en: "I don't understand", pron: "non ka-PEES-ko", ex: "Scusi, non capisco." },
    { cat: "Basics", it: "Come stai?", en: "How are you?", pron: "KOH-meh stai", ex: "Ciao! Come stai?" },
    { cat: "Basics", it: "Mi chiamo...", en: "My name is...", pron: "mee kee-AH-mo", ex: "Mi chiamo Alex." },
  ];

  const PHRASES = [
    { group: "Essentials", items: [
      { it: "Parla inglese?", en: "Do you speak English?" },
      { it: "Non parlo italiano.", en: "I don't speak Italian." },
      { it: "Può ripetere, per favore?", en: "Can you repeat, please?" },
      { it: "Mi dispiace.", en: "I'm sorry." },
    ]},
    { group: "At the restaurant", items: [
      { it: "Vorrei prenotare un tavolo.", en: "I'd like to book a table." },
      { it: "Che cosa mi consiglia?", en: "What do you recommend?" },
      { it: "È delizioso!", en: "It's delicious!" },
      { it: "Il conto, per favore.", en: "The bill, please." },
    ]},
    { group: "Getting around", items: [
      { it: "Quanto costa?", en: "How much does it cost?" },
      { it: "Dov'è il bagno?", en: "Where is the bathroom?" },
      { it: "A che ora apre?", en: "What time does it open?" },
      { it: "Mi sono perso.", en: "I'm lost." },
    ]},
  ];

  // ---- Speech ----
  let itVoice = null;
  function pickVoice() {
    const voices = speechSynthesis.getVoices();
    itVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith("it")) || null;
  }
  if ("speechSynthesis" in window) {
    pickVoice();
    speechSynthesis.onvoiceschanged = pickVoice;
  }
  function speak(text) {
    if (!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "it-IT";
    if (itVoice) u.voice = itVoice;
    u.rate = 0.9;
    speechSynthesis.speak(u);
  }

  // ---- Tabs ----
  document.querySelectorAll("nav.tabs button").forEach(b => {
    b.addEventListener("click", () => {
      document.querySelectorAll("nav.tabs button").forEach(x => x.classList.remove("active"));
      document.querySelectorAll(".panel").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
      document.getElementById(b.dataset.tab).classList.add("active");
    });
  });

  // ---- Flashcards ----
  const categories = ["All", ...[...new Set(VOCAB.map(v => v.cat))]];
  let activeCat = "All";
  let deck = VOCAB.slice();
  let idx = 0;

  const chipsEl = document.getElementById("cat-chips");
  categories.forEach(c => {
    const el = document.createElement("button");
    el.className = "chip" + (c === "All" ? " active" : "");
    el.textContent = c;
    el.addEventListener("click", () => {
      activeCat = c;
      document.querySelectorAll(".chip").forEach(x => x.classList.remove("active"));
      el.classList.add("active");
      deck = c === "All" ? VOCAB.slice() : VOCAB.filter(v => v.cat === c);
      idx = 0;
      renderCard();
    });
    chipsEl.appendChild(el);
  });

  const flashcard = document.getElementById("flashcard");
  function renderCard() {
    flashcard.classList.remove("flipped");
    const v = deck[idx];
    document.getElementById("fc-cat").textContent = v.cat;
    document.getElementById("fc-front").textContent = v.it;
    document.getElementById("fc-pron").textContent = "🗣 " + v.pron;
    document.getElementById("fc-back").textContent = v.en;
    document.getElementById("fc-example").textContent = "“" + v.ex + "”";
    document.getElementById("fc-counter").textContent = (idx + 1) + " of " + deck.length;
  }
  flashcard.addEventListener("click", () => flashcard.classList.toggle("flipped"));
  document.getElementById("next").addEventListener("click", () => { idx = (idx + 1) % deck.length; renderCard(); });
  document.getElementById("prev").addEventListener("click", () => { idx = (idx - 1 + deck.length) % deck.length; renderCard(); });
  document.getElementById("fc-speak").addEventListener("click", (e) => { e.stopPropagation(); speak(deck[idx].it); });

  // ---- Quiz ----
  const QUIZ_LEN = 10;
  let qPool = [], qIndex = 0, score = 0, streak = 0, answered = false;

  function shuffle(a) {
    const arr = a.slice();
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }
  function startQuiz() {
    qPool = shuffle(VOCAB).slice(0, QUIZ_LEN);
    qIndex = 0; score = 0; streak = 0;
    document.getElementById("q-total").textContent = QUIZ_LEN;
    document.getElementById("q-restart").style.display = "none";
    renderQuestion();
  }
  function renderQuestion() {
    answered = false;
    const q = qPool[qIndex];
    document.getElementById("q-word").textContent = q.it;
    document.getElementById("q-num").textContent = qIndex + 1;
    document.getElementById("q-score").textContent = score;
    document.getElementById("q-streak").textContent = streak;
    document.getElementById("q-next").style.display = "none";

    const wrong = shuffle(VOCAB.filter(v => v.en !== q.en)).slice(0, 3);
    const opts = shuffle([q, ...wrong]);
    const box = document.getElementById("q-options");
    box.innerHTML = "";
    opts.forEach(o => {
      const b = document.createElement("button");
      b.className = "option";
      b.textContent = o.en;
      b.addEventListener("click", () => choose(b, o, q));
      box.appendChild(b);
    });
    speak(q.it);
  }
  function choose(btn, chosen, q) {
    if (answered) return;
    answered = true;
    const all = document.querySelectorAll("#q-options .option");
    all.forEach(b => {
      b.classList.add("disabled");
      if (b.textContent === q.en) b.classList.add("correct");
    });
    if (chosen.en === q.en) { score++; streak++; }
    else { btn.classList.add("wrong"); streak = 0; }
    document.getElementById("q-score").textContent = score;
    document.getElementById("q-streak").textContent = streak;
    document.getElementById("q-next").style.display = qIndex < QUIZ_LEN - 1 ? "inline-block" : "none";
    if (qIndex >= QUIZ_LEN - 1) finishQuiz();
  }
  function finishQuiz() {
    const box = document.getElementById("q-options");
    box.innerHTML = "";
    document.getElementById("q-word").textContent = "Finito! 🎉";
    document.querySelector(".quiz-q .prompt-label").textContent =
      "You scored " + score + " / " + QUIZ_LEN;
    document.getElementById("q-restart").style.display = "inline-block";
  }
  document.getElementById("q-next").addEventListener("click", () => { qIndex++; renderQuestion(); });
  document.getElementById("q-restart").addEventListener("click", () => {
    document.querySelector(".quiz-q .prompt-label").textContent = "What does this mean?";
    startQuiz();
  });

  // ---- Phrasebook ----
  const pb = document.getElementById("phrasebook");
  PHRASES.forEach(g => {
    const t = document.createElement("div");
    t.className = "section-title";
    t.textContent = g.group;
    pb.appendChild(t);
    g.items.forEach(p => {
      const row = document.createElement("div");
      row.className = "phrase";
      const txt = document.createElement("div");
      txt.className = "txt";
      txt.innerHTML = '<div class="it">' + p.it + '</div><div class="en">' + p.en + '</div>';
      const btn = document.createElement("button");
      btn.textContent = "🔊";
      btn.addEventListener("click", () => speak(p.it));
      row.appendChild(txt);
      row.appendChild(btn);
      pb.appendChild(row);
    });
  });

  // ---- Init ----
  renderCard();
  startQuiz();
</script>
