<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Purpose of Life</title>
<meta name="description" content="A 54-second whimsical, hand-drawn paper-collage animation (pure JavaScript + Web Audio) asking: what is the purpose of life?">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Bangers&family=Caveat:wght@500;700&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #1e1814; overflow: hidden; }
  body { font-family: "Caveat", cursive; }
  canvas { display: block; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
           box-shadow: 0 12px 50px rgba(0,0,0,.55); cursor: pointer; }
  #ui { position: fixed; right: 16px; bottom: 16px; display: flex; gap: 8px; opacity: 0; transition: opacity .35s; z-index: 2; }
  #ui.show { opacity: 1; }
  #ui button { font: 700 22px "Caveat", cursive; color: #2b2320; background: #fbf8f0; border: 0; padding: 4px 14px 6px;
               cursor: pointer; box-shadow: 2px 3px 0 rgba(0,0,0,.35); transform: rotate(-2deg); }
  #ui button:nth-child(2) { transform: rotate(1.5deg); background: #f2c14e; }
  #ui button:nth-child(3) { transform: rotate(-1deg); background: #f4a7b9; }
  #ui button:hover { transform: rotate(0) scale(1.06); }
</style>
</head>
<body>
<canvas id="c" aria-label="Animated collage: what is the purpose of life?"></canvas>
<div id="ui">
  <button id="bPause" title="Pause / play (space)">pause</button>
  <button id="bMute" title="Mute (m)">sound: on</button>
  <button id="bRestart" title="Restart (r)">restart</button>
</div>
<script>
'use strict';
/* =====================================================================
   WHAT IS THE PURPOSE OF LIFE?  a hand-drawn paper-collage animation
   Pure JavaScript: Canvas 2D for the visuals, Web Audio for the score
   and sound effects (everything is synthesised; no files, no libraries).
   ===================================================================== */

const W = 1280, H = 720, TAU = Math.PI * 2;
const FPS = 12;          // stop-motion frame rate
const SCENE = 6.4;       // each scene = 2 bars of 4/4 at 75 bpm
const END = 54.5;
const INK = '#2b2320';
const C = {
  coral: '#ee7b5f', mustard: '#f2c14e', teal: '#4fa3a5', sky: '#a8d8e8', pink: '#f4a7b9',
  leaf: '#7fb069', leafD: '#5a8f4e', navy: '#23305a', kraft: '#c9a27e', kraftD: '#a57c55',
  red: '#d9483b', lilac: '#b8a1d9', white: '#fbf8f0', news: '#e6e0cf', brown: '#8a5a3b',
};

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

/* ---------- maths ---------- */
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, u) => a + (b - a) * u;
const P = (t, a, b) => clamp((t - a) / (b - a));
const eOut = x => 1 - Math.pow(1 - x, 3);
const eIn = x => x * x;
const eIO = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const R = x => { const s = Math.sin(x * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
let B = 0;                                         // "boil" frame: lines re-jitter a few times a second
const jit = (s, a) => (R(s + B * 17.31) - .5) * 2 * a;
const qb = (a, c, b, u) => [(1-u)*(1-u)*a[0] + 2*(1-u)*u*c[0] + u*u*b[0], (1-u)*(1-u)*a[1] + 2*(1-u)*u*c[1] + u*u*b[1]];

/* ---------- textures (generated once) ---------- */
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }

const [bgC, g0] = mk(W, H);
(function paperBg() {
  g0.fillStyle = '#f1e7cf'; g0.fillRect(0, 0, W, H);
  const img = g0.getImageData(0, 0, W, H), d = img.data;
  for (let i = 0; i < d.length; i += 4) { const n = (Math.random() - .5) * 16; d[i] += n; d[i+1] += n; d[i+2] += n; }
  g0.putImageData(img, 0, 0);
  for (let i = 0; i < 700; i++) {
    g0.strokeStyle = `rgba(120,90,60,${Math.random() * .08})`; g0.lineWidth = Math.random() * 1.2;
    const x = Math.random() * W, y = Math.random() * H, a = Math.random() * TAU, l = 5 + Math.random() * 25;
    g0.beginPath(); g0.moveTo(x, y); g0.quadraticCurveTo(x + Math.cos(a + .5) * l / 2, y + Math.sin(a + .5) * l / 2, x + Math.cos(a) * l, y + Math.sin(a) * l); g0.stroke();
  }
})();

const [grC, g1] = mk(160, 160);
(function grain() {
  const img = g1.createImageData(160, 160), d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const dark = Math.random() < .5, v = dark ? 60 : 255;
    d[i] = v; d[i+1] = v * .95; d[i+2] = v * .85; d[i+3] = Math.random() * (dark ? 34 : 26);
  }
  g1.putImageData(img, 0, 0);
})();
const GRAIN = ctx.createPattern(grC, 'repeat');

const [nwC, g2] = mk(260, 220);
(function newsprint() {
  g2.fillStyle = '#e6e0cf'; g2.fillRect(0, 0, 260, 220);
  g2.fillStyle = 'rgba(40,35,30,.55)'; g2.fillRect(10, 10, 200, 14);
  for (let col = 0; col < 3; col++) for (let row = 0; row < 16; row++) {
    let x = 10 + col * 84; const y = 36 + row * 11, end = x + 76;
    while (x < end) { const w = 4 + Math.random() * 14; g2.fillStyle = `rgba(50,45,40,${.25 + Math.random() * .25})`; g2.fillRect(x, y, Math.min(w, end - x), 4); x += w + 3; }
  }
})();
const NEWS = ctx.createPattern(nwC, 'repeat');

const [vgC, g3] = mk(W, H);
(function vignette() {
  const v = g3.createRadialGradient(W/2, H/2, H * .38, W/2, H/2, H * .98);
  v.addColorStop(0, 'rgba(50,30,12,0)'); v.addColorStop(1, 'rgba(50,30,12,.42)');
  g3.fillStyle = v; g3.fillRect(0, 0, W, H);
})();

/* ---------- drawing primitives ---------- */
function trace(pts, close = true) {
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  if (close) ctx.closePath();
}
function bbox(pts) {
  let a = 1e9, b = 1e9, c = -1e9, d = -1e9;
  for (const p of pts) { if (p[0] < a) a = p[0]; if (p[1] < b) b = p[1]; if (p[0] > c) c = p[0]; if (p[1] > d) d = p[1]; }
  return [a, b, c - a, d - b];
}
const rect = (x, y, w, h) => [[x, y], [x + w, y], [x + w, y + h], [x, y + h]];
// ragged polygon: subdivide edges and nudge points (a scissor-cut edge)
function rag(poly, seed, rough = 1.4, step = 8) {
  const out = [], n = poly.length;
  for (let i = 0; i < n; i++) {
    const [x1, y1] = poly[i], [x2, y2] = poly[(i + 1) % n];
    const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1, m = Math.max(1, Math.round(L / step));
    const nx = -dy / L, ny = dx / L;
    for (let j = 0; j < m; j++) { const u = j / m, o = (R(seed + i * 31.7 + j * 1.93) - .5) * 2 * rough; out.push([x1 + dx * u + nx * o, y1 + dy * u + ny * o]); }
  }
  return out;
}
function ell(cx, cy, rx, ry, seed, rough = 1, rot = 0) {
  const n = Math.max(14, Math.round((rx + ry) * .35)), out = [], cr = Math.cos(rot), sr = Math.sin(rot);
  for (let i = 0; i < n; i++) {
    const a = i / n * TAU, k = 1 + (R(seed + i * 1.37) - .5) * .03, e = (R(seed + i * 9.1) - .5) * rough * 2;
    const x = Math.cos(a) * (rx * k + e), y = Math.sin(a) * (ry * k + e);
    out.push([cx + x * cr - y * sr, cy + x * sr + y * cr]);
  }
  return out;
}
function heartPts(cx, cy, s) {
  const o = [];
  for (let i = 0; i < 40; i++) { const t = i / 40 * TAU; o.push([cx + 16 * Math.pow(Math.sin(t), 3) * s, cy - (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * s]); }
  return o;
}
function starPts(cx, cy, r, rot = 0, k = .45) {
  const o = [];
  for (let i = 0; i < 10; i++) { const a = rot - Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * k : r; o.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]); }
  return o;
}

// a paper cut-out: fill + drop shadow + paper grain, with a tiny stop-motion shuffle
function cutFn(build, bb, color, o = {}) {
  const s = o.seed || 0, j = o.still ? 0 : .8;
  ctx.save(); ctx.translate(jit(s + .1, j), jit(s + .2, j));
  ctx.save();
  if (o.shadow !== false) { ctx.shadowColor = o.shc || 'rgba(45,28,12,.32)'; ctx.shadowBlur = o.sb ?? 6; ctx.shadowOffsetX = o.sx ?? 3; ctx.shadowOffsetY = o.sy ?? 4; }
  ctx.fillStyle = color; build(); ctx.fill();
  ctx.restore();
  ctx.save(); build(); ctx.clip();
  const [bx, by, bw, bh] = bb;
  if (o.pat) { ctx.globalAlpha = o.patA ?? 1; ctx.fillStyle = o.pat; ctx.fillRect(bx, by, bw, bh); }
  ctx.globalAlpha = o.grain ?? .55; ctx.fillStyle = GRAIN; ctx.fillRect(bx, by, bw, bh);
  ctx.globalAlpha = 1;
  if (o.inner) o.inner();
  ctx.restore();
  ctx.restore();
}
const cut = (pts, color, o) => cutFn(() => trace(pts), bbox(pts), color, o);

// torn paper: white fibrous fringe underneath a coloured sheet
function torn(x, y, w, h, color, seed, o = {}) {
  cut(rag(rect(x - 3, y - 3, w + 6, h + 6), seed + 50, 3.4, 6), o.fringe || '#fffdf5', { seed, sb: o.sb ?? 8, grain: .3 });
  cut(rag(rect(x, y, w, h), seed, 2.4, 6), color, { seed, shadow: false, pat: o.pat, patA: o.patA, inner: o.inner, grain: o.grain });
}

// sketchy pencil/ink line: jittered control points, two passes
function sk(pts, o = {}) {
  const w = o.w ?? 3, amp = o.amp ?? 1.6, seed = o.seed ?? 1, passes = o.passes ?? 2;
  ctx.save(); ctx.strokeStyle = o.col || INK; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (let p = 0; p < passes; p++) {
    ctx.lineWidth = p ? w * .5 : w; ctx.globalAlpha = (o.alpha ?? 1) * (p ? .6 : 1);
    let q = pts.map((pt, i) => [pt[0] + jit(seed + i * 7.13 + p * 91.1, amp), pt[1] + jit(seed + i * 3.71 + p * 53.3 + 5, amp)]);
    if (o.closed) q = q.concat([q[0], q[1] || q[0]]);
    ctx.beginPath(); ctx.moveTo(q[0][0], q[0][1]);
    if (q.length < 3) ctx.lineTo(q[q.length - 1][0], q[q.length - 1][1]);
    else {
      for (let i = 1; i < q.length - 1; i++) ctx.quadraticCurveTo(q[i][0], q[i][1], (q[i][0] + q[i+1][0]) / 2, (q[i][1] + q[i+1][1]) / 2);
      ctx.lineTo(q[q.length - 1][0], q[q.length - 1][1]);
    }
    ctx.stroke();
  }
  ctx.restore();
}
function seg(x1, y1, x2, y2, step = 28) {
  const n = Math.max(1, Math.round(Math.hypot(x2 - x1, y2 - y1) / step)), o = [];
  for (let i = 0; i <= n; i++) o.push([x1 + (x2 - x1) * i / n, y1 + (y2 - y1) * i / n]);
  return o;
}
const line = (x1, y1, x2, y2, o = {}) => sk(seg(x1, y1, x2, y2), o);
function circ(cx, cy, r, o = {}) {
  const a0 = o.a0 ?? 0, a1 = o.a1 ?? TAU + .35, n = Math.max(8, Math.round(r * .5 * (a1 - a0) / TAU) + 4), pts = [];
  for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * (o.ry ?? r)]); }
  sk(pts, o);
}
function tape(x, y, len, ang, seed = 0) {
  ctx.save(); ctx.translate(x + jit(seed, .5), y + jit(seed + 1, .5)); ctx.rotate(ang);
  const w = len, h = 24, pts = [[-w/2, -h/2], [w/2, -h/2]];
  for (let i = 1; i < 6; i++) pts.push([w/2 + (i % 2 ? -4 : 0), -h/2 + h * i / 6]);
  pts.push([w/2, h/2], [-w/2, h/2]);
  for (let i = 5; i > 0; i--) pts.push([-w/2 + (i % 2 ? 4 : 0), -h/2 + h * i / 6]);
  ctx.save(); ctx.fillStyle = 'rgba(238,228,196,.78)'; ctx.shadowColor = 'rgba(0,0,0,.14)'; ctx.shadowBlur = 3; ctx.shadowOffsetY = 1;
  trace(pts); ctx.fill(); ctx.restore();
  ctx.globalAlpha = .3; ctx.fillStyle = GRAIN; trace(pts); ctx.fill();
  ctx.restore();
}
function hand(str, x, y, size, o = {}) {
  ctx.save();
  ctx.font = `${o.weight ?? 700} ${size}px ${o.font || '"Caveat"'}, cursive`;
  ctx.fillStyle = o.col || INK; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (o.alpha != null) ctx.globalAlpha = o.alpha;
  const ch = [...str], ws = ch.map(c => ctx.measureText(c).width), tot = ws.reduce((a, b) => a + b, 0);
  let cx = o.align === 'left' ? x : x - tot / 2;
  const n = o.n ?? ch.length, sd = o.seed || 0;
  for (let i = 0; i < n; i++) {
    ctx.save(); ctx.translate(cx + ws[i] / 2, y + jit(i * 3.1 + sd, size * .02)); ctx.rotate(jit(i * 7.7 + sd, .05));
    ctx.fillText(ch[i], 0, 0); ctx.restore(); cx += ws[i];
  }
  ctx.restore(); return tot;
}
function cloud(x, y, s, seed, col = C.white) {
  const lobes = [[-40, 0, 30], [-10, -18, 36], [25, -8, 32], [50, 6, 22], [0, 10, 30], [-55, 10, 18]];
  cutFn(() => { ctx.beginPath(); for (const [lx, ly, r] of lobes) { ctx.moveTo(x + (lx + r) * s, y + ly * s); ctx.arc(x + lx * s, y + ly * s, r * s, 0, TAU); } },
        [x - 80 * s, y - 60 * s, 160 * s, 110 * s], col, { seed, sb: 5 });
}
function chalkStars(n, seed, T, area = [40, 40, 1200, 480]) {
  for (let i = 0; i < n; i++) {
    const x = area[0] + R(seed + i * 3.1) * area[2], y = area[1] + R(seed + i * 5.7) * area[3], z = 3 + R(seed + i * 1.9) * 5;
    const a = .4 + .6 * Math.abs(Math.sin(T * 1.7 + i));
    line(x - z, y, x + z, y, { w: 2, col: '#f4f1e6', passes: 1, alpha: a, amp: .6, seed: seed + i });
    line(x, y - z, x, y + z, { w: 2, col: '#f4f1e6', passes: 1, alpha: a, amp: .6, seed: seed + i + .5 });
  }
}

/* ---------- characters ---------- */
// Pip (coral, with a sprout) and Bo (teal, with a curl). (x,y) = feet.
function pip(x, y, s, o = {}) {
  const sd = o.seed ?? 100, col = o.col || C.coral, bo = o.kind === 'bo', T = o.T || 0;
  ctx.save(); ctx.translate(x, y); if (o.rot) ctx.rotate(o.rot); ctx.scale(s * (o.flip ? -1 : 1), s * (o.sq ?? 1));
  const wk = o.walk, sw = wk != null ? Math.sin(wk) * 13 : 0;
  const lf = [-13 + sw, wk != null ? -Math.max(0, Math.cos(wk)) * 7 : 0], rf = [13 - sw, wk != null ? -Math.max(0, -Math.cos(wk)) * 7 : 0];
  sk([[-11, -48], [-12 + sw * .4, -24], lf], { w: 4.5, seed: sd + 1, amp: 1 });
  sk([[11, -48], [12 - sw * .4, -24], rf], { w: 4.5, seed: sd + 2, amp: 1 });
  ctx.fillStyle = INK;
  ctx.beginPath(); ctx.ellipse(lf[0] - 3, lf[1] - 2, 8, 4.5, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(rf[0] + 3, rf[1] - 2, 8, 4.5, 0, 0, TAU); ctx.fill();
  if (!bo) {
    sk([[0, -128], [1, -142], [4, -152]], { w: 4, seed: sd + 4, col: '#3f6b33', amp: .8 });
    cut(ell(15, -155, 13, 6, sd + 5, .5, -.5), C.leaf, { seed: sd, sb: 3, sx: 1, sy: 2 });
    cut(ell(-8, -150, 9, 5, sd + 6, .5, .6), C.leafD, { seed: sd, sb: 3, sx: 1, sy: 2 });
  }
  const rx = bo ? 40 : 35, ry = bo ? 40 : 44, cy = bo ? -86 : -88;
  cut(ell(0, cy, rx, ry, sd + 3, .8), col, { seed: sd, sb: 5 });
  if (bo) {
    const pts = [];
    for (let i = 0; i <= 24; i++) { const u = i / 24, a = u * TAU * 1.6; pts.push([Math.cos(a) * 7 * (1 - u * .4) + u * 6 - 3, -128 - u * 14 + Math.sin(a) * 6]); }
    sk(pts, { w: 3.5, seed: sd + 7, amp: .6 });
  } else {
    cut(heartPts(11, -68, .62), C.news, { seed: sd, shadow: false, pat: NEWS, grain: .3 });
  }
  const arm = (side, a, k, prop) => {
    const L = o.armLen ?? 36, sx = side * (rx - 4), sy = cy + 4;
    const ex = sx + side * Math.sin(a) * L, ey = sy + Math.cos(a) * L;
    const mx = (sx + ex) / 2 + side * Math.cos(a) * 5, my = (sy + ey) / 2 + Math.sin(a) * 1.5;
    sk([[sx, sy], [mx, my], [ex, ey]], { w: 4.5, seed: sd + k, amp: .9 });
    if (prop) { ctx.save(); ctx.translate(ex, ey); prop(); ctx.restore(); }
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(ex, ey, 6.5, 0, TAU); ctx.fill();
    ctx.lineWidth = 2.4; ctx.strokeStyle = INK; ctx.stroke();
  };
  arm(-1, o.aL ?? .35, 11, o.propL); arm(1, o.aR ?? .35, 12, o.propR);
  const lk = o.look ?? 0, fy = bo ? -92 : -96;
  const bl = o.blink ?? (((T + sd * .37) % 3.3) < .13 ? 1 : 0);
  if (o.mood === 'dizzy') {
    for (const ex of [-12, 12]) { const sp = []; for (let i = 0; i <= 12; i++) { const a = i / 12 * TAU * 1.5 + T * 8, r = 1 + i * .45; sp.push([ex + Math.cos(a) * r, fy + Math.sin(a) * r]); } sk(sp, { w: 2, amp: .2, passes: 1, seed: sd + ex }); }
  } else {
    for (const ex of [-12, 12]) {
      ctx.fillStyle = INK; ctx.beginPath(); ctx.ellipse(ex + lk, fy, 4.3, Math.max(.7, 5.2 * (1 - bl)), 0, 0, TAU); ctx.fill();
      if (!bl) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex + lk + 1.5, fy - 2, 1.4, 0, TAU); ctx.fill(); }
    }
  }
  ctx.fillStyle = 'rgba(225,80,80,.35)';
  for (const ex of [-22, 22]) { ctx.beginPath(); ctx.ellipse(ex + lk * .5, fy + 11, 6, 3.8, 0, 0, TAU); ctx.fill(); }
  const my = fy + 14;
  switch (o.mood || 'smile') {
    case 'open':
      ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(lk, my - 2, 8, 0, Math.PI); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#e8707a'; ctx.beginPath(); ctx.arc(lk, my + 3, 3.6, 0, Math.PI); ctx.fill(); break;
    case 'o':
      ctx.lineWidth = 2.5; ctx.strokeStyle = INK; ctx.beginPath(); ctx.ellipse(lk, my, 4, 5, 0, 0, TAU); ctx.stroke(); break;
    case 'dizzy':
      sk([[lk - 9, my], [lk - 4, my - 3], [lk, my], [lk + 4, my - 3], [lk + 9, my]], { w: 2.5, amp: .5, passes: 1, seed: sd + 9 }); break;
    default:
      circ(lk, my - 8, 9, { a0: .2 * Math.PI, a1: .8 * Math.PI, w: 3, passes: 1, amp: .4, seed: sd + 8 });
  }
  ctx.restore();
}

/* ---------- props ---------- */
const pencil = ang => () => {
  ctx.rotate(ang);
  cut([[-30, -10], [190, -10], [225, 0], [190, 10], [-30, 10]], '#f5c542', { seed: 201, sb: 5 });
  cut([[190, -10], [225, 0], [190, 10]], '#ecd0a8', { seed: 201, shadow: false });
  cut([[215, -3], [226, 0], [215, 3]], INK, { seed: 201, shadow: false });
  cut(rect(-50, -10, 22, 20), C.pink, { seed: 201, shadow: false });
  cut(rect(-32, -10, 9, 20), '#b9b4aa', { seed: 201, shadow: false });
  line(-18, -3, 185, -3, { w: 1.5, col: 'rgba(0,0,0,.22)', passes: 1, seed: 203 });
};
const telescope = () => {
  ctx.rotate(-.75);
  cut([[-46, -9], [100, -15], [100, 15], [-46, 9]], C.kraft, { seed: 301, sb: 5 });
  cut(rect(10, -13, 12, 26), C.teal, { seed: 301, shadow: false });
  cut(rect(82, -16, 18, 32), C.red, { seed: 301, shadow: false });
  line(-40, -4, 95, -8, { w: 1.5, col: 'rgba(0,0,0,.25)', passes: 1, seed: 302 });
};

function thought(x, y, p, seed, T) {
  if (p <= 0) return;
  const e = eBack(p);
  ctx.save(); ctx.translate(x, y); ctx.scale(e, e);
  cut(ell(-58, 70, 7, 7, seed, .4), C.white, { seed, sb: 3 });

function render(T, boil) {
  T = Math.max(0, T);
  B = boil ?? Math.floor(T * 6);
  ctx.drawImage(bgC, 0, 0);
  const k = Math.min(7, Math.floor(T / SCENE));
  ctx.save(); ctx.translate(jit(1, .7), jit(2, .7));
  SCENES[k](T - k * SCENE, T);
  ctx.restore();
  transition(T);
  // film grain, exposure flicker, vignette
  ctx.save(); ctx.globalAlpha = .1; ctx.translate(-((B * 37) % 160), -((B * 53) % 160)); ctx.fillStyle = GRAIN; ctx.fillRect(0, 0, W + 160, H + 160); ctx.restore();
  ctx.fillStyle = `rgba(255,244,214,${R(B * 3.3) * .04})`; ctx.fillRect(0, 0, W, H);
  ctx.drawImage(vgC, 0, 0);
  if (T < .5) { ctx.fillStyle = `rgba(20,14,10,${1 - T / .5})`; ctx.fillRect(0, 0, W, H); }
}

/* =====================================================================
   AUDIO — a whimsical little score (music box, ukulele-ish plucks,
   pizzicato bass, woodblock, shaker, warm pad) + paper foley
   ===================================================================== */
let actx = null, master, bus, rev, revSend, NB, muted = false;
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function initAudio() {
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  actx = new AC();
  master = actx.createGain(); master.gain.value = muted ? 0 : .9;
  const comp = actx.createDynamicsCompressor();
  comp.threshold.value = -16; comp.knee.value = 12; comp.ratio.value = 3; comp.attack.value = .005; comp.release.value = .2;
  master.connect(comp); comp.connect(actx.destination);
  rev = actx.createConvolver();
  const len = Math.floor(actx.sampleRate * 2.6), ib = actx.createBuffer(2, len, actx.sampleRate);
  for (let c = 0; c < 2; c++) { const d = ib.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2); }
  rev.buffer = ib;
  const rg = actx.createGain(); rg.gain.value = .3; rev.connect(rg); rg.connect(master);
  NB = actx.createBuffer(1, actx.sampleRate * 2, actx.sampleRate);
  const nd = NB.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
}
function newBus() {
  if (bus) { try { bus.disconnect(); } catch (e) {} try { revSend.disconnect(); } catch (e) {} }
  bus = actx.createGain(); bus.connect(master);
  revSend = actx.createGain(); revSend.connect(rev);
}
function out(t, a, peak, d, send = 0, pan = 0) {
  const g = actx.createGain();
  g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(.0001, t + a + d);
  let node = g;
  if (pan && actx.createStereoPanner) { const p = actx.createStereoPanner(); p.pan.value = pan; g.connect(p); node = p; }
  node.connect(bus);
  if (send) { const s = actx.createGain(); s.gain.value = send; node.connect(s); s.connect(revSend); }
  return g;
}
function osc(type, f, t, d) { const o = actx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t); o.start(t); o.stop(t + d); return o; }
function noise(t, d) { const s = actx.createBufferSource(); s.buffer = NB; s.start(t, Math.random() * 1.5, d); return s; }
function filt(type, f, q = 1) { const b = actx.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; return b; }

// instruments
function musicBox(t, m, v = 1) {
  const f = mtof(m), pan = ((m % 12) / 12 - .5) * .6;
  [[1, 1, 1.8], [2, .3, .7], [3, .12, .35], [4.16, .08, .2]].forEach(([k, a, d]) => osc('sine', f * k, t, d + .1).connect(out(t, .003, .12 * v * a, d, .45, pan)));
}
function pluck(t, m, v = 1, pan = 0) {
  const f = filt('lowpass', 2800, 3);
  f.frequency.setValueAtTime(2800, t); f.frequency.exponentialRampToValueAtTime(300, t + .3);
  osc('sawtooth', mtof(m), t, .7).connect(f); osc('triangle', mtof(m) * 1.003, t, .7).connect(f);
  f.connect(out(t, .002, .045 * v, .55, .2, pan));
}
function strum(t, notes, v, up) { (up ? [...notes].reverse() : notes).forEach((m, i) => pluck(t + i * .018, m, v * (up ? .7 : 1), -.25 + i * .15)); }
function bass(t, m, v = 1) {
  const f = filt('lowpass', 900); osc('triangle', mtof(m), t, .9).connect(f); osc('sine', mtof(m), t, .9).connect(f);
  f.connect(out(t, .005, .2 * v, .6));
}
function wood(t, v = 1) {
  const o = osc('sine', 950, t, .15); o.frequency.exponentialRampToValueAtTime(620, t + .05); o.connect(out(t, .001, .09 * v, .08, .15, .3));
  noise(t, .04).connect(filt('bandpass', 1800, 2)).connect(out(t, .001, .03 * v, .03));
}
function shaker(t, v = 1) { noise(t, .08).connect(filt('highpass', 6000)).connect(out(t, .008, .028 * v, .05, 0, -.3)); }
function pad(t, notes, d, v = 1) {
  notes.forEach(m => {
    const f = filt('lowpass', 1000), g = actx.createGain();
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.02 * v, t + .5); g.gain.setValueAtTime(.02 * v, t + d); g.gain.linearRampToValueAtTime(.0001, t + d + .9);
    for (const dt of [-7, 7]) { const o = osc('triangle', mtof(m), t, d + 1); o.detune.value = dt; o.connect(f); }
    f.connect(g); g.connect(bus); const s = actx.createGain(); s.gain.value = .5; g.connect(s); s.connect(revSend);
  });
}
// foley
function tick(t, v = 1) { noise(t, .05).connect(filt('bandpass', 2000 + Math.random() * 2500, 1.5)).connect(out(t, .001, .16 * v, .04, .1, (Math.random() - .5) * .6)); }
function pop(t, f = 600, v = 1) { const o = osc('sine', f * .5, t, .2); o.frequency.exponentialRampToValueAtTime(f * 1.4, t + .07); o.connect(out(t, .002, .15 * v, .13, .25)); }
function thunk(t, v = 1) {
  const o = osc('sine', 170, t, .3); o.frequency.exponentialRampToValueAtTime(55, t + .14); o.connect(out(t, .002, .38 * v, .2));
  noise(t, .1).connect(filt('lowpass', 500)).connect(out(t, .001, .12 * v, .08));
}
function tapeRip(t, v = 1) {
  const g = actx.createGain(); g.gain.setValueAtTime(0, t);
  for (let i = 0; i < 12; i++) g.gain.setValueAtTime((i % 2 ? .03 : .13) * v * (1 - i / 14), t + i * .017);
  g.gain.setValueAtTime(0, t + .21);
  noise(t, .25).connect(filt('bandpass', 2200, .9)).connect(g); g.connect(bus);
}
function swoosh(t, d = 1, v = 1) {
  const f = filt('bandpass', 300, 1.4);
  f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(2400, t + d * .5); f.frequency.exponentialRampToValueAtTime(500, t + d);
  const g = actx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.24 * v, t + d * .45); g.gain.linearRampToValueAtTime(0, t + d);
  noise(t, d).connect(f).connect(g);
  let node = g;
  if (actx.createStereoPanner) { const p = actx.createStereoPanner(); p.pan.setValueAtTime(.8, t); p.pan.linearRampToValueAtTime(-.8, t + d); g.connect(p); node = p; }
  node.connect(bus); const s = actx.createGain(); s.gain.value = .2; node.connect(s); s.connect(revSend);
}
function slide(t, f1, f2, d, v = 1) {
  const o = osc('sine', f1, t, d + .1); o.frequency.exponentialRampToValueAtTime(f2, t + d);
  const l = osc('sine', 7, t, d + .1), lg = actx.createGain(); lg.gain.value = f1 * .03; l.connect(lg); lg.connect(o.frequency);
  o.connect(out(t, .03, .08 * v, d, .3));
}
function tweet(t) { for (let i = 0; i < 3; i++) { const s = t + i * .1, o = osc('sine', 2300, s, .1); o.frequency.exponentialRampToValueAtTime(3400, s + .06); o.connect(out(s, .005, .045, .07, .3, .5)); } }
function scribble(t, d, v = 1) {
  const g = actx.createGain(); g.gain.setValueAtTime(0, t);
  for (let x = 0; x < d; x += .05) g.gain.setValueAtTime((.015 + Math.random() * .06) * v, t + x);
  g.gain.setValueAtTime(0, t + d);
  noise(t, Math.min(d + .05, 2)).connect(filt('bandpass', 3200, 2.5)).connect(g); g.connect(bus);
}
function clink(t, v = 1) { [2400, 3950, 5600].forEach((f, i) => osc('sine', f * (1 + (Math.random() - .5) * .02), t, .6).connect(out(t, .001, .045 * v, [.5, .3, .18][i], .5, .2))); }
function boing(t, v = 1) {
  const o = osc('sine', 180, t, .7); o.frequency.exponentialRampToValueAtTime(480, t + .12); o.frequency.exponentialRampToValueAtTime(330, t + .5);
  const l = osc('sine', 16, t, .7), lg = actx.createGain(); lg.gain.value = 30; l.connect(lg); lg.connect(o.frequency);
  o.connect(out(t, .005, .2 * v, .6, .2));
}
function step(t, v = 1) { noise(t, .06).connect(filt('lowpass', 700)).connect(out(t, .002, .12 * v, .05)); }

/* ---------- the timeline ---------- */
const events = [];
const at = (t, f) => events.push({ t, f });
const BAR = 3.2, E8 = .4;
const PROG = ['C', 'Am', 'F', 'G', 'C', 'Am', 'F', 'G', 'F', 'Em', 'Dm', 'G', 'C', 'Am', 'F', 'G'];
const CH = { C: { r: 48, n: [60, 64, 67, 72] }, Am: { r: 45, n: [57, 60, 64, 69] }, F: { r: 41, n: [53, 57, 60, 65] },
             G: { r: 43, n: [55, 59, 62, 67] }, Em: { r: 40, n: [52, 55, 59, 64] }, Dm: { r: 38, n: [50, 53, 57, 62] } };
const MEL = [
  [[0, 76], [2, 79], [3, 84], [4, 83], [6, 79]],            // the question...
  [[0, 81], [2, 79], [3, 76], [4, 74]],                     // ...left hanging
  [[0, 77], [1, 81], [2, 84], [4, 81], [6, 84], [7, 86]],
  [[0, 83], [2, 79], [4, 74], [5, 79], [6, 83]],
  [[0, 84], [2, 76], [3, 79], [4, 84], [6, 86], [7, 88]],
  [[0, 84], [2, 81], [4, 76], [6, 79]],
  [[0, 81], [1, 79], [2, 77], [3, 81], [4, 84], [6, 81]],
  [[0, 83], [1, 84], [2, 86], [4, 79], [6, 83]],
  [[0, 81], [4, 84], [6, 81]],                              // love: slower, tender
  [[0, 79], [4, 83], [6, 76]],
  [[0, 77], [2, 81], [4, 86], [6, 84]],
  [[0, 83], [2, 86], [4, 79]],
  [[0, 76], [2, 79], [3, 84], [4, 83], [6, 79]],            // the question returns...
  [[0, 81], [2, 79], [3, 76], [4, 79], [6, 84]],            // ...and this time it rises
  [[0, 81], [2, 84], [4, 77], [6, 81]],
  [[0, 86], [2, 83], [4, 79], [6, 83], [7, 86]],
];
(function buildMusic() {
  for (let b = 0; b < 16; b++) {
    const t = b * BAR, ch = CH[PROG[b]], intro = b === 0, gentle = b >= 8 && b <= 11, perc = b >= 1 && !gentle;
    for (const [pos, m] of MEL[b]) at(t + pos * E8, w => musicBox(w, m, gentle ? .9 : 1));
    const pat = intro ? [[0, .7], [4, .5]] : gentle ? [[0, .8], [3, .5], [4, .6], [6, .4]] : [[0, 1], [2, .55], [3, .6], [4, .9], [6, .55], [7, .45]];
    for (const [pos, v] of pat) at(t + pos * E8, w => strum(w, ch.n, v, pos % 2 === 1));
    if (!intro) { at(t, w => bass(w, ch.r)); at(t + 4 * E8, w => bass(w, ch.r + 7, .8)); if (!gentle) at(t + 7 * E8, w => bass(w, ch.r + 12, .5)); }
    if (perc) { at(t + 2 * E8, w => wood(w)); at(t + 6 * E8, w => wood(w, .9)); for (let e = 0; e < 8; e++) at(t + e * E8 + (e % 2 ? .03 : 0), w => shaker(w, e % 2 ? 1 : .5)); }
    if (b >= 4) at(t, w => pad(w, ch.n.slice(0, 3), BAR, gentle ? 1.5 : .8));
  }
  const tf = 16 * BAR;
  at(tf, w => { strum(w, CH.C.n, 1, false); bass(w, 48); bass(w, 36, .6); pad(w, [60, 64, 67], 2.2, 1.5); musicBox(w, 84, 1.1); });
  [88, 91, 96, 100].forEach((m, i) => at(tf + .5 + i * .18, w => musicBox(w, m, .7)));
})();
(function buildFoley() {
  const S = k => k * SCENE;
  // 0: letters snip into place, Pip wanders in, wonders
  TITLE_TIMES.forEach((a, i) => at(a + .05, w => { tick(w, .9); if (i % 3 === 0) pop(w, 700 + (i % 5) * 90, .35); }));
  for (let i = 0; i < 6; i++) at(2.6 + i * .27, w => step(w, .8));
  at(4.5, w => pop(w, 520)); at(4.62, w => pop(w, 700, .6));
  at(5.35, w => slide(w, 330, 520, .35, .9)); at(5.8, w => slide(w, 520, 380, .3, .6));
  // page turns between scenes
  for (let k = 1; k < 8; k++) at(S(k) - .5, w => swoosh(w, 1));
  // captions are written with a pencil
  CAPS.forEach((c, k) => { if (c) at(S(k) + c.a + .25, w => scribble(w, [...c.text].length * .035, .45)); });
  // 1: happy
  at(S(1) + .3, w => slide(w, 300, 900, 1.3, .7));
  for (let i = 0; i < 7; i++) at(S(1) + 1 + i * .3 + .3, w => pop(w, 500 + i * 60, .9));
  at(S(1) + 2.5, tweet); at(S(1) + 4.2, tweet);
  // 2: make
  HOUSE.forEach((hp, i) => { at(S(2) + hp.a + .4, w => thunk(w, .8)); if (hp.tape) at(S(2) + hp.a + .55, w => tapeRip(w)); });
  at(S(2) + 3.9, w => scribble(w, 1.25, 1.2));
  // 3: figure it out
  for (let i = 0; i < 4; i++) at(S(3) + .1 + i * .22 + .28, w => thunk(w, .6));
  at(S(3) + 1.15, w => pop(w, 400, .8));
  const PENTA = [84, 86, 88, 91, 93, 96];
  IDEAS.forEach((_, i) => at(S(3) + 1.4 + i * .3, w => musicBox(w, PENTA[i % 6] + (i > 5 ? 12 : 0), .45)));
  at(S(3) + 4.5, w => slide(w, 900, 250, 1.1, .8));
  // 4: love
  for (let i = 0; i < 7; i++) at(S(4) + i * .27, w => step(w, .6));
  at(S(4) + 2.2, w => boing(w));
  for (let i = 0; i < 16; i += 2) at(S(4) + 2.5 + i * .22, w => pop(w, 900 + (i % 4) * 150, .3));
  // 5: one big question -> many little answers
  at(S(5) + .02, w => pop(w, 260, 1.2));
  at(S(5) + 1.0, w => { for (let i = 0; i < 6; i++) musicBox(w + i * .06, 96 - i * 2 + (i % 2 ? 3 : 0), .4); });
  for (let i = 0; i < 6; i++) at(S(5) + SNAP_AT(i), w => { tick(w, 1.2); tick(w + .04, .8); });
  // 6: into the jar
  const NOTES = [72, 76, 79, 81, 84, 86, 88, 91, 93, 96, 91, 93, 96, 100];
  ITEMS.forEach((_, i) => at(S(6) + LAND(i), w => { clink(w, .7); musicBox(w, NOTES[i], .5); }));
  at(S(6) + 5.3, w => { thunk(w, .7); clink(w, 1); });
  // 7: party
  at(S(7) + .4, w => { swoosh(w, .4, .6); for (let i = 0; i < 6; i++) pop(w + i * .05, 500 + i * 120, .5); });
  at(S(7) + 2.2, w => scribble(w, .6, 1));
  at(S(7) + 3.8, w => pop(w, 600, .7));
  events.sort((a, b) => a.t - b.t);
})();

/* =====================================================================
   PLAYBACK
   ===================================================================== */
let state = 'idle', t0 = 0, perf0 = 0, pausedT = 0, evi = 0, lastKey = '', dirty = true;
const clock = () => {
  if (actx) return actx.currentTime - t0;
  return state === 'paused' ? pausedT : (performance.now() - perf0) / 1000;
};
function pump() {
  if (!actx || state !== 'playing') return;
  const now = clock();
  while (evi < events.length && events[evi].t < now + .35) {
    const e = events[evi++], when = t0 + e.t;
    if (when >= actx.currentTime - .03) { try { e.f(Math.max(when, actx.currentTime)); } catch (err) {} }
  }
}
setInterval(pump, 50);

function start(from = 0) {
  if (!actx) { try { initAudio(); } catch (e) { actx = null; } }
  if (actx) { actx.resume(); newBus(); t0 = actx.currentTime + .12 - from; }
  else perf0 = performance.now() - from * 1000;
  evi = 0; while (evi < events.length && events[evi].t < from) evi++;
  state = 'playing'; lastKey = ''; ui.pause.textContent = 'pause';
  poke();
}
function togglePause() {
  if (state === 'playing') {
    state = 'paused'; pausedT = clock(); if (actx) actx.suspend(); ui.pause.textContent = 'play';
  } else if (state === 'paused') {
    if (actx) actx.resume(); else perf0 = performance.now() - pausedT * 1000;
    state = 'playing'; ui.pause.textContent = 'pause';
  }
  poke();
}
function toggleMute() {
  muted = !muted; ui.mute.textContent = muted ? 'sound: off' : 'sound: on';
  if (master) master.gain.setTargetAtTime(muted ? 0 : .9, actx.currentTime, .05);
  poke();
}

// sizing
let scale = 1, dpr = 1;
function resize() {
  scale = Math.min(innerWidth / W, innerHeight / H); dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.style.width = `${W * scale}px`; cv.style.height = `${H * scale}px`;
  cv.width = Math.round(W * scale * dpr); cv.height = Math.round(H * scale * dpr);
  dirty = true;
}
addEventListener('resize', resize); resize();

function hand_right(str, x, y, size, o) { ctx.save(); ctx.font = `700 ${size}px "Caveat"`; const w = ctx.measureText(str).width; ctx.restore(); hand(str, x - w / 2, y, size, o); }

let frozen = false;   // set by PURPOSE.render() so the loop doesn't overwrite a still
function frame() {
  requestAnimationFrame(frame);
  pump();
  if (frozen) return;
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  if (state === 'idle' || state === 'ended') {
    const b = Math.floor(performance.now() / 166), key = state + b;
    if (key === lastKey && !dirty) return; lastKey = key; dirty = false;
    if (state === 'idle') {
      render(5.2, b);
      hand_right('press play', 1010, 578, 46, { seed: 993 });
      hand_right('(sound on ♪)', 1010, 618, 30, { seed: 994, col: 'rgba(43,35,32,.75)' });
      cut(ell(1100, 596, 58, 58, 990, 1.5), C.red, { seed: 990, sb: 12 });
      cut([[1084, 574], [1128, 596], [1084, 618]], '#fff8ec', { seed: 991, shadow: false });
      tape(1060, 548, 70, -.7, 992);
    } else {
      render(END, b);
      ctx.fillStyle = 'rgba(30,20,14,.35)'; ctx.fillRect(0, 0, W, H);
      ctx.save(); ctx.translate(640, 400); ctx.rotate(-.03);
      torn(-170, -45, 340, 90, C.white, 995, { sb: 14 }); tape(-160, -40, 70, -.6, 996); tape(160, -40, 70, .6, 997);
      hand('↺  watch again', 0, 2, 50, { seed: 998 });
      ctx.restore();
    }
    return;
  }
  let T = clock();
  if (T >= END && state === 'playing') { state = 'ended'; dirty = true; ui.pause.textContent = 'play'; return; }
  const key = 'p' + Math.floor(T * FPS);
  if (key === lastKey && !dirty) return; lastKey = key; dirty = false;
  render(Math.floor(T * FPS) / FPS);
}

// UI
const uiEl = document.getElementById('ui');
const ui = { pause: document.getElementById('bPause'), mute: document.getElementById('bMute'), restart: document.getElementById('bRestart') };
let hideTimer = 0;
function poke() { uiEl.classList.add('show'); clearTimeout(hideTimer); hideTimer = setTimeout(() => { if (state === 'playing') uiEl.classList.remove('show'); }, 2500); }
function startFromHash() { const m = /t=([\d.]+)/.exec(location.hash); return m ? Math.min(END - 1, parseFloat(m[1])) : 0; }
cv.addEventListener('click', () => {
  if (state === 'idle') start(startFromHash());
  else if (state === 'ended') start(0);
  else togglePause();
});
ui.pause.addEventListener('click', e => { e.stopPropagation(); if (state === 'idle' || state === 'ended') start(0); else togglePause(); });
ui.mute.addEventListener('click', e => { e.stopPropagation(); toggleMute(); });
ui.restart.addEventListener('click', e => { e.stopPropagation(); if (state === 'paused' && actx) actx.resume(); start(0); });
addEventListener('mousemove', poke);
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); if (state === 'idle' || state === 'ended') start(0); else togglePause(); }
  else if (e.key === 'm') toggleMute();
  else if (e.key === 'r') start(0);
});
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'playing') togglePause(); });

// fonts arrive → redraw
if (document.fonts && document.fonts.load) {
  Promise.all(['40px "Caveat"', '700 40px "Caveat"', '40px "Abril Fatface"', '40px "Bangers"', '40px "Special Elite"'].map(f => document.fonts.load(f).catch(() => {})))
    .then(() => { dirty = true; });
}
// for testing / thumbnails: window.PURPOSE.render(seconds)
window.PURPOSE = { render: T => { frozen = true; ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0); render(T); }, duration: END, events };
requestAnimationFrame(frame);
</script>
</body>
</html>
