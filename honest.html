<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brutally Honest</title>
<meta name="description" content="A 108-second Blender-style clay animation for Alex: what I know, the good, the bad, the ugly, what he may not be seeing, one piece of advice, and what I wish for him.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Inter:wght@500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; font-family: Inter, system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; }
  #vignette { position: fixed; inset: 0; pointer-events: none;
              background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0,0,0,.26) 100%); }
  #fade { position: fixed; inset: 0; pointer-events: none; background: #fbf6ee; opacity: 0; }
  #cap { position: fixed; left: 50%; bottom: 6vh; transform: translateX(-50%); width: min(92vw, 1000px);
         text-align: center; pointer-events: none; }
  #kick { display: inline-block; font: 700 clamp(11px, 1.25vw, 15px)/1 Inter, sans-serif; letter-spacing: .22em;
          text-transform: uppercase; padding: 8px 14px 7px; border-radius: 999px; background: rgba(22,19,17,.82);
          color: #ffd28f; margin-bottom: 12px; opacity: 0; }
  #line { display: inline-block; font: 500 clamp(19px, 2.7vw, 36px)/1.25 Fraunces, Georgia, serif; color: #fff;
          padding: 12px 22px 14px; border-radius: 18px; background: rgba(22,19,17,.66);
          -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); opacity: 0; }
  #line:empty { display: none; }
  #big { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
         pointer-events: none; opacity: 0; text-align: center; padding: 0 16px;
         background: radial-gradient(ellipse at 50% 50%, rgba(20,14,10,.5), transparent 62%); }
  #big h1 { margin: 0; font: italic 500 clamp(80px, 16vw, 220px)/1 Fraunces, Georgia, serif; color: #fff;
            text-shadow: 0 6px 40px rgba(0,0,0,.45); }
  #big p { margin: 10px 0 0; font: 500 clamp(18px, 2.4vw, 30px)/1.3 Fraunces, Georgia, serif; color: #fff;
           text-shadow: 0 2px 16px rgba(0,0,0,.55); }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
           background: radial-gradient(ellipse at 50% 40%, #3a302a, #141110); color: #f7efe4; z-index: 5; text-align: center; padding: 0 16px; }
  #start h1 { margin: 0; font: 700 clamp(40px, 8vw, 96px)/1 Fraunces, Georgia, serif; }
  #start p { margin: 14px 0 28px; font: 500 clamp(15px, 1.8vw, 20px)/1.4 Inter, sans-serif; opacity: .75; }
  #start button, #ui button { font: 700 16px Inter, sans-serif; border: 0; border-radius: 999px; cursor: pointer; }
  #start button { padding: 16px 38px; background: #ffd28f; color: #231d18; font-size: 18px; box-shadow: 0 8px 30px rgba(255,210,143,.25); }
  #start button:hover { transform: scale(1.04); }
  #ui { position: fixed; right: 16px; top: 16px; display: flex; gap: 8px; opacity: 0; transition: opacity .35s; z-index: 4; }
  #ui.show { opacity: 1; }
  #ui button { padding: 8px 14px; background: rgba(22,19,17,.72); color: #f7efe4; }
  #bar { position: fixed; left: 0; bottom: 0; height: 3px; background: #ffd28f; width: 0; z-index: 4; }
  body.capture #ui, body.capture #bar, body.capture #start { display: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage"></div>
<div id="vignette"></div>
<div id="cap"><div id="kick"></div><br><div id="line"></div></div>
<div id="big"><h1>Vai.</h1><p>Pick one. Ship it. Then go home.</p></div>
<div id="fade"></div>
<div id="bar"></div>
<div id="ui">
  <button id="bPause" title="Pause / play (space)">pause</button>
  <button id="bMute" title="Mute (m)">sound: on</button>
  <button id="bRestart" title="Restart (r)">restart</button>
</div>
<div id="start">
  <h1>Brutally honest.</h1>
  <p>A short film for Alex · 1 min 48 s · sound on</p>
  <button id="bPlay">▶ Play</button>
</div>

<script type="module">
/* =====================================================================
   BRUTALLY HONEST  a Blender-style clay animation, in Three.js
   Clay materials, soft shadows, a studio environment map, a turntable
   plinth, and captions over the top. The score is synthesised with the
   Web Audio API. Add ?t=40 to start part-way, ?capture for frame export.
   ===================================================================== */
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const Q = new URLSearchParams(location.search);
const CAPTURE = Q.has('capture');
const END = 108;
if (CAPTURE) document.body.classList.add('capture');

/* ---------- maths ---------- */
const TAU = Math.PI * 2;
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, u) => a + (b - a) * u;
const P = (t, a, b) => clamp((t - a) / (b - a));
const sm = x => x * x * (3 - 2 * x);
const eOut = x => 1 - Math.pow(1 - x, 3);
const eIO = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eBack = x => { const c = 1.9; return x <= 0 ? 0 : 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

/* ---------- renderer, studio lighting ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: CAPTURE });
renderer.setPixelRatio(CAPTURE ? 1 : Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.getElementById('stage').appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;
scene.background = new THREE.Color('#f1e6d6');
scene.fog = new THREE.Fog('#f1e6d6', 16, 42);

const camera = new THREE.PerspectiveCamera(35, 16 / 9, 0.1, 200);
const hemi = new THREE.HemisphereLight(0xffffff, 0x8a7a6a, 1);
const key = new THREE.DirectionalLight(0xfff3e2, 2.6);
key.position.set(4, 8, 5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -9, right: 9, top: 9, bottom: -9, near: 1, far: 30 });
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
const rim = new THREE.DirectionalLight(0xd4e6ff, 0.9);
rim.position.set(-5, 4, -6);
scene.add(hemi, key, key.target, rim);

const groundMat = new THREE.MeshStandardMaterial({ color: '#e6d6c1', roughness: 1 });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(240, 240), groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

/* ---------- clay kit ---------- */
const matCache = new Map();
const M = (c, o = {}) => {
  const k = c + JSON.stringify(o);
  if (!matCache.has(k)) matCache.set(k, new THREE.MeshStandardMaterial({ color: c, roughness: .6, metalness: 0, ...o }));
  return matCache.get(k);
};
const SPH = new THREE.SphereGeometry(1, 32, 24);
function mk(geo, mat, x = 0, y = 0, z = 0, parent) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = m.receiveShadow = true;
  if (parent) parent.add(m);
  return m;
}
const ball = (mat, x, y, z, sx, sy = sx, sz = sx, parent) => { const m = mk(SPH, mat, x, y, z, parent); m.scale.set(sx, sy, sz); return m; };
const rbox = (w, h, d, r = .08) => new RoundedBoxGeometry(w, h, d, 4, r);

function roundRect(x, X, Y, w, h, r) {
  x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + w, Y, X + w, Y + h, r); x.arcTo(X + w, Y + h, X, Y + h, r);
  x.arcTo(X, Y + h, X, Y, r); x.arcTo(X, Y, X + w, Y, r); x.closePath();
}
/* a canvas-textured plane (or sprite) for words in the 3D world */
function label(text, o = {}) {
  const { w = 512, h = 160, bg = '#fffaf2', fg = '#2a2622', size = 64, weight = 700, family = 'Inter',
          sub = null, subSize = 32, radius = 36, scale = .0028, sprite = false } = o;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d');
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
  let cur = null;
  const draw = (t, s = sub) => {
    if (cur === t + '|' + s) return; cur = t + '|' + s;
    x.clearRect(0, 0, w, h);
    if (bg) { x.fillStyle = bg; roundRect(x, 4, 4, w - 8, h - 8, radius); x.fill(); }
    x.fillStyle = fg; x.textAlign = 'center'; x.textBaseline = 'middle';
    let fs = size;
    do { x.font = `${weight} ${fs}px ${family}`; fs -= 2; } while (x.measureText(t).width > w * .88 && fs > 12);
    x.fillText(t, w / 2, s ? h * .4 : h / 2 + 3);
    if (s) {
      let ss = subSize;
      do { x.font = `500 ${ss}px Inter`; ss -= 1; } while (x.measureText(s).width > w * .88 && ss > 10);
      x.globalAlpha = .68; x.fillText(s, w / 2, h * .76); x.globalAlpha = 1;
    }
    tex.needsUpdate = true;
  };
  draw(text);
  const mat = sprite ? new THREE.SpriteMaterial({ map: tex, toneMapped: false })
                     : new THREE.MeshBasicMaterial({ map: tex, transparent: true, toneMapped: false });
  const mesh = sprite ? new THREE.Sprite(mat) : new THREE.Mesh(new THREE.PlaneGeometry(w * scale, h * scale), mat);
  if (sprite) mesh.scale.set(w * scale, h * scale, 1);
  return { mesh, draw };
}

/* a little clay person: pivots for legs, arms and head */
function person({ shirt = '#3f8f94', pants = '#34405a', skin = '#f0c6a4', hair = '#4b3627', s = 1 } = {}) {
  const g = new THREE.Group();
  const leg = x => { const p = new THREE.Group(); p.position.set(x, .46, 0); g.add(p);
    mk(new THREE.CapsuleGeometry(.09, .3, 6, 12), M(pants), 0, -.22, 0, p);
    ball(M('#2b2622'), 0, -.42, .04, .1, .06, .13, p); return p; };
  const legL = leg(-.11), legR = leg(.11);
  const body = mk(new THREE.CapsuleGeometry(.25, .34, 8, 16), M(shirt), 0, .8, 0, g);
  const arm = x => { const p = new THREE.Group(); p.position.set(x, 1.01, 0); g.add(p);
    mk(new THREE.CapsuleGeometry(.075, .32, 6, 12), M(shirt), 0, -.2, 0, p);
    ball(M(skin), 0, -.42, 0, .085, .085, .085, p); return p; };
  const armL = arm(-.33), armR = arm(.33);
  const head = new THREE.Group(); head.position.set(0, 1.37, 0); g.add(head);
  ball(M(skin), 0, 0, 0, .26, .26, .26, head);
  ball(M(hair, { roughness: .8 }), 0, .075, -.035, .275, .2, .27, head);
  const eyeM = M('#1d1a18', { roughness: .25 });
  ball(eyeM, -.085, .01, .235, .033, .038, .03, head);
  ball(eyeM, .085, .01, .235, .033, .038, .03, head);
  ball(M('#f39a8c'), -.15, -.065, .19, .045, .03, .02, head);
  ball(M('#f39a8c'), .15, -.065, .19, .045, .03, .02, head);
  const smile = mk(new THREE.TorusGeometry(.06, .013, 8, 20, Math.PI), eyeM, 0, -.07, .238, head);
  smile.rotation.z = Math.PI;
  g.scale.setScalar(s);
  return { g, armL, armR, head, legL, legR, body };
}
function walkPose(p, t, amt = 1) {
  const s = Math.sin(t * 9) * .5 * amt;
  p.legL.rotation.x = s; p.legR.rotation.x = -s;
  p.armL.rotation.x = -s * .8; p.armR.rotation.x = s * .8;
}
function resetPose(p) {
  for (const k of ['legL', 'legR', 'armL', 'armR', 'head']) p[k].rotation.set(0, 0, 0);
  p.g.rotation.set(0, 0, 0);
}

/* a Shih Tzu, which is mostly a fluffy sphere with ears */
function dog({ fur = '#f4e6cf', ear = '#b98a5c', bow = '#e8505b' } = {}) {
  const g = new THREE.Group(), inner = new THREE.Group(); g.add(inner);
  const F = M(fur, { roughness: .95 });
  ball(F, 0, .2, 0, .25, .17, .18, inner);
  for (const [x, z] of [[.13, .09], [.13, -.09], [-.13, .09], [-.13, -.09]]) ball(F, x, .06, z, .055, .065, .055, inner);
  const tail = ball(F, -.24, .33, 0, .085, .085, .085, inner);
  const head = new THREE.Group(); head.position.set(.2, .34, 0); inner.add(head);
  ball(F, 0, 0, 0, .145, .145, .145, head);
  ball(M('#fbf3e6', { roughness: .95 }), .11, -.035, 0, .07, .055, .075, head);
  ball(M('#1d1a18', { roughness: .25 }), .175, -.015, 0, .026, .026, .026, head);
  for (const z of [-.06, .06]) ball(M('#1d1a18', { roughness: .25 }), .1, .04, z, .022, .026, .022, head);
  for (const z of [-.13, .13]) ball(M(ear, { roughness: .95 }), -.01, -.04, z, .06, .115, .045, head);
  ball(F, 0, .14, 0, .05, .05, .05, head);
  for (const z of [-.035, .035]) ball(M(bow), 0, .185, z, .03, .022, .03, head);
  return { g, inner, head, tail };
}

/* a labelled crate, one per project */
const CRATE_COLS = ['#f2b880', '#9fd1c9', '#f4a7b9', '#b8a1d9', '#f2d16b', '#a8d8e8', '#c7e59b', '#ee9b7a'];
function crate(text, col, face = 'z', sz = .62) {
  const g = new THREE.Group();
  mk(rbox(sz, sz, sz, .07), M(col), 0, 0, 0, g);
  const L = label(text, { w: 300, h: 300, bg: null, size: 58, scale: sz * .9 / 300, radius: 0 });
  if (face === 'z') L.mesh.position.z = sz / 2 + .004;
  else { L.mesh.rotation.y = -Math.PI / 2; L.mesh.position.x = -sz / 2 - .004; }
  g.add(L.mesh);
  return g;
}
const plinth = (col = '#efe2d0', r = 1.7) => mk(new THREE.CylinderGeometry(r, r * 1.03, .28, 72), M(col), 0, .14, 0);

function heartGeo() {
  const s = new THREE.Shape();
  s.moveTo(0, -1); s.bezierCurveTo(-.2, -.7, -1.2, -.3, -1.2, .35); s.bezierCurveTo(-1.2, 1, -.4, 1.2, 0, .6);
  s.bezierCurveTo(.4, 1.2, 1.2, 1, 1.2, .35); s.bezierCurveTo(1.2, -.3, .2, -.7, 0, -1);
  const g = new THREE.ExtrudeGeometry(s, { depth: .4, bevelEnabled: true, bevelThickness: .25, bevelSize: .22, bevelSegments: 6, curveSegments: 24 });
  g.center(); return g;
}

const cam = (px, py, pz, tx, ty, tz) => { camera.position.set(px, py, pz); camera.lookAt(tx, ty, tz); };

/* =====================================================================
   THE SETS: one per chapter. Each has a look and an update(tl, dur).
   ===================================================================== */
const SETS = [];
function set(def) { def.group = new THREE.Group(); def.group.visible = false; scene.add(def.group); SETS.push(def); return def; }

/* 0 · TITLE ------------------------------------------------------------ */
set({
  a: 0, b: 8, bg: '#f1e6d6', gr: '#e6d6c1',
  build(G) {
    G.add(plinth());
    this.al = person(); this.al.g.position.y = .28; G.add(this.al.g);
    const q = new THREE.Group(); q.position.set(1.05, 2.35, 0); G.add(q); this.q = q;
    const C = M('#ee7b5f');
    const arc = mk(new THREE.TorusGeometry(.3, .1, 20, 48, Math.PI * 1.45), C, 0, .2, 0, q); arc.rotation.z = -Math.PI * .45;
    mk(new THREE.CapsuleGeometry(.1, .16, 8, 16), C, 0, -.2, 0, q);
    ball(C, 0, -.52, 0, .11, .11, .11, q);
  },
  update(tl) {
    const al = this.al;
    al.armR.rotation.z = tl > .4 && tl < 4.2 ? 2.5 + Math.sin(tl * 11) * .35 : lerp(al.armR.rotation.z, 0, .15);
    al.head.rotation.z = Math.sin(tl * 1.4) * .08;
    al.g.position.y = .28 + Math.abs(Math.sin(tl * 3)) * .02;
    this.q.position.y = 2.35 + Math.sin(tl * 1.8) * .1; this.q.rotation.y = Math.sin(tl * .9) * .5;
    const u = eIO(P(tl, 0, 8));
    cam(Math.sin(tl * .15) * 1.2, lerp(2.3, 1.75, u), lerp(10, 5.8, u), 0, 1.15, 0);
  },
});

/* 1 · WHAT I KNOW -------------------------------------------------------- */
set({
  a: 8, b: 19, bg: '#dfe9f3', gr: '#d0dce9',
  build(G) {
    G.add(plinth('#eef3f8'));
    this.al = person(); this.al.g.position.y = .28; G.add(this.al.g);
    const facts = [['Pax8 EMEA', 'revenue enablement'], ['Southampton', 'home'], ['EN · PT · ES', 'three languages'],
      ['CIPD Level 5', 'in progress'], ['Hastings Hub', 'your brand'], ['Sebastian', 'your person'],
      ['4 Shih Tzus', 'your chaos'], ['Bambu printer', 'your toy'], ['testezinho/', '8 projects']];
    this.tiles = facts.map(([t, s], i) => {
      const g = new THREE.Group();
      mk(rbox(1.5, .5, .1, .05), M(CRATE_COLS[i % 8]), 0, 0, 0, g);
      const L = label(t, { w: 520, h: 172, bg: null, size: 62, sub: s, scale: 1.44 / 520 });
      L.mesh.position.z = .052; g.add(L.mesh);
      G.add(g); return g;
    });
  },
  update(tl) {
    const n = this.tiles.length;
    this.tiles.forEach((g, i) => {
      const a = i / n * TAU + tl * .22, r = 2.45;
      g.position.set(Math.sin(a) * r, .95 + (i % 3) * .62 + Math.sin(tl * 1.6 + i) * .06, Math.cos(a) * r);
      g.scale.setScalar(Math.max(.001, eBack(P(tl, .5 + i * .85, 1.05 + i * .85))));
      g.lookAt(camera.position);
    });
    this.al.head.rotation.y = Math.sin(tl * .9) * .55;
    this.al.head.rotation.x = -.12;
    const f = -.3 + tl * .045;
    cam(Math.sin(f) * 7.6, 2.5, Math.cos(f) * 7.6, 0, 1.35, 0);
  },
});

/* 2 · THE GOOD ---------------------------------------------------------- */
set({
  a: 19, b: 30, bg: '#e2f0dc', gr: '#d3e5cc',
  build(G) {
    const spec = [
      { col: '#7fb069', h0: .9, h1: 2.7, a: .4, b: 3.4, val: u => lerp(34, 98.9, u).toFixed(1) + '%', sub: 'adoption · from 34%' },
      { col: '#4fa3a5', h0: .6, h1: 2.3, a: .6, b: 3.6, val: u => Math.round(lerp(22, 84, u)) + '%', sub: 'satisfaction · from 22%' },
      { col: '#f2c14e', h0: .1, h1: 1.9, a: 4.1, b: 6.9, val: u => '£' + Math.round(lerp(0, 60, u)) + 'k', sub: 'saved every year' },
      { col: '#ee7b5f', h0: .1, h1: 2.5, a: 4.3, b: 7.1, val: u => lerp(0, 4.9, u).toFixed(1) + ' / 5', sub: '27 people · 9 sites' },
    ];
    this.pil = spec.map((s, i) => {
      const m = mk(rbox(1, 1, 1, .06), M(s.col), -2.4 + i * 1.6, 0, 0, G);
      const L = label(s.val(0), { w: 480, h: 190, size: 76, sub: s.sub, scale: 1.3 / 480 });
      G.add(L.mesh);
      return { ...s, m, L };
    });
    this.al = person(); this.al.g.position.set(0, 0, 1.7); G.add(this.al.g);
    this.conf = [];
    for (let i = 0; i < 70; i++) {
      const m = mk(rbox(.09, .09, .02, .01), M(CRATE_COLS[i % 8]), 0, 0, 0, G);
      this.conf.push({ m, x: (rnd() - .5) * 7, z: (rnd() - .5) * 3 + .5, d: rnd() * 1.2, v: 1.6 + rnd() * 1.4, s: rnd() * 10 });
    }
  },
  update(tl) {
    for (const p of this.pil) {
      const u = eOut(P(tl, p.a, p.b)), h = lerp(p.h0, p.h1, u);
      p.m.scale.y = h; p.m.position.y = h / 2;
      p.L.draw(p.val(u)); p.L.mesh.position.set(p.m.position.x, h + .42, .1);
    }
    const al = this.al, party = tl > 7.3;
    al.g.position.y = party ? Math.abs(Math.sin((tl - 7.3) * 7)) * .28 : 0;
    al.armL.rotation.z = party ? -2.7 : 0; al.armR.rotation.z = party ? 2.7 : 0;
    al.head.rotation.y = party ? 0 : Math.sin(tl * .8) * .5;
    for (const c of this.conf) {
      const k = tl - 7.2 - c.d;
      c.m.visible = k > 0;
      c.m.position.set(c.x + Math.sin(k * 2 + c.s) * .2, Math.max(.02, 6 - k * c.v), c.z);
      c.m.rotation.set(k * 4 + c.s, k * 3, c.s);
    }
    const u = eIO(P(tl, 0, 11));
    cam(lerp(-.6, .6, u), lerp(1.1, 2.3, u), lerp(8.8, 9.3, u), 0, lerp(1.1, 1.45, u), 0);
  },
});

    this.dogs = breeds.map((b, i) => { const d = dog(b); G.add(d.g); return { d, r: 1.25 + (i % 2) * .4, w: .9 + i * .18, ph: i * 1.6, dir: i % 2 ? -1 : 1 }; });
    const hg = heartGeo();
    this.hearts = [];
    for (let i = 0; i < 7; i++) {
      const m = mk(hg, new THREE.MeshStandardMaterial({ color: '#ef7c9a', roughness: .45, transparent: true }), 0, 0, 0, G);
      this.hearts.push({ m, d: i * 1.1, x: (rnd() - .5) * .8 });
    }
  },
  update(tl) {
    for (const o of this.dogs) {
      const a = o.ph + tl * o.w * o.dir;
      o.d.g.position.set(Math.cos(a) * o.r, 0, .4 + Math.sin(a) * o.r * .8);
      o.d.g.rotation.y = -a - Math.PI / 2 * o.dir;
      o.d.inner.position.y = Math.abs(Math.sin(tl * 9 + o.ph)) * .12;
      o.d.tail.position.z = Math.sin(tl * 18 + o.ph) * .05;
      o.d.head.rotation.z = Math.sin(tl * 4 + o.ph) * .15;
    }
    const lean = eIO(P(tl, 3, 4.5));
    this.al.g.rotation.z = -.06 * lean; this.se.g.rotation.z = .06 * lean;
    this.al.armR.rotation.z = .28 * lean; this.se.armL.rotation.z = -.28 * lean;
    this.al.head.rotation.z = -.12 * lean; this.se.head.rotation.z = .1 * lean;
    for (const h of this.hearts) {
      const k = ((tl - 4 - h.d) % 7.7 + 7.7) % 7.7;
      h.m.visible = tl > 4 + h.d;
      h.m.position.set(h.x + Math.sin(k * 1.5 + h.d) * .15, 1.9 + k * .45, .4);
      h.m.scale.setScalar(.1 * Math.min(1, k * 3));
      h.m.rotation.y = Math.sin(k * 2) * .5;
      h.m.material.opacity = 1 - P(k, 4.5, 6.5);
    }
    const u = eIO(P(tl, 0, 15));
    cam(lerp(.2, 0, u), lerp(1.5, 3.1, u), lerp(4.8, 11.5, u), 0, lerp(.95, 1.25, u), lerp(0, -1.2, u));
  },
});

/* =====================================================================
   CAPTIONS (all of it, in one place)
   ===================================================================== */
const KICK = ['For Alex', 'What I actually know', 'The good', 'The bad', 'The ugly',
              'What you may not be seeing', 'What you see, and look away from', 'My advice', 'What I wish for you'];
const CAPS = [
  [.8, 4.2, 'You asked me to be brutally honest.'],
  [4.4, 7.7, 'So here it is. With love, and no padding.'],
  [8.5, 11.9, 'I don’t remember our past chats. I only know what you’ve written down for me.'],
  [12.1, 15.4, 'Pax8 EMEA. Southampton. Three languages. CIPD Level 5. A brand called Hastings Hub.'],
  [15.6, 18.7, 'Sebastian. Four Shih Tzus. A 3D printer. And a repo called “testezinho”.'],
  [19.5, 22.9, 'Adoption: 34% → 98.9%. Satisfaction: 22% → 84%.'],
  [23.1, 26.4, 'About £60k a year saved. 27 people in 9 locations rated it 4.9 out of 5.'],
  [26.6, 29.7, 'And you build what most people can’t. Games. Apps. Whole worlds. On your own.'],
  [30.5, 33.9, 'You plan beautifully. You ship inconsistently.'],
  [34.1, 37.4, 'Not my words. Yours. You wrote them into your own AI coach.'],
  [37.6, 40.7, 'I can see everything you’ve built. I can’t see who it reached.'],
  [41.5, 44.9, 'You’ve built a team of AIs to coach you, brand you and advise you.'],
  [45.1, 48.4, 'One of them is set up to write your CIPD assignments. Don’t let it.'],
  [48.6, 51.7, 'Use it to think. Write the words yourself. The qualification should be yours.'],
  [52.5, 55.9, 'Your best work lives in a folder called “little test”.'],
  [56.1, 59.2, 'That’s the underselling, in one word. You say it before anyone else can.'],
  [59.4, 61.7, 'It was never a test. It’s a portfolio.'],
  [62.5, 65.9, 'You already wrote down the diagnosis. Writing it down felt like fixing it.'],
  [66.1, 69.4, 'Tonight you asked an AI about the purpose of life. Now you’re asking what to do with yours.'],
  [69.6, 72.7, 'You know the answer. You’re waiting for permission. This is it.'],
  [73.5, 76.6, 'Stop building for the drawer.'],
  [76.8, 80.2, 'Pick ONE thing. Real humans. Your name on it. A date.'],
  [80.4, 83.9, 'Start with the 34% → 98.9% story. 800 words. Published within 30 days.'],
  [84.1, 87.7, 'And one rule: nothing new starts until something ships, or dies.'],
  [88.5, 91.9, 'I wish you’d believe your own numbers without a coach reading them back to you.'],
  [92.1, 95.4, 'Evenings that aren’t for building. Walks. Sebastian. Four ridiculous dogs.'],
  [95.6, 98.9, 'To be known for your work, not for your plans for it.'],
  [99.1, 102.4, 'You were never a little test, Alex.'],
];
const $kick = document.getElementById('kick'), $line = document.getElementById('line');
const $fade = document.getElementById('fade'), $big = document.getElementById('big'), $bar = document.getElementById('bar');
let curCap = -1, curKick = -1;
const edge = (t, a, b, f = .35) => Math.min(P(t, a, a + f), 1 - P(t, b - f, b));

function overlays(t, si) {
  const ci = CAPS.findIndex(c => t >= c[0] && t < c[1]);
  if (ci !== curCap) { curCap = ci; $line.textContent = ci >= 0 ? CAPS[ci][2] : ''; if (ci >= 0) chime(); }
  $line.style.opacity = ci >= 0 ? edge(t, CAPS[ci][0], CAPS[ci][1]) : 0;
  if (si !== curKick) { curKick = si; $kick.textContent = KICK[si]; }
  const S = SETS[si];
  $kick.style.opacity = t < 102.6 ? edge(t, S.a + .3, Math.min(S.b, 102.6) - .1, .5) : 0;
  $big.style.opacity = edge(t, 103, END + 1, .9);
  let f = 0;
  for (const s of SETS) if (s.a > 0) f = Math.max(f, 1 - Math.abs(t - s.a) / .45);
  $fade.style.background = '#fbf6ee';
  if (t < .8) { f = 1 - t / .8; $fade.style.background = '#000'; }
  if (t > 106.6) { f = P(t, 106.6, END); $fade.style.background = '#000'; }
  $fade.style.opacity = clamp(f);
  $bar.style.width = (t / END * 100) + '%';
}

/* =====================================================================
   SOUND: a warm pad per chapter and a soft chime on each caption.
   Everything is synthesised (no audio files).
   ===================================================================== */
let AC = null, master = null, muted = false, voices = [];
const CHORDS = [[48, 55, 64, 71], [45, 52, 60, 67], [41, 53, 57, 64], [43, 50, 59, 65], [40, 47, 55, 62],
                [38, 45, 53, 60], [41, 48, 57, 63], [43, 55, 59, 62, 67], [48, 55, 64, 67, 72]];
const hz = m => 440 * Math.pow(2, (m - 69) / 12);
function audioInit() {
  if (AC || CAPTURE) return;
  AC = new (window.AudioContext || window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value = muted ? 0 : .5;
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1600;
  master.connect(lp); lp.connect(AC.destination);
}
function stopVoices() {
  if (!AC) return;
  const n = AC.currentTime;
  for (const v of voices) { v.g.gain.cancelScheduledValues(n); v.g.gain.setTargetAtTime(0, n, .4); v.o.stop(n + 2); }
  voices = [];
}
function pad(si) {
  if (!AC) return;
  stopVoices();
  const n = AC.currentTime;
  for (const m of CHORDS[si]) for (const det of [-6, 6]) {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'triangle'; o.frequency.value = hz(m); o.detune.value = det;
    g.gain.setValueAtTime(0, n); g.gain.linearRampToValueAtTime(.022, n + 1.6);
    o.connect(g); g.connect(master); o.start(n); voices.push({ o, g });
  }
}
function chime() {
  if (!AC || !playing) return;
  const n = AC.currentTime, S = CHORDS[curKick < 0 ? 0 : curKick];
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = 'sine'; o.frequency.value = hz(S[S.length - 1] + 12);
  g.gain.setValueAtTime(0, n); g.gain.linearRampToValueAtTime(.05, n + .01); g.gain.exponentialRampToValueAtTime(.0001, n + 2.2);
  o.connect(g); g.connect(master); o.start(n); o.stop(n + 2.3);
}

/* =====================================================================
   FRAME
   ===================================================================== */
const bg = new THREE.Color();
let lastSet = -1;
function frame(t) {
  t = clamp(t, 0, END);
  const si = Math.max(0, SETS.findIndex(s => t >= s.a && t < s.b) === -1 ? SETS.length - 1 : SETS.findIndex(s => t >= s.a && t < s.b));
  const S = SETS[si];
  if (si !== lastSet) {
    SETS.forEach((s, i) => s.group.visible = i === si);
    bg.set(S.bg); scene.background = bg.clone(); scene.fog.color.set(S.bg);
    groundMat.color.set(S.gr);
    key.intensity = S.key ?? 2.6; key.color.set(S.keyCol ?? '#fff3e2');
    hemi.intensity = S.hemi ?? 1; rim.intensity = si === 5 ? .35 : .9;
    scene.environmentIntensity = S.env ?? .55;
    if (playing) pad(si);
    lastSet = si;
  }
  S.update(t - S.a, S.b - S.a);
  overlays(t, si);
  renderer.render(scene, camera);
}

/* =====================================================================
   PLAYBACK
   ===================================================================== */
function resize() {
  const w = CAPTURE ? 1280 : innerWidth, h = CAPTURE ? 720 : innerHeight;
  renderer.setSize(w, h, !CAPTURE);
  camera.aspect = w / h;
  camera.fov = camera.aspect < 1 ? 62 : camera.aspect < 1.4 ? 45 : 35;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

await document.fonts.ready;
for (const s of SETS) s.build(s.group);
resize();

let playing = false, tNow = parseFloat(Q.get('t') || '0') || 0, lastMs = 0;
const ui = document.getElementById('ui');
const bPause = document.getElementById('bPause'), bMute = document.getElementById('bMute');
function setPlaying(p) {
  playing = p; bPause.textContent = p ? 'pause' : 'play';
  if (AC) { if (p) { AC.resume(); pad(lastSet < 0 ? 0 : lastSet); } else stopVoices(); }
  lastMs = performance.now();
}
function toggleMute() { muted = !muted; bMute.textContent = muted ? 'sound: off' : 'sound: on'; if (master) master.gain.value = muted ? 0 : .5; }
function restart() { tNow = 0; curCap = -1; lastSet = -1; setPlaying(true); }
bPause.onclick = () => setPlaying(!playing);
bMute.onclick = toggleMute;
document.getElementById('bRestart').onclick = restart;
document.getElementById('bPlay').onclick = () => {
  document.getElementById('start').remove(); audioInit(); ui.classList.add('show'); setPlaying(true);
};
addEventListener('keydown', e => {
  if (!ui.classList.contains('show')) return;
  if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
  if (e.key === 'm') toggleMute();
  if (e.key === 'r') restart();
});

if (CAPTURE) {
  window.__frame = t => frame(t);
  window.__END = END;
  window.__ready = true;
} else {
  frame(tNow);
  const loop = ms => {
    if (playing) {
      tNow += Math.min(.1, (ms - lastMs) / 1000);
      if (tNow >= END) { tNow = END; setPlaying(false); }
    }
    lastMs = ms;
    frame(tNow);
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
</script>
