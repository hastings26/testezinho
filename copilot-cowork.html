.hero-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,17,64,.1) 0%,rgba(11,17,64,.5) 40%,rgba(0,0,0,.94) 85%)}
body.hero-mode .hero-bg{opacity:1}

main{flex:1;display:flex;flex-direction:column;position:relative;z-index:1}
.screen{width:100%;max-width:880px;margin:0 auto;padding:36px 28px 24px 44px;flex:1;display:flex;flex-direction:column;animation:in .35s ease both}
.screen.still{animation:none}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* type */
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.85)}
.muted{color:var(--gray)}
.center{text-align:center}
h1.cover{font-size:clamp(46px,9.5vw,88px);font-weight:800;line-height:1;letter-spacing:-.025em;margin:12px 0 10px}
.cover-sub{font-size:clamp(19px,3.2vw,24px);font-weight:700}
.cover-sub b{color:var(--teal)}
.rainbow{height:4px;border-radius:4px;background:var(--rainbow);width:66%;margin:20px auto 0}
.h-sec{font-size:clamp(28px,5vw,40px);font-weight:800;letter-spacing:-.02em;line-height:1.1;text-align:center}
.sub-sec{text-align:center;color:rgba(255,255,255,.8);margin-top:8px;font-weight:600}
.line-sm{height:3px;width:120px;border-radius:3px;background:var(--rainbow);margin:6px 0 16px}

/* buttons */
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;padding-top:8px}
.btn{background:transparent;border:1.5px solid #fff;border-radius:999px;padding:14px 30px;font-size:16px;font-weight:600;letter-spacing:.04em;min-height:50px;transition:background .15s,opacity .15s,transform .1s;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:10px}
.btn:hover:not(:disabled){background:rgba(255,255,255,.1)}
.btn:active:not(:disabled){transform:scale(.98)}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn.ghost{border-color:rgba(255,255,255,.35);color:rgba(255,255,255,.85)}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:12px}
.back{background:none;border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;letter-spacing:.04em}
.back:hover{background:rgba(255,255,255,.08)}
.gname{font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--gray)}

/* home */
.hero-logo{width:112px;color:#fff;margin-bottom:34px}
.video{position:relative;width:100%;aspect-ratio:16/9;border-radius:18px;overflow:hidden;margin:30px 0 10px;background:#000;border:1px solid rgba(255,255,255,.2);box-shadow:0 30px 80px rgba(0,0,0,.55)}
.video video,.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.video.ph{display:grid;place-items:center;text-align:center;aspect-ratio:auto;min-height:min(58vw,330px);padding:26px 18px;background:
  radial-gradient(120% 90% at 20% 0%,rgba(29,78,216,.55),transparent 60%),
  radial-gradient(90% 80% at 100% 100%,rgba(0,208,156,.28),transparent 60%),#050818}
.video.ph::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:36px 36px;mask-image:radial-gradient(circle at center,#000 30%,transparent 75%);-webkit-mask-image:radial-gradient(circle at center,#000 30%,transparent 75%)}
.ph-inner{position:relative;padding:20px}
.play-ring{width:72px;height:72px;border-radius:50%;border:2px solid #fff;display:grid;place-items:center;margin:0 auto 14px;animation:pulse 2.4s ease-in-out infinite}
.play-ring::after{content:"";border-left:22px solid #fff;border-top:13px solid transparent;border-bottom:13px solid transparent;margin-left:6px}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(0,208,156,.45)}50%{box-shadow:0 0 0 16px rgba(0,208,156,0)}}
.ph-title{font-size:clamp(18px,3vw,24px);font-weight:800}
.ph-meta{font-size:13px;font-style:italic;color:rgba(255,255,255,.7);margin-top:4px}
.video-cap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:rgba(255,255,255,.75);font-weight:600;margin-bottom:26px}
.field{margin:0 auto 30px;max-width:440px;width:100%}
.field label{display:block;font-size:13px;font-weight:600;color:rgba(255,255,255,.8);margin-bottom:6px}
.field input{width:100%;background:rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.35);border-radius:12px;padding:13px 14px;font:inherit;color:#fff}
.field input::placeholder{color:rgba(255,255,255,.45)}

.paths{display:grid;gap:14px;margin:22px 0 18px}
.path{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;text-align:left;width:100%;background:rgba(5,6,14,.82);border:1.5px solid var(--line);border-radius:20px;padding:20px;transition:border-color .2s,transform .15s,background .2s;overflow:hidden;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.path::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--acc)}
.path:hover{border-color:rgba(255,255,255,.45);transform:translateY(-2px)}
.path .num{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:20px;background:var(--acc)}
.path .ptitle{display:block;font-size:21px;font-weight:800;letter-spacing:-.01em}
.path .pdesc{display:block;font-size:14.5px;color:rgba(255,255,255,.78);margin-top:2px}
.path .pmeta{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gray);margin-top:8px}
.go-arrow{width:40px;height:40px;border-radius:50%;border:1.5px solid rgba(255,255,255,.5);display:grid;place-items:center;font-size:18px;font-weight:800}
.badge{display:inline-block;margin-left:8px;font-size:11px;font-weight:800;letter-spacing:.06em;border-radius:999px;padding:3px 9px;vertical-align:middle;text-transform:uppercase}
.badge.done{background:var(--teal);color:#000}
.badge.try{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff}
.badge.resume{background:var(--blue);color:#fff}
.triple{text-align:center;border-radius:18px;padding:16px;margin:4px 0 14px;background:linear-gradient(#000,#000) padding-box,var(--rainbow) border-box;border:2px solid transparent;font-weight:800;font-size:18px}
.triple small{display:block;font-weight:600;font-size:14px;color:rgba(255,255,255,.75)}
.vault-cta{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--deep);border-radius:20px;padding:20px;margin:6px 0 10px;border:1px solid rgba(255,255,255,.12);text-align:left;width:100%}
.vault-cta .ptitle{display:block;font-size:19px;font-weight:800}
.vault-cta .pdesc{display:block;font-size:14px;color:rgba(255,255,255,.78)}

/* divider / countdown */
.divider{justify-content:center;align-items:center;text-align:center}
.divider .num{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:28px;font-weight:800;margin:0 auto 20px}
.divider h2{font-size:clamp(40px,8vw,70px);font-weight:800;letter-spacing:-.02em;line-height:1.05}
.divider p{max-width:540px;margin:20px auto 30px;color:rgba(255,255,255,.8);font-size:17px}
.rules{list-style:none;display:grid;gap:10px;max-width:520px;margin:0 auto 30px;text-align:left}
.rules li{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:15px}
.rules b{color:var(--teal)}
.count{font-size:clamp(120px,30vw,220px);font-weight:800;line-height:1;color:var(--teal);letter-spacing:-.04em}
.bump{animation:bump .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes bump{from{transform:scale(.4);opacity:.2}to{transform:scale(1);opacity:1}}

/* gauntlet */
.progress{display:flex;gap:4px;margin-bottom:22px}
.seg{flex:1;height:5px;border-radius:3px;background:#1F2937;transition:background .3s}
.seg.now{background:#fff}.seg.ok{background:var(--teal)}.seg.no{background:#6B7280}
.qhead{display:flex;justify-content:space-between;gap:12px;margin-bottom:12px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gray)}
.qhead .pts{color:var(--teal)}
h2.q{font-size:clamp(21px,3.4vw,28px);font-weight:700;line-height:1.3;margin-bottom:8px}
.hint{font-size:14px;color:rgba(255,255,255,.65);margin-bottom:18px;font-weight:600}
.opts{display:grid;gap:10px;margin-bottom:22px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:15px 16px;font-size:16px;line-height:1.45;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:rgba(255,255,255,.4)}
.opt .mk{flex:0 0 auto;width:22px;height:22px;margin-top:1px;border:2px solid rgba(255,255,255,.5);border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800}
.opt.multi .mk{border-radius:6px}
.opt[aria-pressed="true"]{border-color:var(--blue);background:rgba(29,78,216,.16)}
.opt[aria-pressed="true"] .mk{background:var(--blue);border-color:var(--blue)}
.opt[aria-pressed="true"] .mk::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
.opt.multi[aria-pressed="true"] .mk::after{content:"\2713";width:auto;height:auto;background:none;color:#fff}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--teal);background:rgba(0,208,156,.12)}
.opt.right .mk{background:var(--teal);border-color:var(--teal)}
.opt.right .mk::after{content:"\2713"!important;width:auto!important;height:auto!important;background:none!important;color:#000!important}
.opt.wrong{border-color:var(--red);background:rgba(239,68,68,.1)}
.opt.wrong .mk{background:var(--red);border-color:var(--red)}
.opt.wrong .mk::after{content:"\2715"!important;width:auto!important;height:auto!important;background:none!important;color:#fff!important}
.opt.missed{border-style:dashed}
.opt.dim{opacity:.45}
.lock-label{font-size:13px;color:var(--gray);text-align:center;margin-bottom:10px;font-weight:600}
.lock{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lock .btn{width:100%;padding:14px 10px}
.feedback{background:var(--deep);border-radius:16px;padding:18px 20px;border-left:5px solid var(--teal);margin-bottom:20px;animation:in .3s ease both}
.feedback.bad{border-left-color:var(--red)}
.feedback.mid{border-left-color:#EAB308}
.feedback h3{font-size:19px;font-weight:800;margin-bottom:6px}
.feedback p{color:rgba(255,255,255,.9);font-size:15.5px}
.feedback .label{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);margin:12px 0 4px}
.warn{margin-top:12px;font-size:14px;font-weight:700;color:var(--pink)}
.chip{display:inline-flex;align-items:center;gap:8px;margin-top:14px;font-size:14px;font-weight:700;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:7px 14px;text-decoration:none;background:transparent}
button.chip:hover,a.chip:hover{background:rgba(255,255,255,.1)}
.chip .play,.rw .play{width:0;height:0;border-left:8px solid var(--teal);border-top:5px solid transparent;border-bottom:5px solid transparent;display:inline-block}

/* myth buster */
.hud{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end;margin-bottom:10px}
.hud .v{font-size:clamp(38px,8vw,56px);font-weight:800;line-height:.95;font-variant-numeric:tabular-nums}
.hud small{display:block;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gray);margin-top:4px}
.hud .time.low .v{color:var(--red);animation:tick 1s steps(1) infinite}
@keyframes tick{50%{opacity:.55}}
.mult{font-size:22px;font-weight:800;border-radius:999px;padding:6px 16px;border:2px solid rgba(255,255,255,.3);transition:all .2s;text-align:center}
.mult.x2{border-color:var(--c2);color:var(--c2);box-shadow:0 0 22px rgba(14,165,233,.45)}
.mult.x3{border-color:var(--teal);color:#000;background:var(--teal);box-shadow:0 0 34px rgba(0,208,156,.7);animation:throb .8s ease-in-out infinite}
@keyframes throb{50%{transform:scale(1.08)}}
.timebar{height:8px;border-radius:5px;background:#1F2937;overflow:hidden;margin-bottom:22px}
.timebar div{height:100%;background:linear-gradient(90deg,var(--teal),var(--c2));border-radius:5px}
.timebar.low div{background:var(--red)}
.mcard{position:relative;min-height:230px;display:flex;flex-direction:column;justify-content:center;background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:26px 24px;margin-bottom:18px;transition:border-color .15s,background .15s}
.mcount{position:absolute;top:14px;left:20px;font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--gray)}
.mtext{font-size:clamp(22px,4.2vw,32px);font-weight:800;line-height:1.25;letter-spacing:-.01em}
.mtruth{font-size:16px;font-weight:700;margin-top:14px;color:var(--pink);min-height:1.5em}
.mcard.good{border-color:var(--teal);background:rgba(0,208,156,.1)}
.mcard.bad{border-color:var(--red);background:rgba(239,68,68,.1);animation:shake .4s}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.mbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mb{height:84px;border-radius:20px;background:transparent;border:2.5px solid;font-size:26px;font-weight:800;letter-spacing:.12em;transition:transform .08s,background .15s}
.mb:active{transform:scale(.96)}
.mb.myth{border-color:var(--red)}.mb.myth:hover{background:rgba(239,68,68,.12)}
.mb.fact{border-color:var(--teal)}.mb.fact:hover{background:rgba(0,208,156,.12)}
.mb small{display:block;font-size:11px;letter-spacing:.08em;font-weight:700;color:var(--gray);margin-top:2px}
.pop{position:fixed;left:50%;top:17%;transform:translate(-50%,-50%);font-size:56px;font-weight:800;pointer-events:none;opacity:0;z-index:9}
.pop.go{animation:pop .7s ease-out}
.pop.good{color:var(--teal)}.pop.bad{color:var(--red)}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-110%) scale(1)}}
.keys{text-align:center;font-size:12px;color:var(--gray);margin-top:12px;font-weight:600}

/* showdown */
.meter-wrap{margin-bottom:20px}
.meter-top{display:flex;justify-content:space-between;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.meter-top .tv{color:var(--teal);font-variant-numeric:tabular-nums}
.meter{height:14px;border-radius:8px;background:#1F2937;overflow:hidden;position:relative}
.meter .mfill{height:100%;border-radius:8px;transition:width .8s cubic-bezier(.2,.8,.2,1),background .4s}
.meter .goal{position:absolute;top:-3px;bottom:-3px;left:90%;width:2px;background:#fff;opacity:.7}
.persona{display:flex;gap:16px;align-items:center;margin-bottom:16px}
.avatar{flex:0 0 auto;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:22px;background:linear-gradient(135deg,var(--blue),#8B5CF6);border:2px solid rgba(255,255,255,.5)}
.avatar.mad{background:linear-gradient(135deg,#7F1D1D,var(--red))}
.avatar.happy{background:linear-gradient(135deg,var(--c3),var(--teal))}
.persona h3{font-size:19px;font-weight:800;line-height:1.2}
.persona p{font-size:13.5px;color:rgba(255,255,255,.7)}
.bubble{position:relative;background:var(--deep);border-radius:22px;padding:28px 26px 26px 26px;margin-bottom:20px}
.bubble::before{content:"\201C";position:absolute;left:12px;top:-26px;font-size:96px;line-height:1;color:var(--blue);font-weight:800}
.bubble::after{content:"\201D";position:absolute;right:16px;bottom:-62px;font-size:96px;line-height:1;color:var(--blue);font-weight:800}
.bubble .said{font-size:clamp(20px,3.6vw,27px);font-weight:700;line-height:1.3}
.bubble .rnd{font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--gray);text-transform:uppercase;margin-bottom:6px}
.delta{display:inline-block;font-weight:800;font-size:15px;border-radius:999px;padding:3px 10px;margin-left:8px}
.delta.up{background:var(--teal);color:#000}.delta.flat{background:#EAB308;color:#000}.delta.down{background:var(--red);color:#fff}
.react{font-size:18px;font-style:italic;font-weight:600;margin:4px 0 2px}

/* results */
.results h2.title{font-size:clamp(36px,6.5vw,56px);font-weight:800;text-align:center;letter-spacing:-.02em;line-height:1.05}
.who{text-align:center;color:var(--gray);font-style:italic;font-size:14px;margin-top:8px}
.score{display:flex;align-items:center;justify-content:center;gap:24px;margin:26px 0 6px;flex-wrap:wrap}
.big{font-size:clamp(80px,17vw,128px);font-weight:800;line-height:.9;color:var(--teal);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.big.fail{color:#fff}
.verdict .v{font-size:22px;font-weight:800}
.verdict .s{font-size:15px;color:rgba(255,255,255,.75)}
.section-h{font-size:20px;font-weight:700;margin:32px 0 2px}
.bars{display:grid;gap:14px}
.bar-row{display:grid;grid-template-columns:150px 1fr 60px;gap:12px;align-items:center;font-size:15px;font-weight:600}
.track{height:12px;border-radius:6px;background:#1F2937;overflow:hidden}
.fill{height:100%;border-radius:6px;width:0;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.bar-row .n{text-align:right;color:rgba(255,255,255,.8)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat .k{font-size:32px;font-weight:800;line-height:1}
.stat .l{font-size:13px;color:rgba(255,255,255,.72);margin-top:6px;font-weight:600}
.stat.alert .k{color:var(--pink)}
.rw-list{list-style:none;display:grid;gap:10px}
.rw{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 15px;text-align:left;width:100%;font-size:15px}
button.rw:hover{border-color:rgba(255,255,255,.4)}
.rw .t{font-weight:800;color:var(--teal);font-variant-numeric:tabular-nums;min-width:74px;display:flex;align-items:center;gap:7px}
.rw small{display:block;color:var(--pink);font-weight:700;font-size:12px;margin-top:4px;letter-spacing:.04em;text-transform:uppercase}
.rw .win{display:block;color:rgba(255,255,255,.85);margin-top:6px;font-size:14px}
.rw .win b{color:var(--teal)}
.clean{color:rgba(255,255,255,.82)}
.next-up{margin-top:30px;background:var(--deep);border-radius:18px;padding:18px 20px}
.next-up h3{font-size:14px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--gray);margin-bottom:10px}
.next-up .actions{justify-content:flex-start;padding-top:0}

/* vault */
.wp{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;background:linear-gradient(135deg,var(--deep),#101a5c);border:1px solid rgba(255,255,255,.18);border-radius:22px;padding:22px;margin:26px 0 18px;text-decoration:none}
a.wp:hover{border-color:rgba(255,255,255,.5)}
.doc{width:62px;height:78px;border-radius:8px;background:#fff;position:relative;box-shadow:6px 6px 0 var(--teal)}
.doc::before{content:"";position:absolute;left:12px;right:12px;top:16px;height:40px;background:repeating-linear-gradient(#1D4ED8 0 3px,transparent 3px 9px);opacity:.8}
.wp h3{font-size:clamp(20px,3.4vw,26px);font-weight:800;line-height:1.15}
.wp p{font-size:14px;color:rgba(255,255,255,.78);margin-top:4px}
.wp .dl{display:inline-flex;margin-top:12px;border:1.5px solid #fff;border-radius:999px;padding:8px 18px;font-weight:700;font-size:14px;letter-spacing:.04em}
.dls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:6px}
.dl-card{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;text-decoration:none;transition:border-color .15s,transform .15s}
a.dl-card:hover{border-color:rgba(255,255,255,.45);transform:translateY(-2px)}
.ftype{flex:0 0 auto;width:42px;height:52px;border-radius:6px;background:#fff;position:relative;box-shadow:4px 4px 0 var(--acc2,#1D4ED8)}
.ftype span{position:absolute;left:0;right:0;bottom:7px;text-align:center;font-size:9px;font-weight:800;letter-spacing:.04em;color:#0B1140}
.ftype::before{content:"";position:absolute;left:8px;right:8px;top:9px;height:20px;background:repeating-linear-gradient(var(--acc2,#1D4ED8) 0 2px,transparent 2px 6px);opacity:.75}
.dl-card h4{font-size:16px;font-weight:700;line-height:1.3}
.dl-card p{font-size:13.5px;color:rgba(255,255,255,.7);margin-top:2px}
.dl-card .go{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);margin-top:8px;display:block}
.links{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lk{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;text-decoration:none;transition:border-color .15s,transform .15s}
a.lk:hover{border-color:rgba(255,255,255,.45);transform:translateY(-2px)}
.lk .num{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px}
.lk h4{font-size:16px;font-weight:700;line-height:1.3}
.lk p{font-size:13.5px;color:rgba(255,255,255,.7);margin-top:2px}
.lk .go{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);margin-top:8px;display:block}
.soon{opacity:.55;cursor:default}
.soon .go,.wp.soon .dl{color:var(--gray);border-color:rgba(255,255,255,.3)}
.scorecard{display:grid;gap:10px;margin-top:4px}
.sc{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-weight:700}
.sc span:last-child{color:var(--teal);text-align:right}
.sc.none span:last-child{color:var(--gray);font-weight:600}

/* ---------- confetti ---------- */
function confetti(){
  if(reduced) return;
  const cv=document.getElementById("confetti"), ctx=cv.getContext("2d");
  cv.width=innerWidth*devicePixelRatio; cv.height=innerHeight*devicePixelRatio; ctx.scale(devicePixelRatio,devicePixelRatio);
  const cols=["#1D4ED8","#00D09C","#22C55E","#8B5CF6","#EC4899","#F472B6","#EAB308","#EF4444"];
  const ps=Array.from({length:150},()=>({x:innerWidth/2+(Math.random()-.5)*120,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,s:Math.random()*7+4,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0=performance.now();
  (function f(now){
    const el=now-t0; ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); ctx.clearRect(0,0,innerWidth,innerHeight);
    ps.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.globalAlpha=Math.max(0,1-el/2600);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/3,p.s,p.s/1.6);ctx.restore();});
    if(el<2600) requestAnimationFrame(f); else ctx.clearRect(0,0,innerWidth,innerHeight);
  })(t0);
}

function streamUrl(ts){
  const v=CONFIG.VIDEO; if(!v.url) return "";
  if(ts==null) return v.url;
  try{
    // Shared Stream links already carry a nav= payload (referralInfo). A second nav=
    // is ignored by Stream, so merge the start time into the existing one instead.
    const nav=encodeURIComponent(btoa(JSON.stringify({playbackOptions:{startTimeInSeconds:adjSec(ts)}})));
    const [base,qs=""]=v.url.split("?");
    const parts=qs?qs.split("&").filter(p=>p&&!/^nav=/.test(p)):[];
    parts.push("nav="+nav);
    return base+"?"+parts.join("&");
  }catch(e){ return v.url; }
}
function rewatch(ts){
  const v=CONFIG.VIDEO;
  if(v.url && (v.type==="stream"||v.type==="link")){ window.open(streamUrl(v.type==="stream"?ts:null),"_blank","noopener"); toast(`Opening at ${adjTs(ts)}`); return; }

  setTimeout(()=>{
    const box=document.getElementById("videoBox"); if(box) box.scrollIntoView({behavior:reduced?"auto":"smooth",block:"center"});
    const vid=document.getElementById("vid");
    if(vid){ const go=()=>{ vid.currentTime=adjSec(ts); vid.play().catch(()=>{}); }; vid.readyState>=1?go():vid.addEventListener("loadedmetadata",go,{once:true}); }
    else toast(`Skip to ${adjTs(ts)} in the recording`);
  },120);
}

  const opts=G.order[i].map(k=>{
    const o=q.options[k], sel=a.sel.has(k); let cls=multi?"opt multi":"opt";
    if(a.done){ if(o.c&&sel) cls+=" right"; else if(o.c) cls+=" right missed"; else if(sel) cls+=" wrong"; else cls+=" dim"; }
    return `<button class="${cls}" data-k="${k}" aria-pressed="${sel}" ${a.done?"disabled":""}><span class="mk" aria-hidden="true"></span><span>${esc(o.t)}</span></button>`;
  }).join("");
  let bottom;
  if(!a.done){
    bottom=`<div class="lock-label">Lock it in. How sure are you?</div><div class="lock">
      <button class="btn" data-sure="1" ${a.sel.size?"":"disabled"}>I&rsquo;m sure</button>
      <button class="btn ghost" data-sure="0" ${a.sel.size?"":"disabled"}>Guessing</button></div>`;
  } else {
    const last=G.step===GSTEPS.length-2, nextRound=GSTEPS[G.step+1]?.kind==="round";
    const head=a.ok?(a.sure?"Nailed it.":"Correct, and now you know it."):(multi?`Not quite. You need all ${correct.length}.`:"Not quite.");
    bottom=`<div class="feedback ${a.ok?"":"bad"}" role="status" aria-live="polite"><h3>${head}</h3><p>${esc(q.why)}</p>
      ${(!a.ok&&a.sure)?`<div class="warn">Confidently wrong. This is the one that bites in front of a customer.</div>`:""}
      <button class="chip" data-rw="${q.ts}"><span class="play"></span>${rwLabel()} ${adjTs(q.ts)}</button></div>
      <div class="actions"><button class="btn" id="next">${last?"See my result":(nextRound?"Next round":"Next question")}</button></div>`;
  }
  main.innerHTML=`<section class="screen${again?" still":""}">${topbar("The Gauntlet")}
    <div class="progress" aria-hidden="true">${segs}</div>
    <div class="qhead"><span>Round ${r.id} &middot; ${esc(r.name)}</span><span>Q${i+1}/${QUESTIONS.length} &middot; <span class="pts">${r.points} pt${r.points>1?"s":""}</span></span></div>
    <h2 class="q" tabindex="-1" data-focus>${esc(q.q)}</h2>
    <div class="hint">${multi?`Select all that apply (${correct.length} correct)`:"Choose one"}</div>
    <div class="opts" role="group" aria-label="Answer options">${opts}</div>${bottom}</section>`;
  wireHome(); wireRw();
  if(!a.done){
    main.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const k=+b.dataset.k; if(multi){a.sel.has(k)?a.sel.delete(k):a.sel.add(k);} else a.sel=new Set([k]);
      main.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-pressed",a.sel.has(+x.dataset.k)));
      main.querySelectorAll("[data-sure]").forEach(x=>x.disabled=!a.sel.size);
    });
    main.querySelectorAll("[data-sure]").forEach(b=>b.onclick=()=>{
      a.sure=b.dataset.sure==="1"; a.ok=correct.length===a.sel.size&&correct.every(k=>a.sel.has(k)); a.done=true;
      const y=scrollY; gQ(i,true); scrollTo(0,y);
      main.querySelector(".feedback")?.scrollIntoView({behavior:reduced?"auto":"smooth",block:"nearest"});
      document.getElementById("next")?.focus({preventScroll:true});
    });
  } else document.getElementById("next").onclick=()=>gGo(G.step+1);
}

function gResults(){
  G.finished=true;
  const got=QUESTIONS.reduce((s,q,i)=>s+(G.ans[i].ok?pts(q):0),0), pct=Math.round(got/GMAX*100), pass=got/GMAX>=CONFIG.PASS_MARK;
  const nOk=G.ans.filter(a=>a.ok).length, lucky=QUESTIONS.filter((q,i)=>G.ans[i].ok&&!G.ans[i].sure).length;
  const confWrong=G.ans.filter(a=>!a.ok&&a.sure).length;
  const missed=QUESTIONS.map((q,i)=>({q,i})).filter(x=>!G.ans[x.i].ok).sort((x,y)=>toSec(x.q.ts)-toSec(y.q.ts));
  const moneyMiss=QUESTIONS.filter((q,i)=>q.round===2&&!G.ans[i].ok).length;
  const prev=S.gauntlet;
  S.gauntlet={cleared:pass||!!prev?.cleared, short:`${pct}%`, line:`The Gauntlet: ${got}/${GMAX} (${pct}%) ${pass?"PASS":"retake"}`};
  const bars=ROUNDS.map((r,idx)=>{const qs=QUESTIONS.map((q,i)=>({q,i})).filter(x=>x.q.round===r.id);const ok=qs.filter(x=>G.ans[x.i].ok).length;
    return `<div class="bar-row"><span>${esc(r.name)}</span><div class="track"><div class="fill" data-w="${Math.round(ok/qs.length*100)}" style="background:${CIRCLE[idx]}"></div></div><span class="n">${ok}/${qs.length}</span></div>`;}).join("");
  main.innerHTML=`<section class="screen results">${topbar("The Gauntlet")}
    <h2 class="title" tabindex="-1" data-focus>${pass?"You survived the Gauntlet.":"The Gauntlet won this time."}</h2>
    <div class="who">${esc(S.name||"Seller")} &middot; ${today()}</div><div class="rainbow" style="width:40%"></div>
    <div class="score"><div class="big ${pass?"":"fail"}">${pct}%</div><div class="verdict"><div class="v">${pass?"PASS":"RETAKE"}</div><div class="s">${got} of ${GMAX} points<br>${nOk} of ${QUESTIONS.length} correct &middot; pass ${Math.round(CONFIG.PASS_MARK*100)}%</div></div></div>
    <div class="section-h">By round</div><div class="line-sm"></div><div class="bars">${bars}</div>
    <div class="section-h">Confidence check</div><div class="line-sm"></div>
    <div class="stats"><div class="stat"><div class="k" style="color:var(--teal)">${nOk-lucky}</div><div class="l">Sure and right</div></div>
      <div class="stat"><div class="k">${lucky}</div><div class="l">Right, but guessing</div></div>
      <div class="stat ${confWrong?"alert":""}"><div class="k">${confWrong}</div><div class="l">Sure but wrong</div></div></div>
    ${moneyMiss?`<p class="clean" style="margin-top:14px"><strong>Heads-up:</strong> you missed ${moneyMiss} commercial question${moneyMiss>1?"s":""}. Rewatch the pricing section before quoting a customer.</p>`:""}
    <div class="section-h">Your rewatch list</div><div class="line-sm"></div>
    ${missed.length?`<div class="rw-list">${missed.map(({q,i})=>`<button class="rw" data-rw="${q.ts}"><span class="t"><span class="play"></span>${adjTs(q.ts)}</span><span>${esc(q.q)}${G.ans[i].sure?"<small>Sure but wrong</small>":""}</span></button>`).join("")}</div>`:`<p class="clean">Nothing to rewatch. Clean sheet.</p>`}
    <div class="actions" style="margin-top:26px"><button class="btn ghost" id="again">Run it again</button></div>
    ${nextUp("gauntlet")}</section>`;
  requestAnimationFrame(()=>setTimeout(()=>main.querySelectorAll(".fill").forEach(f=>f.style.width=f.dataset.w+"%"),60));
  document.getElementById("again").onclick=()=>{ gNew(); G.started=true; gGo(0); };
  wireNext(); if(pass) setTimeout(confetti,250);
}

function mythCountdown(){
  main.innerHTML=`<section class="screen">${topbar("Myth Buster")}<div class="divider" style="flex:1;display:flex;flex-direction:column"><div class="count bump" id="cd" aria-live="assertive">3</div><p class="muted">Keyboard: &larr; Myth &middot; &rarr; Fact</p></div></section>`;
  wireHome();
  let n=3; const el=document.getElementById("cd");
  const iv=setInterval(()=>{ n--; if(n>=0){ el.textContent=n?n:"GO"; el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); } else { clearInterval(iv); show(mythPlay,{noFocus:true}); } }, reduced?400:700);
  cleanup=()=>clearInterval(iv);
}
function mythPlay(){
  const M={deck:shuffle(MYTHS.map((m,i)=>i)),pos:0,score:0,streak:0,best:0,right:0,answered:0,wrongs:[],rem:CONFIG.MYTH_SECONDS*1000,paused:false,lock:false,over:false,bonus:0,cleared:false};
  const timers=[]; let raf, last=performance.now();
  main.innerHTML=`<section class="screen">${topbar("Myth Buster")}
    <div class="hud"><div class="time" id="tBox"><div class="v" id="secs">${CONFIG.MYTH_SECONDS}</div><small>seconds</small></div>
      <div><div class="v" id="score">0</div><small>points</small></div><div class="mult" id="mult">&times;1</div></div>
    <div class="timebar" id="tBar"><div id="tFill" style="width:100%"></div></div>
    <div class="mcard" id="card"><div class="mcount" id="mcount"></div><div class="mtext" id="mtext" aria-live="polite"></div><div class="mtruth" id="mtruth"></div></div>
    <div class="mbtns"><button class="mb myth" id="bMyth">MYTH<small>&larr;</small></button><button class="mb fact" id="bFact">FACT<small>&rarr;</small></button></div>
    <div class="keys">Say it out loud. It helps.</div></section>`;
  wireHome();
  const $=id=>document.getElementById(id);
  const card=$("card"), secs=$("secs"), fill=$("tFill");
  function drawCard(){ const m=MYTHS[M.deck[M.pos]]; $("mcount").textContent=`${M.pos+1} / ${M.deck.length}`; $("mtext").textContent=m.s; $("mtruth").textContent=""; card.className="mcard"; }
  function drawHud(){
    const s=Math.max(0,Math.ceil(M.rem/1000)); secs.textContent=s; fill.style.width=(Math.max(0,M.rem)/(CONFIG.MYTH_SECONDS*1000)*100)+"%";
    $("tBox").classList.toggle("low",s<=10); $("tBar").classList.toggle("low",s<=10);
    const mu=M.streak>=6?3:M.streak>=3?2:1; const mEl=$("mult"); mEl.textContent=`\u00D7${mu}`; mEl.className=`mult ${mu>1?"x"+mu:""}`;
    $("score").textContent=M.score.toLocaleString("en-GB");
  }
  function tick(now){ const dt=now-last; last=now; if(!M.paused&&!M.over){ M.rem-=dt; if(M.rem<=0){ M.rem=0; drawHud(); return end(); } } drawHud(); if(!M.over) raf=requestAnimationFrame(tick); }
  function answer(isFact){
    if(M.over||M.paused||M.lock) return;
    const m=MYTHS[M.deck[M.pos]], ok=m.fact===isFact; M.answered++;
    if(ok){
      M.streak++; M.best=Math.max(M.best,M.streak); M.right++;
      const gain=100*(M.streak>=6?3:M.streak>=3?2:1); M.score+=gain; popFx(`+${gain}`,"good");
      card.className="mcard good"; M.lock=true; timers.push(setTimeout(()=>{M.lock=false;next();},reduced?120:280));
    } else {
      M.streak=0; M.rem-=3000; M.wrongs.push(m); popFx("\u22123s","bad");
      try{navigator.vibrate&&navigator.vibrate(120);}catch(e){}
      card.className="mcard"; void card.offsetWidth; card.className="mcard bad";
      $("mtruth").textContent=`It\u2019s a ${m.fact?"FACT":"MYTH"}. ${m.truth}`;
      M.paused=true; timers.push(setTimeout(()=>{ M.paused=false; last=performance.now(); if(M.rem<=0){M.rem=0;return end();} next(); },1800));
    }
    drawHud();
  }
  function next(){ if(M.over) return; M.pos++; if(M.pos>=M.deck.length){ M.bonus=Math.ceil(M.rem/1000)*50; M.score+=M.bonus; return end(); } drawCard(); }
  function end(){ if(M.over) return; M.over=true; cancelAnimationFrame(raf); show(()=>mythResults(M)); }
  const onKey=e=>{ if(e.key==="ArrowLeft"||e.key.toLowerCase()==="m"){e.preventDefault();answer(false);} if(e.key==="ArrowRight"||e.key.toLowerCase()==="f"){e.preventDefault();answer(true);} };
  document.addEventListener("keydown",onKey);
  $("bMyth").onclick=()=>answer(false); $("bFact").onclick=()=>answer(true);
  cleanup=()=>{ M.over=true; cancelAnimationFrame(raf); timers.forEach(clearTimeout); document.removeEventListener("keydown",onKey); };
  drawCard(); drawHud(); raf=requestAnimationFrame(tick);
}
function mythRank(s){ return s>=3500?"Legend":s>=CONFIG.MYTH_CLEAR_SCORE?"Myth Slayer":s>=1000?"Contender":"Rookie"; }
function mythResults(M){
  const rank=mythRank(M.score), cleared=M.score>=CONFIG.MYTH_CLEAR_SCORE, acc=M.answered?Math.round(M.right/M.answered*100):0;
  const prevBest=S.myth?.best||0, best=Math.max(prevBest,M.score);
  S.myth={cleared:cleared||!!S.myth?.cleared, best, short:best.toLocaleString("en-GB"), line:`Myth Buster: best ${best.toLocaleString("en-GB")} (${mythRank(best)})`};
  const unique=[...new Map(M.wrongs.map(w=>[w.s,w])).values()];
  main.innerHTML=`<section class="screen results">${topbar("Myth Buster")}
    <h2 class="title" tabindex="-1" data-focus>${M.bonus?"Deck cleared.":"Time&rsquo;s up."}</h2>
    <div class="who">${esc(S.name||"Seller")} &middot; ${today()}${M.score>prevBest&&prevBest?" &middot; New personal best":""}</div><div class="rainbow" style="width:40%"></div>
    <div class="score"><div class="big ${cleared?"":"fail"}">${M.score.toLocaleString("en-GB")}</div><div class="verdict"><div class="v">${rank.toUpperCase()}</div><div class="s">${cleared?"Path cleared":`Clear it at ${CONFIG.MYTH_CLEAR_SCORE.toLocaleString("en-GB")}`}${M.bonus?`<br>+${M.bonus} time bonus`:""}</div></div></div>
    <div class="section-h">The numbers</div><div class="line-sm"></div>
    <div class="stats"><div class="stat"><div class="k">${M.answered}</div><div class="l">Claims called</div></div>
      <div class="stat"><div class="k" style="color:var(--teal)">${acc}%</div><div class="l">Accuracy</div></div>
      <div class="stat"><div class="k">${M.best}</div><div class="l">Best streak</div></div></div>
    <div class="section-h">What caught you out</div><div class="line-sm"></div>
    ${unique.length?`<div class="rw-list">${unique.map(w=>`<button class="rw" data-rw="${w.ts}"><span class="t"><span class="play"></span>${adjTs(w.ts)}</span><span>${esc(w.s)}<span class="win"><b>${w.fact?"FACT":"MYTH"}.</b> ${esc(w.truth)}</span></span></button>`).join("")}</div>`:`<p class="clean">Nothing. Not one. Fierce.</p>`}
    <div class="actions" style="margin-top:26px"><button class="btn ghost" id="again">Beat my score</button></div>
    ${nextUp("myth")}</section>`;
  document.getElementById("again").onclick=()=>show(mythCountdown);
  wireNext(); if(cleared) setTimeout(confetti,250);
}

  const wp=CONFIG.WHITEPAPER_URL;
  const games=[["gauntlet","The Gauntlet"],["myth","Myth Buster"],["showdown","The Showdown"]];
  main.innerHTML=`<section class="screen">${topbar("The Vault")}
    <h2 class="h-sec" tabindex="-1" data-focus>The Vault</h2>
    <p class="sub-sec">Everything from the session, in one place.</p><div class="rainbow" style="width:40%"></div>
    ${wp?`<a class="wp" href="${esc(wp)}" target="_blank" rel="noopener" download>`:`<div class="wp soon" aria-disabled="true">`}
      <div class="doc" aria-hidden="true"></div>
      <div><div class="eyebrow muted">Download</div><h3>${esc(CONFIG.WHITEPAPER_LABEL)}</h3><p>Differentiators, the commercial model, objection handling and a timestamp index for the full session.</p><span class="dl">${wp?"Download the whitepaper":"Coming soon"}</span></div>
    ${wp?"</a>":"</div>"}
    <div class="dls">${CONFIG.DOWNLOADS.slice(0,2).map((d,i)=>{ const acc=i?"#00D09C":"#1D4ED8";
      const inner=`<span class="ftype" style="--acc2:${acc}" aria-hidden="true"><span>${esc(d.kind||"FILE")}</span></span><span><h4>${esc(d.title)}</h4><p>${esc(d.desc)}</p><span class="go">${d.url?"Download &darr;":"Coming soon"}</span></span>`;
      return d.url?`<a class="dl-card" href="${esc(d.url)}" target="_blank" rel="noopener">${inner}</a>`:`<div class="dl-card soon" aria-disabled="true">${inner}</div>`; }).join("")}</div>
    <div class="section-h">Course links</div><div class="line-sm"></div>
    <div class="links">${CONFIG.LINKS.slice(0,6).map((l,i)=>{ const inner=`<span class="num" style="background:${CIRCLE[i]}">${i+1}</span><span><h4>${esc(l.title)}</h4><p>${esc(l.desc)}</p><span class="go">${l.url?"Open &rarr;":"Link coming soon"}</span></span>`;
      return l.url?`<a class="lk" href="${esc(l.url)}" target="_blank" rel="noopener">${inner}</a>`:`<div class="lk soon" aria-disabled="true">${inner}</div>`; }).join("")}</div>
    <div class="section-h">Your scorecard</div><div class="line-sm"></div>
    <div class="scorecard">${games.map(([k,n])=>`<div class="sc ${S[k]?"":"none"}"><span>${n}${S[k]?.cleared?" &#10003;":""}</span><span>${S[k]?esc(S[k].short):"Not played yet"}</span></div>`).join("")}</div>
    <div class="actions" style="margin-top:22px"><button class="btn" id="copy">Copy my scorecard</button><button class="btn ghost" data-home>Back to paths</button></div>
    <textarea class="copybox" id="copybox" rows="4" readonly aria-label="Scorecard text"></textarea></section>`;
  wireHome();
  document.getElementById("copy").onclick=async()=>{
    const played=games.filter(([k])=>S[k]).map(([k])=>S[k].line);
    const all=games.every(([k])=>S[k]?.cleared);
    const text=`Copilot Cowork | ${S.name||"Seller"} | ${today()}${all?" | TRIPLE THREAT":""}\n${played.length?played.join("\n"):"No games played yet"}`;
    try{ await navigator.clipboard.writeText(text); toast("Copied. Post it in the team channel."); }
    catch(e){ const b=document.getElementById("copybox"); b.value=text; b.style.display="block"; b.select(); toast("Select and copy the text below"); }
  };
}

show(renderHome,{hero:true,noFocus:true});
</script>
</body>
</html>
