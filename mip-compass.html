<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MIP Compass — find the right route for each partner</title>
  <meta name="description" content="A five-minute judgement game for Channel Account Managers: assess a partner's AI maturity, choose the right commercial route, and recommend a credible next step." />
  <meta name="color-scheme" content="dark" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="mip-compass/styles.css" />

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23070B16'/><circle cx='16' cy='16' r='11' fill='none' stroke='%2300D09C' stroke-width='2'/><path d='M16 7l3.4 9.6L16 25l-3.4-8.4z' fill='%233B7BFF'/><path d='M16 7l3.4 9.6H16z' fill='%2300D09C'/></svg>" />
</head>
<body>

  <a class="skip-link" href="#mipcApp">Skip to the game</a>

  <div class="app-shell">

    <header class="app-header">
      <a class="brand-mark" href="mip-compass.html">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="14" fill="#0C1223" stroke="rgba(255,255,255,.16)" stroke-width="1.5"/>
          <circle cx="16" cy="16" r="10.5" fill="none" stroke="#00D09C" stroke-width="1.6" opacity=".55"/>
          <path d="M16 6.5l3.6 10.1L16 25.5l-3.6-8.9z" fill="#3B7BFF"/>
          <path d="M16 6.5l3.6 10.1H16z" fill="#00D09C"/>
          <circle cx="16" cy="16" r="1.9" fill="#fff"/>
        </svg>
        <span>MIP Compass<small>Partner readiness</small></span>
      </a>

      <div class="header-actions">
        <button id="mipcMotion" class="icon-btn" type="button" aria-pressed="false" title="Toggle animations">
          <span class="sr-only">Reduce animations</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3l-8 10h6l-2 8 8-10h-6z"/></svg>
        </button>
        <a id="mipcAdmin" class="icon-btn" href="mip-compass-admin.html" title="Content admin">
          <span class="sr-only">Content admin</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 7.9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0-1.1-2.7H2a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1.1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H8a1.6 1.6 0 0 0 1-1.5V2a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V8a1.6 1.6 0 0 0 1.5 1H22a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
        </a>
        <button id="mipcRestart" class="icon-btn" type="button" title="Start over">
          <span class="sr-only">Start over</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
      </div>
    </header>

    <p id="mipcStorageWarn" class="storage-warn" hidden>
      This browser is blocking local storage, so your progress will not survive a refresh. The game still works.
    </p>

    <main id="mipcApp"></main>

    <!-- Screen-reader announcements for score reveals and selections -->
    <div id="mipcLive" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

    <footer class="app-footer">
      <p>MIP Compass · a judgement game, not a knowledge test. Placeholder branding — see <code>mip-compass/data.js</code>.</p>
    </footer>

  </div>

  <script src="mip-compass/data.js"></script>
  <script src="mip-compass/store.js"></script>
  <script src="mip-compass/map.js"></script>
  <script src="mip-compass/game.js"></script>
</body>
</html>
