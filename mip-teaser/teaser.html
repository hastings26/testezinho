const grains = [0, 1, 2, 3].map(s => { const c = document.createElement('canvas'); c.width = 640; c.height = 360; const g = c.getContext('2d'); const d = g.createImageData(640, 360); const r = rng(s + 9); for (let i = 0; i < d.data.length; i += 4) { const v = r() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 22; } g.putImageData(d, 0, 0); return c; });

// ---------- props ----------

    ctx.save(); ctx.translate(x + 35, y + 32); ctx.rotate(rot);

    if (k > 0) { boil(60 + i); ctx.save(); ctx.globalAlpha = k; sk([[-14, 18], [-6, 25], [14, 6]].map(([a, b]) => [a * back(k), b * back(k)]), { w: 3, col: TEAL, j: .4 }); ctx.restore(); }

}
function laptop(t) {

  let g = ctx.createLinearGradient(708, 468, 1122, 522); g.addColorStop(0, '#e2e4e8'); g.addColorStop(1, '#8f9399'); poly([[742, 468], [1088, 468], [1122, 522], [708, 522]], g);

  ctx.fillStyle = g; ctx.fillRect(778, 262, 274, 198);
  ctx.save(); ctx.filter = 'blur(2px)';
  ctx.fillStyle = 'rgba(30,50,90,.55)'; ctx.fillRect(778, 262, 58, 198);
  ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.fillRect(848, 276, 190, 16);
  for (let i = 0; i < 3; i++) { ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fillRect(848 + i * 66, 304, 56, 60); }

  ctx.restore();

}
function keyPress(t, r, c) { if (t < 13.8 || t > 18) return false; const u = t - 13.8; const col = Math.floor(lerp(4, 12, seg(t, 14.6, 17.6))); const hop = Math.floor(u * 4) % 2 === 0; return r === 1 + (Math.floor(u * 4) % 2) && Math.abs(c - col) < 1 && hop; }

  poly([[1116, 408], [1222, 408], [1226, 418], [1112, 418]], '#fbfbf8');

function steam(t, x, y, a = 1) {

// ---------- Nib ----------
