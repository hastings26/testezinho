<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MIP Compass — find the right route for each partner</title>
<meta name="description" content="A five-minute judgement game for Channel Account Managers: assess a partner's AI maturity, choose the right commercial route, and recommend a credible next step." />
<meta name="color-scheme" content="dark" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23070B16'/><circle cx='16' cy='16' r='11' fill='none' stroke='%2300D09C' stroke-width='2'/><path d='M16 7l3.4 9.6L16 25l-3.4-8.4z' fill='%233B7BFF'/></svg>" />
<style>
/* =============================================================================
   MIP COMPASS — STYLES
   =============================================================================
   BRANDING: every colour and font is a custom property in :root below.
   Swap those values to rebrand the whole product. Nothing below :root needs
   editing to change the look.
   ============================================================================= */

:root {
  /* --- brand (placeholder — replace with approved values) --------------- */
  --ink:        #070B16;
  --ink-2:      #0C1223;
  --surface:    #121A31;
  --surface-2:  #18213D;
  --surface-3:  #1F2A4C;
  --line:       rgba(255, 255, 255, .10);
  --line-2:     rgba(255, 255, 255, .18);

  --text:       #EDF1FA;
  --text-2:     #B7C2DA;
  --muted:      #8894B2;

  --accent:     #3B7BFF;
  --accent-2:   #00D09C;
  --accent-3:   #FFB020;

  --font: 'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system,
          'Segoe UI', Roboto, Helvetica, Arial, sans-serif;

  --r-sm: 10px;
  --r-md: 16px;
  --r-lg: 24px;
  --r-xl: 32px;

  --shadow-1: 0 2px 8px rgba(0, 0, 0, .28);
  --shadow-2: 0 12px 34px rgba(0, 0, 0, .40);
  --shadow-3: 0 24px 68px rgba(0, 0, 0, .52);

  --maxw: 1180px;
}

/* ---------------------------------------------------------------- reset */
*, *::before, *::after { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  font-family: var(--font);
  color: var(--text);
  background: var(--ink);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  line-height: 1.55;
}

/* A soft aurora behind everything — depth without a stock photograph. */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: -1;
  background:
    radial-gradient(1100px 620px at 12% -8%, rgba(59, 123, 255, .20), transparent 62%),
    radial-gradient(900px 560px at 92% 4%, rgba(0, 208, 156, .14), transparent 60%),
    radial-gradient(800px 500px at 50% 108%, rgba(180, 124, 255, .12), transparent 62%),
    var(--ink);
}

img, svg { max-width: 100%; }

button { font: inherit; color: inherit; }

h1, h2, h3, h4 { line-height: 1.18; margin: 0; letter-spacing: -.02em; font-weight: 800; }
p { margin: 0; }

a { color: var(--accent-2); }

:focus-visible {
  outline: 3px solid var(--accent-2);
  outline-offset: 3px;
  border-radius: 6px;
}

/* Screen headings are focused programmatically on each screen change so screen
   readers land in the right place. That must not paint a focus ring for
   sighted users, who did not press anything. */
[tabindex="-1"]:focus,
[tabindex="-1"]:focus-visible { outline: none; }

.sr-only {
  position: absolute !important;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap; border: 0;
}

.skip-link {
  position: absolute;
  left: 12px; top: -60px;
  z-index: 200;
  background: var(--accent);
  color: #fff;
  padding: 10px 18px;
  border-radius: 0 0 var(--r-sm) var(--r-sm);
  font-weight: 700;
  text-decoration: none;
  transition: top .18s ease;
}
.skip-link:focus { top: 0; }

/* ---------------------------------------------------------------- shell */
.app-shell {
  min-height: 100%;
  display: flex;
  flex-direction: column;
}

.app-header {
  position: sticky;
  top: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px clamp(14px, 3vw, 30px);
  background: rgba(7, 11, 22, .78);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}

.brand-mark {
  display: flex;
  align-items: center;
  gap: 11px;
  font-weight: 800;
  letter-spacing: -.02em;
  text-decoration: none;
  color: var(--text);
}
.brand-mark svg { width: 30px; height: 30px; flex: none; }
.brand-mark span { font-size: 1.02rem; }
.brand-mark small {
  display: block;
  font-size: .68rem;
  font-weight: 600;
  color: var(--muted);
  letter-spacing: .06em;
  text-transform: uppercase;
}

.header-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }

.icon-btn {
  display: inline-grid;
  place-items: center;
  width: 38px; height: 38px;
  border-radius: 11px;
  border: 1px solid var(--line);
  background: var(--surface);
  cursor: pointer;
  transition: background .16s ease, border-color .16s ease, transform .16s ease;
}
.icon-btn:hover { background: var(--surface-2); border-color: var(--line-2); }
.icon-btn:active { transform: scale(.94); }
.icon-btn svg { width: 19px; height: 19px; fill: none; stroke: var(--text-2); stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn[aria-pressed="true"] { background: rgba(0, 208, 156, .16); border-color: rgba(0, 208, 156, .5); }
.icon-btn[aria-pressed="true"] svg { stroke: var(--accent-2); }

.storage-warn {
  margin: 0;
  padding: 9px 18px;
  background: rgba(255, 176, 32, .14);
  border-bottom: 1px solid rgba(255, 176, 32, .3);
  color: #FFD98A;
  font-size: .86rem;
  text-align: center;
}

main { flex: 1; }

.screen {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: clamp(20px, 4vw, 44px) clamp(14px, 3vw, 30px) 80px;
  animation: screenIn .38s cubic-bezier(.22, .9, .32, 1) both;
}
@keyframes screenIn {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: none; }
}

.app-footer {
  border-top: 1px solid var(--line);
  padding: 18px 24px;
  text-align: center;
  color: var(--muted);
  font-size: .8rem;
}
.app-footer a { color: var(--text-2); }

/* --------------------------------------------------------------- buttons */
.btn {
  --btn-bg: var(--surface-2);
  --btn-fg: var(--text);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  padding: 14px 26px;
  border-radius: 999px;
  border: 1px solid var(--line-2);
  background: var(--btn-bg);
  color: var(--btn-fg);
  font-weight: 700;
  font-size: .98rem;
  letter-spacing: -.01em;
  cursor: pointer;
  text-decoration: none;
  transition: transform .16s cubic-bezier(.2,.9,.3,1), box-shadow .18s ease,
              background .18s ease, border-color .18s ease, opacity .18s ease;
}
.btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: var(--shadow-2); }
.btn:active:not(:disabled) { transform: translateY(0) scale(.985); }
.btn:disabled { opacity: .4; cursor: not-allowed; }

.btn--primary {
  --btn-bg: linear-gradient(135deg, var(--accent) 0%, #6A4BFF 100%);
  --btn-fg: #fff;
  border-color: transparent;
  box-shadow: 0 8px 26px rgba(59, 123, 255, .34);
  flex-direction: column;
  gap: 1px;
}
.btn--primary:hover:not(:disabled) { box-shadow: 0 14px 38px rgba(59, 123, 255, .46); }
.btn-sub { font-size: .74rem; font-weight: 600; opacity: .85; letter-spacing: 0; }

.btn--ghost { --btn-bg: transparent; border-color: var(--line-2); color: var(--text-2); }
.btn--ghost:hover { background: var(--surface); color: var(--text); }

.btn--tiny { padding: 8px 16px; font-size: .82rem; }

/* --------------------------------------------------------------- welcome */
.screen--welcome { position: relative; text-align: center; padding-top: clamp(30px, 7vw, 76px); }

.welcome-art { position: absolute; inset: -40px 0 auto; height: 420px; pointer-events: none; overflow: hidden; }
.orb { position: absolute; border-radius: 50%; filter: blur(48px); opacity: .5; }
.orb-1 { width: 320px; height: 320px; background: var(--accent);    left: 4%;  top: -70px; animation: float 15s ease-in-out infinite; }
.orb-2 { width: 260px; height: 260px; background: var(--accent-2);  right: 8%; top: 20px;  animation: float 19s ease-in-out infinite reverse; }
.orb-3 { width: 220px; height: 220px; background: #B47CFF;          left: 44%; top: 90px;  animation: float 23s ease-in-out infinite; }
@keyframes float {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50%      { transform: translate(24px, 26px) scale(1.09); }
}

.welcome-inner { position: relative; max-width: 780px; margin: 0 auto; }

.eyebrow {
  text-transform: uppercase;
  letter-spacing: .16em;
  font-size: .74rem;
  font-weight: 800;
  color: var(--accent-2);
  margin-bottom: 16px;
}

.welcome-title {
  font-size: clamp(2.8rem, 9vw, 5.2rem);
  letter-spacing: -.045em;
  background: linear-gradient(135deg, #fff 20%, #9FC0FF 62%, var(--accent-2) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  margin-bottom: 12px;
}

.welcome-tagline {
  font-size: clamp(1.12rem, 2.6vw, 1.5rem);
  font-weight: 700;
  color: var(--text);
  margin-bottom: 14px;
}

.welcome-copy {
  color: var(--text-2);
  font-size: 1.02rem;
  max-width: 560px;
  margin: 0 auto 26px;
}

.welcome-meta { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 30px; }
.pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  border-radius: 999px;
  background: var(--surface);
  border: 1px solid var(--line);
  font-size: .85rem;
  font-weight: 600;
  color: var(--text-2);
}
.pill svg { width: 16px; height: 16px; fill: none; stroke: var(--accent-2); stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

.welcome-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-bottom: 54px; }

.territory-strip { border-top: 1px solid var(--line); padding-top: 26px; }
.strip-label {
  font-size: .76rem;
  text-transform: uppercase;
  letter-spacing: .14em;
  color: var(--muted);
  font-weight: 700;
  margin-bottom: 16px;
}
/* Six across on desktop, three on tablet, two on phones — never an orphan row. */
.chip-row {
  list-style: none;
  padding: 0; margin: 0;
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 10px;
}
@media (max-width: 900px) { .chip-row { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 520px) { .chip-row { grid-template-columns: repeat(2, 1fr); } }
.chip {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
  padding: 13px 15px;
  border-radius: var(--r-md);
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 3px solid var(--chip);
  text-align: left;
  transition: transform .18s ease, background .18s ease;
}
.chip:hover { transform: translateY(-3px); background: var(--surface-2); }
.chip-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--chip); margin-bottom: 5px; }
.chip strong { font-size: .96rem; }
.chip-sub { font-size: .78rem; color: var(--muted); }

/* -------------------------------------------------------------- progress */
.mission-progress {
  display: flex;
  align-items: center;
  gap: 18px;
  flex-wrap: wrap;
  padding: 14px 18px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  margin-bottom: 22px;
}

.progress-dots { list-style: none; display: flex; gap: 9px; padding: 0; margin: 0; flex: 1; }
.dot {
  position: relative;
  flex: 1;
  min-width: 42px;
  height: 42px;
  border-radius: 12px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  display: grid;
  place-items: center;
  transition: all .28s cubic-bezier(.2,.9,.3,1);
}
.dot-num { font-weight: 800; font-size: .9rem; color: var(--muted); }
.dot.is-active {
  background: linear-gradient(135deg, var(--accent), #6A4BFF);
  border-color: transparent;
  box-shadow: 0 6px 20px rgba(59,123,255,.4);
  transform: translateY(-2px);
}
.dot.is-active .dot-num { color: #fff; }
.dot.is-done { background: rgba(0,208,156,.16); border-color: rgba(0,208,156,.42); }
.dot.is-done .dot-num { display: none; }
.dot-score { font-weight: 800; font-size: .88rem; color: var(--accent-2); }

.progress-score { display: flex; align-items: baseline; gap: 6px; }
.score-label { font-size: .72rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 700; }
.score-value { font-size: 1.5rem; font-weight: 800; color: var(--text); font-variant-numeric: tabular-nums; }
.score-max { font-size: .84rem; color: var(--muted); }

/* ------------------------------------------------------------------ round */
.round-layout {
  display: grid;
  grid-template-columns: minmax(0, 380px) minmax(0, 1fr);
  gap: 22px;
  align-items: start;
}
@media (max-width: 980px) {
  .round-layout { grid-template-columns: 1fr; }
}

/* --- partner card --- */
.partner-card {
  background: linear-gradient(160deg, var(--surface-2), var(--surface));
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 22px;
  box-shadow: var(--shadow-2);
  position: sticky;
  top: 78px;
}
@media (max-width: 980px) { .partner-card { position: static; } }

.partner-head { display: flex; gap: 14px; align-items: center; margin-bottom: 18px; }
.partner-avatar {
  width: 52px; height: 52px;
  flex: none;
  border-radius: 15px;
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 1.06rem;
  letter-spacing: -.02em;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #06101F;
}
.partner-name { font-size: 1.28rem; }
.partner-sub { font-size: .84rem; color: var(--muted); margin-top: 3px; }

.partner-toggle {
  display: none;
  width: 100%;
  padding: 9px;
  margin-bottom: 12px;
  border-radius: var(--r-sm);
  border: 1px solid var(--line);
  background: var(--surface-3);
  color: var(--text-2);
  font-size: .84rem;
  font-weight: 700;
  cursor: pointer;
}
@media (max-width: 980px) { .partner-card.is-collapsible .partner-toggle { display: block; } }
.partner-card.is-collapsed .partner-body { display: none; }

.partner-facts { margin: 0 0 16px; display: grid; gap: 13px; }
.fact dt {
  font-size: .7rem;
  text-transform: uppercase;
  letter-spacing: .11em;
  color: var(--muted);
  font-weight: 800;
  margin-bottom: 5px;
  display: flex;
  align-items: center;
  gap: 7px;
}
.fact-icon { color: var(--accent-2); font-size: .68rem; }
.fact dd { margin: 0; font-size: .91rem; color: var(--text-2); }

.tag-list { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.tag-list li {
  padding: 4px 11px;
  border-radius: 999px;
  background: rgba(59,123,255,.14);
  border: 1px solid rgba(59,123,255,.28);
  font-size: .8rem;
  color: #BFD3FF;
}
.tag-list--warn li {
  background: rgba(255,176,32,.12);
  border-color: rgba(255,176,32,.3);
  color: #FFD489;
}

.partner-quote {
  margin: 0 0 16px;
  padding: 15px 17px;
  border-radius: var(--r-md);
  background: rgba(0,208,156,.09);
  border-left: 3px solid var(--accent-2);
}
.partner-quote p { font-size: .97rem; font-style: italic; color: var(--text); }
.partner-quote cite { display: block; margin-top: 8px; font-size: .78rem; color: var(--muted); font-style: normal; font-weight: 700; }

.partner-clues {
  padding: 13px 15px;
  border-radius: var(--r-md);
  background: var(--surface-3);
  border: 1px dashed var(--line-2);
}
.clues-label {
  font-size: .7rem;
  text-transform: uppercase;
  letter-spacing: .11em;
  font-weight: 800;
  color: var(--accent-3);
  margin-bottom: 7px;
}
.partner-clues ul { margin: 0; padding-left: 17px; }
.partner-clues li { font-size: .86rem; color: var(--text-2); margin-bottom: 4px; }

/* --- decision panel --- */
.decision-panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: clamp(18px, 3vw, 28px);
  box-shadow: var(--shadow-2);
}

.step-head { margin-bottom: 18px; }
.step-count {
  font-size: .72rem;
  text-transform: uppercase;
  letter-spacing: .14em;
  font-weight: 800;
  color: var(--accent-2);
  margin-bottom: 8px;
}
.step-question { font-size: clamp(1.3rem, 3.4vw, 1.85rem); }
.step-hint { font-size: .88rem; color: var(--muted); margin-bottom: 20px; }

.step-nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 26px; }

/* --- maturity --- */
.stage-track { position: relative; display: grid; gap: 10px; }
.stage-line { display: none; }

.stage {
  position: relative;
  display: grid;
  grid-template-columns: 44px 1fr;
  grid-template-rows: auto auto;
  gap: 2px 14px;
  align-items: center;
  text-align: left;
  padding: 14px 16px;
  border-radius: var(--r-md);
  border: 1px solid var(--line);
  background: var(--surface-2);
  cursor: pointer;
  transition: all .2s cubic-bezier(.2,.9,.3,1);
}
.stage:hover { background: var(--surface-3); border-color: var(--line-2); transform: translateX(4px); }
.stage-node {
  grid-row: 1 / 3;
  width: 40px; height: 40px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--surface-3);
  border: 2px solid var(--line-2);
  transition: all .22s ease;
}
.stage-num { font-weight: 800; font-size: .94rem; color: var(--muted); }
.stage-label { font-weight: 800; font-size: 1.02rem; }
.stage-desc { font-size: .85rem; color: var(--muted); }

.stage.is-selected {
  background: linear-gradient(120deg, rgba(59,123,255,.2), rgba(0,208,156,.12));
  border-color: var(--accent);
  box-shadow: 0 8px 26px rgba(59,123,255,.24);
}
.stage.is-selected .stage-node { background: var(--accent); border-color: #fff; transform: scale(1.06); }
.stage.is-selected .stage-num { color: #fff; }
/* non-colour indicator */
.stage.is-selected::after {
  content: '✓';
  position: absolute;
  right: 16px; top: 50%;
  transform: translateY(-50%);
  font-size: 1.2rem;
  font-weight: 800;
  color: var(--accent-2);
}

/* --- routes --- */
.route-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }

.route-card {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 5px;
  text-align: left;
  padding: 18px;
  border-radius: var(--r-md);
  border: 1px solid var(--line);
  background: var(--surface-2);
  cursor: pointer;
  transition: all .2s cubic-bezier(.2,.9,.3,1);
}
.route-card:hover { background: var(--surface-3); transform: translateY(-3px); border-color: var(--line-2); }
.route-icon { width: 34px; height: 34px; display: grid; place-items: center; margin-bottom: 4px; }
.route-icon svg { width: 26px; height: 26px; fill: none; stroke: var(--accent-2); stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.route-label { font-weight: 800; font-size: 1.05rem; }
.route-short { font-size: .8rem; color: var(--accent-2); font-weight: 700; }
.route-desc { font-size: .84rem; color: var(--muted); margin-top: 4px; }

.route-card.is-selected {
  background: linear-gradient(140deg, rgba(59,123,255,.22), rgba(0,208,156,.12));
  border-color: var(--accent);
  box-shadow: 0 10px 30px rgba(59,123,255,.26);
}
.route-card.is-selected::after {
  content: '✓';
  position: absolute;
  top: 14px; right: 16px;
  font-size: 1.2rem;
  font-weight: 800;
  color: var(--accent-2);
}

/* --- destination --- */
.map-wrap {
  border-radius: var(--r-lg);
  overflow: hidden;
  border: 1px solid var(--line-2);
  background: var(--ink-2);
  box-shadow: var(--shadow-2);
  margin-bottom: 16px;
}

.territory-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(215px, 1fr)); gap: 9px; }
.territory-option {
  position: relative;
  display: flex;
  gap: 11px;
  align-items: flex-start;
  text-align: left;
  padding: 13px 15px;
  border-radius: var(--r-md);
  border: 1px solid var(--line);
  border-left: 3px solid var(--chip);
  background: var(--surface-2);
  cursor: pointer;
  transition: all .18s ease;
}
.territory-option:hover { background: var(--surface-3); transform: translateY(-2px); }
.to-dot { width: 11px; height: 11px; border-radius: 50%; background: var(--chip); margin-top: 5px; flex: none; }
.to-text { display: flex; flex-direction: column; gap: 1px; }
.to-text strong { font-size: .97rem; }
.to-place { font-size: .78rem; color: var(--chip); font-weight: 700; }
.to-blurb { font-size: .79rem; color: var(--muted); margin-top: 3px; }
.territory-option.is-selected {
  background: color-mix(in srgb, var(--chip) 16%, var(--surface-2));
  border-color: var(--chip);
  box-shadow: 0 8px 24px rgba(0,0,0,.3);
}
.territory-option.is-selected::after {
  content: '✓';
  position: absolute;
  top: 12px; right: 14px;
  font-weight: 800;
  color: var(--chip);
}

/* --- conversation --- */
.convo-list { display: grid; gap: 10px; }
.convo-option {
  position: relative;
  display: grid;
  grid-template-columns: 36px 1fr;
  gap: 14px;
  align-items: center;
  text-align: left;
  padding: 16px 18px;
  padding-right: 44px;
  border-radius: var(--r-md);
  border: 1px solid var(--line);
  background: var(--surface-2);
  cursor: pointer;
  transition: all .2s cubic-bezier(.2,.9,.3,1);
}
.convo-option:hover { background: var(--surface-3); transform: translateX(4px); border-color: var(--line-2); }
.convo-key {
  width: 34px; height: 34px;
  border-radius: 10px;
  display: grid; place-items: center;
  background: var(--surface-3);
  border: 1px solid var(--line-2);
  font-weight: 800;
  font-size: .92rem;
  color: var(--muted);
}
.convo-text { font-size: .96rem; color: var(--text); line-height: 1.5; }
.convo-option.is-selected {
  background: linear-gradient(120deg, rgba(59,123,255,.2), rgba(0,208,156,.1));
  border-color: var(--accent);
  box-shadow: 0 8px 26px rgba(59,123,255,.24);
}
.convo-option.is-selected .convo-key { background: var(--accent); color: #fff; border-color: #fff; }
.convo-option.is-selected::after {
  content: '✓';
  position: absolute;
  right: 16px; top: 50%;
  transform: translateY(-50%);
  font-size: 1.2rem;
  font-weight: 800;
  color: var(--accent-2);
}

/* ----------------------------------------------------------------- reveal */
.reveal-head {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 22px 24px;
  border-radius: var(--r-lg);
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 5px solid var(--mood, var(--accent));
  margin-bottom: 18px;
  box-shadow: var(--shadow-2);
}
.mood-excellent { --mood: var(--accent-2); }
.mood-good      { --mood: #4C9AFF; }
.mood-fair      { --mood: var(--accent-3); }
.mood-early     { --mood: #B47CFF; }
.mood-slow      { --mood: #FF6B9D; }

.reveal-badge {
  width: 52px; height: 52px;
  flex: none;
  border-radius: 15px;
  display: grid; place-items: center;
  background: color-mix(in srgb, var(--mood) 20%, transparent);
  border: 1px solid color-mix(in srgb, var(--mood) 46%, transparent);
}
.reveal-badge svg { width: 26px; height: 26px; fill: none; stroke: var(--mood); stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; }
.reveal-headline { font-size: clamp(1.24rem, 3.4vw, 1.75rem); color: var(--mood); }
.reveal-partner { font-size: .88rem; color: var(--muted); margin-top: 3px; }
.reveal-score { margin-left: auto; text-align: right; }
.rs-value { display: block; font-size: 2.1rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
.rs-max { font-size: .76rem; color: var(--muted); }

.reveal-rows { display: grid; gap: 12px; margin-bottom: 18px; }

.reveal-row {
  padding: 18px 20px;
  border-radius: var(--r-md);
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 4px solid var(--grade, var(--muted));
}
.grade-full { --grade: var(--accent-2); }
.grade-high { --grade: #4C9AFF; }
.grade-part { --grade: var(--accent-3); }
.grade-none { --grade: #FF6B9D; }

.rr-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; }
.rr-label { font-size: 1.02rem; }
.rr-points { display: inline-flex; align-items: center; gap: 7px; font-weight: 800; font-size: .9rem; color: var(--grade); font-variant-numeric: tabular-nums; }
.rr-pts-icon svg { width: 17px; height: 17px; fill: none; stroke: var(--grade); stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; display: block; }

.rr-bar { height: 6px; border-radius: 999px; background: var(--surface-3); overflow: hidden; margin-bottom: 14px; }
.rr-bar-fill { display: block; height: 100%; background: var(--grade); border-radius: 999px; animation: barGrow .6s cubic-bezier(.2,.9,.3,1) both; }
@keyframes barGrow { from { width: 0 !important; } }

.rr-compare { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.reveal-row.is-long .rr-compare { grid-template-columns: 1fr; }
@media (max-width: 620px) { .rr-compare { grid-template-columns: 1fr; } }
.rr-cell { padding: 11px 13px; border-radius: var(--r-sm); background: var(--surface-2); border: 1px solid var(--line); }
.rr-cell--ideal { border-color: color-mix(in srgb, var(--accent-2) 34%, transparent); background: rgba(0,208,156,.08); }
.rr-cell--ideal.is-match { background: rgba(0,208,156,.14); }
.rr-cell-label { display: block; font-size: .68rem; text-transform: uppercase; letter-spacing: .11em; font-weight: 800; color: var(--muted); margin-bottom: 4px; }
.rr-cell-value { font-size: .92rem; font-weight: 600; }

.rr-note { font-size: .88rem; color: var(--text-2); margin-bottom: 7px; }
.rr-explain { font-size: .88rem; color: var(--muted); padding-top: 9px; border-top: 1px solid var(--line); }

.mini-map-card {
  padding: 18px;
  border-radius: var(--r-lg);
  background: var(--surface);
  border: 1px solid var(--line);
  margin-bottom: 18px;
}
.mini-map-title { font-size: 1rem; margin-bottom: 12px; }
/* Hug the SVG rather than stretching past it, so the card shows no dead bands. */
.mini-map {
  border-radius: var(--r-md);
  overflow: hidden;
  border: 1px solid var(--line);
  background: var(--ink-2);
  display: flex;
  justify-content: center;
  width: fit-content;
  max-width: 100%;
  margin: 0 auto;
}
.mini-legend { display: flex; gap: 18px; margin-top: 12px; flex-wrap: wrap; }
.legend-item { display: inline-flex; align-items: center; gap: 8px; font-size: .84rem; color: var(--text-2); }
.legend-pin { width: 14px; height: 14px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); flex: none; }
.legend-pin--player { background: #fff; border: 2px solid var(--ink); }
.legend-pin--ideal { background: var(--accent-2); border: 2px solid #fff; }

.talk-track {
  padding: 20px 22px;
  border-radius: var(--r-lg);
  background: linear-gradient(135deg, rgba(0,208,156,.14), rgba(59,123,255,.08));
  border: 1px solid rgba(0,208,156,.3);
  margin-bottom: 18px;
}
.tt-label { font-size: .72rem; text-transform: uppercase; letter-spacing: .13em; font-weight: 800; color: var(--accent-2); margin-bottom: 10px; }
.talk-track blockquote { margin: 0 0 12px; }
.talk-track blockquote p { font-size: 1.06rem; font-weight: 600; font-style: italic; }

.ambiguity-note {
  font-size: .86rem;
  color: var(--muted);
  padding: 12px 16px;
  border-radius: var(--r-md);
  background: var(--surface);
  border: 1px dashed var(--line-2);
  margin-bottom: 18px;
}

.reveal-nav { display: flex; justify-content: flex-end; }

/* ---------------------------------------------------------------- results */
.results-hero { text-align: center; margin-bottom: 34px; }

.score-ring { position: relative; width: 190px; height: 190px; margin: 18px auto 22px; }
.score-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring-track { fill: none; stroke: var(--surface-3); stroke-width: 12; }
.ring-fill {
  fill: none;
  stroke: url(#none);
  stroke: var(--accent-2);
  stroke-width: 12;
  stroke-linecap: round;
  animation: ringIn 1.1s cubic-bezier(.2,.9,.3,1) both;
}
@keyframes ringIn { from { stroke-dasharray: 0 377 !important; } }
.ring-inner { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring-score { display: block; font-size: 3rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.ring-max { font-size: .82rem; color: var(--muted); }

.results-title {
  font-size: clamp(1.9rem, 5.5vw, 3rem);
  background: linear-gradient(120deg, #fff, var(--accent-2));
  -webkit-background-clip: text; background-clip: text; color: transparent;
  margin-bottom: 10px;
}
.results-note { color: var(--text-2); max-width: 540px; margin: 0 auto; }

.insight-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 14px; margin-bottom: 18px; }
.insight-card {
  padding: 20px 22px;
  border-radius: var(--r-lg);
  background: var(--surface);
  border: 1px solid var(--line);
  border-top: 3px solid var(--ic, var(--accent));
}
.insight-card--up { --ic: var(--accent-2); }
.insight-card--focus { --ic: var(--accent-3); }
.ic-label { font-size: .72rem; text-transform: uppercase; letter-spacing: .13em; font-weight: 800; color: var(--ic); margin-bottom: 8px; }
.ic-value { font-size: 1.32rem; font-weight: 800; margin-bottom: 7px; }
.ic-detail { font-size: .88rem; color: var(--muted); }

.action-card {
  padding: 22px 24px;
  border-radius: var(--r-lg);
  background: linear-gradient(135deg, rgba(59,123,255,.16), rgba(0,208,156,.09));
  border: 1px solid rgba(59,123,255,.3);
  margin-bottom: 30px;
}
.action-title { font-size: 1.02rem; margin-bottom: 10px; display: flex; align-items: center; gap: 9px; }
.action-title span { color: var(--accent-2); }
.action-body { font-size: 1rem; color: var(--text); }

.section-title { font-size: 1.3rem; margin-bottom: 16px; }

.breakdown { margin-bottom: 30px; }
.breakdown-rows { display: grid; gap: 9px; }
.bd-row {
  display: grid;
  grid-template-columns: 32px minmax(0, 1fr) auto auto;
  gap: 14px;
  align-items: center;
  padding: 13px 16px;
  border-radius: var(--r-md);
  background: var(--surface);
  border: 1px solid var(--line);
}
@media (max-width: 760px) {
  .bd-row { grid-template-columns: 32px 1fr auto; }
  .bd-chips { grid-column: 1 / -1; }
}
.bd-index {
  width: 28px; height: 28px;
  border-radius: 8px;
  display: grid; place-items: center;
  background: var(--surface-3);
  font-weight: 800; font-size: .82rem;
  color: var(--muted);
}
.bd-name strong { display: block; font-size: .98rem; }
.bd-band { font-size: .78rem; color: var(--muted); }
.bd-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.bd-chip {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  padding: 4px 9px;
  border-radius: 8px;
  background: color-mix(in srgb, var(--grade) 16%, transparent);
  border: 1px solid color-mix(in srgb, var(--grade) 38%, transparent);
  min-width: 54px;
}
.bd-chip-label { font-size: .58rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.bd-chip-val { font-size: .86rem; font-weight: 800; color: var(--grade); font-variant-numeric: tabular-nums; }
.bd-total { font-size: 1.16rem; font-weight: 800; font-variant-numeric: tabular-nums; }

.results-nav { display: flex; gap: 11px; flex-wrap: wrap; justify-content: center; }

/* ----------------------------------------------------------------- review */
.review-card {
  padding: 20px 22px;
  border-radius: var(--r-lg);
  background: var(--surface);
  border: 1px solid var(--line);
  margin-bottom: 13px;
}
.review-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; }
.review-name { font-size: 1.1rem; }
.review-total { font-weight: 800; font-variant-numeric: tabular-nums; color: var(--accent-2); }
.review-quote { font-size: .9rem; font-style: italic; color: var(--muted); margin-bottom: 14px; }
.review-list { margin: 0; display: grid; gap: 8px; }
.review-line { display: grid; grid-template-columns: 110px 1fr; gap: 12px; align-items: baseline; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
@media (max-width: 620px) { .review-line { grid-template-columns: 1fr; gap: 3px; } }
.review-line dt { font-size: .74rem; text-transform: uppercase; letter-spacing: .1em; font-weight: 800; color: var(--muted); }
.review-line dd { margin: 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; font-size: .89rem; }
.rl-yours { font-weight: 600; }
.rl-ideal { color: var(--accent-2); font-size: .82rem; }
.rl-flag { color: var(--accent-2); font-size: .76rem; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; }
.rl-pts { margin-left: auto; font-weight: 800; font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.review-talk { margin-top: 13px; font-size: .87rem; color: var(--text-2); padding-top: 11px; border-top: 1px solid var(--line); }
.review-talk strong { color: var(--accent-2); }

/* ------------------------------------------------------------------ modal */
.modal-backdrop {
  position: fixed; inset: 0;
  z-index: 300;
  background: rgba(4, 7, 15, .74);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  display: grid;
  place-items: center;
  padding: 20px;
  animation: fadeIn .22s ease both;
}
@keyframes fadeIn { from { opacity: 0; } }

.modal {
  width: min(560px, 100%);
  max-height: 86vh;
  overflow: auto;
  padding: 28px;
  border-radius: var(--r-xl);
  background: var(--surface);
  border: 1px solid var(--line-2);
  box-shadow: var(--shadow-3);
  animation: modalIn .3s cubic-bezier(.2,.9,.3,1) both;
}
@keyframes modalIn { from { opacity: 0; transform: translateY(20px) scale(.97); } }

.modal-title { font-size: 1.4rem; margin-bottom: 16px; }
.modal-body { color: var(--text-2); margin-bottom: 20px; }
.modal-close { width: 100%; }
.modal .btn--ghost { width: 100%; margin-bottom: 10px; }

.howto-list { padding-left: 20px; margin: 0 0 16px; display: grid; gap: 10px; }
.howto-list strong { color: var(--text); }
.howto-note { font-size: .87rem; color: var(--muted); padding: 12px 14px; background: var(--surface-2); border-radius: var(--r-sm); border: 1px solid var(--line); }

.share-card {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: .92rem;
  line-height: 1.65;
  padding: 18px;
  border-radius: var(--r-md);
  background: var(--ink-2);
  border: 1px solid var(--line-2);
  color: var(--text);
  white-space: pre-wrap;
  margin: 0 0 14px;
}

/* --------------------------------------------------------------- confetti */
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 400; overflow: hidden; }
.confetti-piece {
  position: absolute;
  top: -14px;
  width: 9px; height: 15px;
  border-radius: 2px;
  animation: fall linear forwards;
}
@keyframes fall {
  to { transform: translateY(104vh) rotate(760deg); opacity: 0; }
}

/* =============================================================================
   THE MAP
   ============================================================================= */
.mipc-map { display: block; width: 100%; height: auto; }
.mipc-map--compact { width: auto; height: 340px; max-width: 100%; }
@media (max-width: 620px) { .mipc-map--compact { width: 100%; height: auto; } }

.mipc-hit { fill: transparent; }

.mipc-territory { transform-box: fill-box; }
.mipc-territory--interactive { cursor: pointer; }

.mipc-art, .mipc-plot-top { transition: transform .26s cubic-bezier(.2,.9,.3,1); }
.mipc-territory--interactive:hover .mipc-art { transform: translateY(-7px); }

.mipc-ring { opacity: 0; transition: opacity .26s ease; }
.mipc-territory.is-selected .mipc-ring { opacity: 1; }
.mipc-territory.is-selected .mipc-art { transform: translateY(-9px); }

.mipc-territory:focus { outline: none; }
.mipc-territory:focus-visible .mipc-ring { opacity: .75; }
.mipc-territory:focus-visible .mipc-hit {
  fill: rgba(255, 255, 255, .06);
  stroke: #fff;
  stroke-width: 3;
  stroke-dasharray: 7 6;
}

.mipc-territory.is-disabled { cursor: default; opacity: .82; }

/* font-size is set inline per label so the chip can be sized to match it */
.mipc-label-text {
  font-family: var(--font);
  font-weight: 800;
  letter-spacing: -.01em;
}

.mipc-rose-text { font-family: var(--font); font-size: 13px; font-weight: 800; fill: #fff; opacity: .7; }

/* roads */
.mipc-road-base { stroke: rgba(255, 245, 225, .30); stroke-width: 13; stroke-linecap: round; }
.mipc-road-dash { stroke: rgba(255, 255, 255, .55); stroke-width: 2.4; stroke-dasharray: 10 13; stroke-linecap: round; }

.mipc-route-line {
  stroke: transparent;
  stroke-width: 7;
  stroke-linecap: round;
  transition: stroke .3s ease;
}
.mipc-route-line.is-lit {
  stroke: var(--accent-2);
  stroke-dasharray: 16 12;
  animation: routeFlow 1.4s linear infinite;
  filter: drop-shadow(0 0 7px rgba(0, 208, 156, .75));
}
@keyframes routeFlow { to { stroke-dashoffset: -56; } }

/* pins */
.mipc-pin { animation: pinDrop .5s cubic-bezier(.2, 1.5, .4, 1) both; }
@keyframes pinDrop {
  from { transform: translateY(-46px) scale(.4); opacity: 0; }
}
.mipc-pin-label {
  font-family: var(--font);
  font-size: 15px;
  font-weight: 800;
  fill: #fff;
  paint-order: stroke;
  stroke: rgba(7, 11, 22, .9);
  stroke-width: 4px;
  stroke-linejoin: round;
}

/* ambient life */
.mipc-bob { animation: bob 4.2s ease-in-out infinite; }
@keyframes bob {
  0%, 100% { transform: translate(34px, 0) rotate(-1.4deg); }
  50%      { transform: translate(34px, -5px) rotate(1.4deg); }
}

.mipc-ripple { animation: ripple 3.4s ease-in-out infinite; }
.mipc-ripple-2 { animation-delay: 1.1s; }
@keyframes ripple {
  0%, 100% { opacity: .32; transform: translateX(0); }
  50%      { opacity: .78; transform: translateX(7px); }
}

.mipc-beacon { animation: beacon 2.6s ease-in-out infinite; }
@keyframes beacon {
  0%, 100% { opacity: .45; r: 3; }
  50%      { opacity: 1;   r: 4.6; }
}

.mipc-crane { animation: crane 12s ease-in-out infinite; transform-origin: 0 0; }
@keyframes crane {
  0%, 100% { transform: rotate(-13deg); }
  50%      { transform: rotate(13deg); }
}

.mipc-window { animation: winking 5s ease-in-out infinite; }
@keyframes winking {
  0%, 44%, 100% { opacity: .3; }
  52%, 88%      { opacity: .95; }
}

.mipc-pulse { animation: pulseDot 3s ease-in-out infinite; }
@keyframes pulseDot {
  0%, 100% { opacity: .55; }
  50%      { opacity: 1; }
}

.mipc-sway { animation: sway 5.4s ease-in-out infinite; transform-origin: 0 14px; }
@keyframes sway {
  0%, 100% { transform: rotate(-2deg); }
  50%      { transform: rotate(2deg); }
}

/* =============================================================================
   REDUCED MOTION
   Everything decorative stops. Nothing informational depends on animation.
   ============================================================================= */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
    scroll-behavior: auto !important;
  }
}

.reduce-motion *, .reduce-motion *::before, .reduce-motion *::after {
  animation-duration: .001ms !important;
  animation-iteration-count: 1 !important;
  transition-duration: .001ms !important;
}
.reduce-motion .orb { display: none; }
.reduce-motion .mipc-route-line.is-lit { filter: none; }

/* =============================================================================
   HIGH CONTRAST / FORCED COLOURS
   ============================================================================= */
@media (forced-colors: active) {
  .btn, .stage, .route-card, .convo-option, .territory-option { border: 2px solid ButtonBorder; }
  .stage.is-selected, .route-card.is-selected,
  .convo-option.is-selected, .territory-option.is-selected { border-color: Highlight; }
}

/* =============================================================================
   PRINT — a usable record of a completed mission
   ============================================================================= */
@media print {
  body { background: #fff; color: #000; }
  body::before, .app-header, .app-footer, .results-nav, .step-nav, .confetti { display: none !important; }
  .screen { max-width: none; padding: 0; }
  .review-card, .reveal-row, .bd-row { border: 1px solid #999; background: #fff; color: #000; page-break-inside: avoid; }
}

/* =============================================================================
   MIP COMPASS — ADMIN STYLES
   Layered on top of styles.css, which supplies :root and the button system.
   ============================================================================= */

.admin-main { max-width: 1080px; margin: 0 auto; padding: clamp(18px, 3vw, 36px) clamp(14px, 3vw, 28px) 90px; }

/* ------------------------------------------------------------------- gate */
.gate-card {
  max-width: 440px;
  margin: 8vh auto 0;
  padding: 32px;
  border-radius: var(--r-xl);
  background: var(--surface);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-3);
}
.gate-title { font-size: 1.6rem; margin-bottom: 8px; }
.gate-copy { color: var(--muted); font-size: .92rem; margin-bottom: 22px; }
.gate-form { display: grid; gap: 14px; }
.gate-error { color: #FF9CB4; font-size: .87rem; }
.gate-warn {
  margin-top: 22px;
  padding: 13px 15px;
  border-radius: var(--r-md);
  background: rgba(255, 176, 32, .1);
  border: 1px solid rgba(255, 176, 32, .3);
  color: #FFD489;
  font-size: .83rem;
}
.gate-warn strong { color: #FFE3AC; }

/* ------------------------------------------------------------------- tabs */
.admin-bar {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 24px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--line);
}
.tabs { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
.tab {
  padding: 9px 17px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--text-2);
  font-weight: 700;
  font-size: .88rem;
  cursor: pointer;
  transition: all .16s ease;
}
.tab:hover { background: var(--surface-2); color: var(--text); }
.tab.is-active {
  background: linear-gradient(135deg, var(--accent), #6A4BFF);
  border-color: transparent;
  color: #fff;
  box-shadow: 0 6px 18px rgba(59, 123, 255, .3);
}

.panel-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.panel-title { font-size: 1.5rem; margin-bottom: 5px; }
.panel-sub { color: var(--muted); font-size: .89rem; max-width: 640px; }
.sub-title { font-size: 1.05rem; margin: 26px 0 12px; }

.warn-strip {
  padding: 12px 16px;
  border-radius: var(--r-md);
  background: rgba(255, 176, 32, .11);
  border: 1px solid rgba(255, 176, 32, .3);
  color: #FFD489;
  font-size: .86rem;
  margin-bottom: 18px;
}
.warn-strip--info {
  background: rgba(59, 123, 255, .11);
  border-color: rgba(59, 123, 255, .3);
  color: #BFD3FF;
}

.empty-note {
  padding: 18px;
  border-radius: var(--r-md);
  background: var(--surface);
  border: 1px dashed var(--line-2);
  color: var(--muted);
  font-size: .89rem;
}
.empty-note code {
  background: var(--surface-3);
  padding: 2px 7px;
  border-radius: 5px;
  font-size: .84em;
}

/* -------------------------------------------------------------- scenarios */
.scenario-list { display: grid; gap: 9px; }
.scenario-row {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  padding: 15px 18px;
  border-radius: var(--r-md);
  background: var(--surface);
  border: 1px solid var(--line);
  transition: border-color .16s ease, background .16s ease;
}
.scenario-row:hover { border-color: var(--line-2); background: var(--surface-2); }
.scenario-row.is-archived { opacity: .55; border-style: dashed; }

.sr-info { flex: 1; min-width: 220px; }
.sr-name { display: block; font-size: 1rem; margin-bottom: 3px; }
.sr-meta { font-size: .81rem; color: var(--muted); }
.sr-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 7px; }
.tag {
  padding: 2px 9px;
  border-radius: 999px;
  background: rgba(0, 208, 156, .13);
  border: 1px solid rgba(0, 208, 156, .3);
  font-size: .73rem;
  color: #8FEEDA;
  font-weight: 700;
}
.theme-url {
  display: block;
  margin-top: 8px;
  font-size: .76rem;
  color: var(--text-2);
  background: var(--ink-2);
  padding: 6px 10px;
  border-radius: 6px;
  border: 1px solid var(--line);
  word-break: break-all;
}

.sr-flag {
  padding: 4px 11px;
  border-radius: 999px;
  background: rgba(255, 107, 157, .14);
  border: 1px solid rgba(255, 107, 157, .34);
  color: #FFA8C2;
  font-size: .74rem;
  font-weight: 800;
  cursor: help;
}
.sr-actions { display: flex; gap: 7px; flex-wrap: wrap; }

/* ----------------------------------------------------------------- editor */
.editor { display: grid; gap: 20px; }

.section {
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  background: var(--surface);
  padding: 22px;
  margin: 0;
}
.section-legend {
  padding: 5px 14px;
  border-radius: 999px;
  background: var(--surface-3);
  border: 1px solid var(--line-2);
  font-weight: 800;
  font-size: .84rem;
  letter-spacing: -.01em;
}
.section-hint { font-size: .84rem; color: var(--muted); margin: 10px 0 16px; }

.field { display: block; margin-bottom: 15px; }
.field-label {
  display: block;
  font-size: .72rem;
  text-transform: uppercase;
  letter-spacing: .11em;
  font-weight: 800;
  color: var(--muted);
  margin-bottom: 6px;
}
.field-hint { display: block; font-size: .79rem; color: var(--muted); margin-top: 5px; }

.input {
  width: 100%;
  padding: 11px 14px;
  border-radius: var(--r-sm);
  border: 1px solid var(--line-2);
  background: var(--ink-2);
  color: var(--text);
  font-family: inherit;
  font-size: .93rem;
  line-height: 1.5;
  transition: border-color .16s ease, background .16s ease;
}
.input:focus { border-color: var(--accent); background: var(--surface-2); }
textarea.input { resize: vertical; min-height: 62px; }
.input--num { width: 88px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 700; }
select.input { cursor: pointer; }

.code-area {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: .8rem;
  line-height: 1.55;
}

.check { display: flex; align-items: center; gap: 10px; font-size: .9rem; color: var(--text-2); cursor: pointer; margin-bottom: 14px; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }

.credit-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 10px;
  margin-bottom: 6px;
}
.credit-cell {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 11px;
  border-radius: var(--r-sm);
  background: var(--surface-2);
  border: 1px solid var(--line);
  align-items: center;
  text-align: center;
}
.credit-label { font-size: .76rem; font-weight: 700; color: var(--text-2); }

.note-stack { margin-top: 14px; }
.opt-stack { display: grid; gap: 12px; }
.opt-card {
  padding: 16px;
  border-radius: var(--r-md);
  background: var(--surface-2);
  border: 1px solid var(--line);
}
.opt-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.opt-key {
  width: 30px; height: 30px;
  border-radius: 9px;
  display: grid; place-items: center;
  background: var(--accent);
  color: #fff;
  font-weight: 800;
  font-size: .86rem;
}

.wording-row { display: flex; gap: 14px; align-items: flex-start; padding: 16px 0; border-bottom: 1px solid var(--line); }
.wording-row:last-child { border-bottom: 0; }
.wording-index {
  width: 30px; height: 30px;
  flex: none;
  border-radius: 9px;
  display: grid; place-items: center;
  background: var(--surface-3);
  font-weight: 800;
  font-size: .84rem;
  color: var(--text-2);
}
.wording-fields { flex: 1; min-width: 0; }
.wording-id { font-size: .73rem; color: var(--muted); font-family: ui-monospace, Menlo, monospace; }

.editor-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 8px; }

.issues {
  flex: 1;
  min-width: 240px;
  padding: 13px 16px;
  border-radius: var(--r-md);
  background: rgba(255, 176, 32, .11);
  border: 1px solid rgba(255, 176, 32, .3);
  color: #FFD489;
  font-size: .84rem;
}
.issues ul { margin: 7px 0 0; padding-left: 18px; }

/* -------------------------------------------------------------- analytics */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 11px; margin-bottom: 8px; }
.stat-card {
  padding: 17px 19px;
  border-radius: var(--r-md);
  background: var(--surface);
  border: 1px solid var(--line);
}
.stat-label { font-size: .71rem; text-transform: uppercase; letter-spacing: .11em; font-weight: 800; color: var(--muted); margin-bottom: 7px; }
.stat-value { font-size: 1.75rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat-sub { font-size: .78rem; color: var(--muted); margin-top: 3px; }

.bar-list { display: grid; gap: 9px; }
.bar-row { display: grid; grid-template-columns: 150px 1fr 96px; gap: 13px; align-items: center; }
@media (max-width: 620px) { .bar-row { grid-template-columns: 1fr; gap: 4px; } }
.bar-label { font-size: .86rem; font-weight: 700; color: var(--text-2); }
.bar-track { height: 9px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
.bar-fill { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 999px; }
.bar-value { font-size: .82rem; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }

.mini-table { display: grid; gap: 6px; }
.mt-row {
  display: flex;
  gap: 14px;
  align-items: center;
  padding: 11px 15px;
  border-radius: var(--r-sm);
  background: var(--surface);
  border: 1px solid var(--line);
  font-size: .87rem;
}
.mt-name { flex: 1; min-width: 0; }
.mt-plays { color: var(--muted); font-size: .8rem; }
.mt-score { font-weight: 800; font-variant-numeric: tabular-nums; color: var(--accent-2); }

/* ------------------------------------------------------------------ toast */
.toast {
  position: fixed;
  bottom: 24px; left: 50%;
  transform: translateX(-50%);
  z-index: 500;
  padding: 13px 24px;
  border-radius: 999px;
  background: var(--accent-2);
  color: #06231C;
  font-weight: 800;
  font-size: .9rem;
  box-shadow: var(--shadow-3);
  animation: toastIn .28s cubic-bezier(.2, .9, .3, 1) both;
}
.toast--bad { background: #FF6B9D; color: #2B0A18; }
.toast.is-out { animation: toastOut .4s ease forwards; }
@keyframes toastIn  { from { opacity: 0; transform: translate(-50%, 22px); } }
@keyframes toastOut { to   { opacity: 0; transform: translate(-50%, 22px); } }

</style>

<script>
/* =============================================================================
   MIP COMPASS — STORAGE ADAPTER
   =============================================================================
   Every read and write in the game goes through MIPStore. Nothing else touches
   localStorage directly.

   TO MOVE TO SUPABASE LATER:
   Replace the body of each method below with a Supabase call and keep the
   signatures. The methods are already async-shaped (they return values, and
   the game awaits nothing that would break if they became promises — see
   MIPStore.isAsync). The four things that need a backend are:

     scenarios  -> table `scenarios`      (see data.js for the column contract)
     config     -> table `config`         (single row, JSON blob)
     analytics  -> table `events`         (append-only; add org/region/team here)
     progress   -> stays local. Resuming a mission is a per-device concern.

   Analytics rows are deliberately anonymous. No names, no emails, no IDs that
   survive a browser reset. Add an org/event code as a column when you need to
   segment — the event shape already leaves room for it.
   ============================================================================= */

const MIPStore = (function () {
  'use strict';

  const KEYS = {
    scenarios: 'mipCompassScenariosV1',
    config:    'mipCompassConfigV1',
    progress:  'mipCompassProgressV1',
    analytics: 'mipCompassAnalyticsV1',
    admin:     'mipCompassAdminSessionV1',
    prefs:     'mipCompassPrefsV1'
  };

  /* localStorage can throw in private mode or when full. Never let storage
     break the game — degrade to in-memory instead. */
  const memory = {};
  let storageOk = true;
  try {
    const probe = '__mipc__';
    window.localStorage.setItem(probe, '1');
    window.localStorage.removeItem(probe);
  } catch (e) {
    storageOk = false;
  }

  function readRaw(key) {
    if (!storageOk) return Object.prototype.hasOwnProperty.call(memory, key) ? memory[key] : null;
    try { return window.localStorage.getItem(key); } catch (e) { return null; }
  }

  function writeRaw(key, value) {
    if (!storageOk) { memory[key] = value; return true; }
    try { window.localStorage.setItem(key, value); return true; }
    catch (e) { memory[key] = value; return false; }
  }

  function removeRaw(key) {
    if (!storageOk) { delete memory[key]; return; }
    try { window.localStorage.removeItem(key); } catch (e) { /* ignore */ }
  }

  function readJSON(key, fallback) {
    const raw = readRaw(key);
    if (raw === null || raw === undefined) return fallback;
    try {
      const parsed = JSON.parse(raw);
      return (parsed === null || parsed === undefined) ? fallback : parsed;
    } catch (e) {
      return fallback;
    }
  }

  function writeJSON(key, value) {
    return writeRaw(key, JSON.stringify(value));
  }

  function deepClone(value) {
    return JSON.parse(JSON.stringify(value));
  }

  /* ---------------------------------------------------------------------
     CONFIG — defaults from data.js, overridable by the admin area.
     Admin edits are stored as a full replacement object.
     --------------------------------------------------------------------- */
  function getConfig() {
    const override = readJSON(KEYS.config, null);
    if (!override) return deepClone(window.MIP_CONFIG);
    /* Shallow-merge top-level keys so a partial override cannot delete
       sections added to data.js after the override was saved. */
    const base = deepClone(window.MIP_CONFIG);
    Object.keys(override).forEach(function (k) { base[k] = override[k]; });
    return base;
  }

  function saveConfig(config) {
    return writeJSON(KEYS.config, config);
  }

  function resetConfig() {
    removeRaw(KEYS.config);
  }

  function isConfigOverridden() {
    return readJSON(KEYS.config, null) !== null;
  }

  /* ---------------------------------------------------------------------
     SCENARIOS
     --------------------------------------------------------------------- */
  function getScenarios() {
    const override = readJSON(KEYS.scenarios, null);
    if (Array.isArray(override)) return override;
    return deepClone(window.MIP_SCENARIOS);
  }

  function getActiveScenarios() {
    return getScenarios().filter(function (s) { return !s.archived; });
  }

  function saveScenarios(scenarios) {
    return writeJSON(KEYS.scenarios, scenarios);
  }

  function saveScenario(scenario) {
    const all = getScenarios();
    const idx = all.findIndex(function (s) { return s.id === scenario.id; });
    if (idx >= 0) all[idx] = scenario; else all.push(scenario);
    return saveScenarios(all);
  }

  function deleteScenario(id) {
    const all = getScenarios().filter(function (s) { return s.id !== id; });
    return saveScenarios(all);
  }

  function resetScenarios() {
    removeRaw(KEYS.scenarios);
  }

  function areScenariosOverridden() {
    return readJSON(KEYS.scenarios, null) !== null;
  }

  /* ---------------------------------------------------------------------
     PROGRESS — resume an in-flight mission after a refresh
     --------------------------------------------------------------------- */
  function getProgress() { return readJSON(KEYS.progress, null); }
  function saveProgress(state) { return writeJSON(KEYS.progress, state); }
  function clearProgress() { removeRaw(KEYS.progress); }

  /* ---------------------------------------------------------------------
     PREFERENCES
     --------------------------------------------------------------------- */
  function getPrefs() { return readJSON(KEYS.prefs, { reduceMotion: null, sound: false }); }
  function savePrefs(prefs) { return writeJSON(KEYS.prefs, prefs); }

  /* ---------------------------------------------------------------------
     ANALYTICS — append-only, anonymous.

     Event shape:
       { t: unixMs, type: string, ...payload }

     `org`, `region`, `team` and `eventCode` are intentionally left as
     optional fields the caller may add. Nothing personal is captured.
     --------------------------------------------------------------------- */
  const ANALYTICS_CAP = 2000; /* keep localStorage bounded */

  function track(type, payload) {
    const events = readJSON(KEYS.analytics, []);
    const row = { t: Date.now(), type: type };
    if (payload && typeof payload === 'object') {
      Object.keys(payload).forEach(function (k) { row[k] = payload[k]; });
    }
    events.push(row);
    /* Drop oldest first if we exceed the cap. */
    while (events.length > ANALYTICS_CAP) events.shift();
    writeJSON(KEYS.analytics, events);
    return row;
  }

  function getEvents() { return readJSON(KEYS.analytics, []); }
  function clearEvents() { removeRaw(KEYS.analytics); }

  /* Roll raw events into the metrics the brief asks for. */
  function getAnalyticsSummary() {
    const events = getEvents();
    const started   = events.filter(function (e) { return e.type === 'mission_started'; });
    const completed = events.filter(function (e) { return e.type === 'mission_completed'; });
    const rounds    = events.filter(function (e) { return e.type === 'round_scored'; });

    const avg = function (nums) {
      if (!nums.length) return 0;
      return nums.reduce(function (a, b) { return a + b; }, 0) / nums.length;
    };

    /* Per-decision averages, as a percentage of the 50 available. */
    const decisionKeys = ['maturity', 'route', 'destination', 'conversation'];
    const byDecision = {};
    decisionKeys.forEach(function (k) {
      const scores = rounds
        .map(function (r) { return r.scores && typeof r.scores[k] === 'number' ? r.scores[k] : null; })
        .filter(function (v) { return v !== null; });
      byDecision[k] = { avgPoints: avg(scores), max: 50, samples: scores.length };
    });

    /* Scenario difficulty — lowest average total is "most frequently missed". */
    const byScenario = {};
    rounds.forEach(function (r) {
      if (!r.scenarioId) return;
      if (!byScenario[r.scenarioId]) {
        byScenario[r.scenarioId] = { scenarioId: r.scenarioId, name: r.partnerName || r.scenarioId, plays: 0, total: 0 };
      }
      byScenario[r.scenarioId].plays += 1;
      byScenario[r.scenarioId].total += (r.total || 0);
    });
    const scenarioStats = Object.keys(byScenario).map(function (k) {
      const s = byScenario[k];
      return { scenarioId: s.scenarioId, name: s.name, plays: s.plays, avgScore: s.plays ? s.total / s.plays : 0 };
    }).sort(function (a, b) { return a.avgScore - b.avgScore; });

    /* Most frequently chosen weak answers (anything scoring 10 or less). */
    const weak = {};
    rounds.forEach(function (r) {
      if (!r.picked) return;
      decisionKeys.forEach(function (k) {
        const score = r.scores ? r.scores[k] : null;
        if (score === null || score === undefined || score > 10) return;
        const label = k + ': ' + r.picked[k];
        weak[label] = (weak[label] || 0) + 1;
      });
    });
    const weakList = Object.keys(weak).map(function (k) {
      return { answer: k, count: weak[k] };
    }).sort(function (a, b) { return b.count - a.count; }).slice(0, 10);

    const durations = completed
      .map(function (e) { return typeof e.durationMs === 'number' ? e.durationMs : null; })
      .filter(function (v) { return v !== null; });

    return {
      gamesStarted: started.length,
      gamesCompleted: completed.length,
      completionRate: started.length ? completed.length / started.length : 0,
      averageScore: avg(completed.map(function (e) { return e.score || 0; })),
      averageDurationMs: avg(durations),
      byDecision: byDecision,
      scenarioStats: scenarioStats,
      weakAnswers: weakList,
      totalEvents: events.length
    };
  }

  /* ---------------------------------------------------------------------
     ADMIN SESSION
     --------------------------------------------------------------------- */
  function setAdminSession(until) { writeJSON(KEYS.admin, { until: until }); }
  function hasAdminSession() {
    const s = readJSON(KEYS.admin, null);
    return !!(s && s.until && s.until > Date.now());
  }
  function clearAdminSession() { removeRaw(KEYS.admin); }

  return {
    isPersistent: function () { return storageOk; },
    isAsync: false,

    getConfig: getConfig,
    saveConfig: saveConfig,
    resetConfig: resetConfig,
    isConfigOverridden: isConfigOverridden,

    getScenarios: getScenarios,
    getActiveScenarios: getActiveScenarios,
    saveScenarios: saveScenarios,
    saveScenario: saveScenario,
    deleteScenario: deleteScenario,
    resetScenarios: resetScenarios,
    areScenariosOverridden: areScenariosOverridden,

    getProgress: getProgress,
    saveProgress: saveProgress,
    clearProgress: clearProgress,

    getPrefs: getPrefs,
    savePrefs: savePrefs,

    track: track,
    getEvents: getEvents,
    clearEvents: clearEvents,
    getAnalyticsSummary: getAnalyticsSummary,

    setAdminSession: setAdminSession,
    hasAdminSession: hasAdminSession,
    clearAdminSession: clearAdminSession,

    _keys: KEYS
  };
})();

window.MIPStore = MIPStore;

</script>
<script>

   =============================================================================
   An original SVG world. Territory names, colours and order all come from

   Usage:
     const map = MIPMap.create(containerEl, { interactive: true, onSelect: fn });
     map.setSelected('discover');
     map.setMarkers([{ territory:'discover', kind:'player' }, ...]);
     map.highlightRoute('broker');

   Accessibility: every territory is a real focusable button with an aria-label
   and aria-pressed state. Arrow keys move between territories, Enter/Space
   selects. Nothing here requires dragging or a pointer.
   ============================================================================= */

const MIPMap = (function () {
  'use strict';

  const SVG_NS = 'http://www.w3.org/2000/svg';

  /* Hand-placed positions. The landscape art is tuned for these six points —
     if you add a seventh play, place it here and extend ROADS below. */
  const LAYOUT = {
    discover:  { x: 168, y: 432, label: 'below' },
    sell:      { x: 336, y: 236, label: 'above' },
    buy:       { x: 524, y: 470, label: 'below' },
    build:     { x: 566, y: 158, label: 'above' },
    implement: { x: 762, y: 412, label: 'below' },
    manage:    { x: 872, y: 190, label: 'above' }
  };

  /* Roads: [from, to, whichRoutesUseIt] */
  const ROADS = [
    ['discover',  'sell',      ['broker', 'builder']],
    ['sell',      'buy',       ['broker']],
    ['sell',      'build',     ['builder']],
    ['buy',       'implement', ['broker']],
    ['build',     'implement', ['builder']],
    ['implement', 'manage',    ['broker', 'builder']]
  ];

  let uidCounter = 0;

  function el(name, attrs, parent) {
    const node = document.createElementNS(SVG_NS, name);
    if (attrs) {

        node.setAttribute(k, attrs[k]);

    if (parent) parent.appendChild(node);
    return node;

  /* Curved road between two points — a gentle arc rather than a straight line
     so the world reads as a landscape, not a flowchart. */
  function roadPath(a, b) {
    const mx = (a.x + b.x) / 2;
    const my = (a.y + b.y) / 2;
    /* Bow the curve perpendicular to the line, scaled by distance. */
    const dx = b.x - a.x;
    const dy = b.y - a.y;
    const len = Math.sqrt(dx * dx + dy * dy) || 1;
    const bow = Math.min(60, len * 0.16);
    const nx = -dy / len;
    const ny = dx / len;
    return 'M ' + a.x + ' ' + a.y + ' Q ' + (mx + nx * bow) + ' ' + (my + ny * bow) + ' ' + b.x + ' ' + b.y;
  }
